<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manufacture - Pengadaan Barang</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#0E1B3D;
    --paper:#FFFFFF;
    --paper-deep:#EDF1FB;
    --panel:#FFFFFF;
    --line:#E1E7F4;
    --rail:#0A2463;
    --rail-grad:linear-gradient(180deg,#0A2463 0%,#1E48B5 38%,#A8285F 74%,#D7263D 100%);
    --rail-soft:#1A43A0;
    --grad:linear-gradient(120deg,#1F4FC2 0%,#7B3FB5 50%,#D7263D 100%);
    --blue:#1F4FC2;
    --accent:#D7263D;
    --accent-deep:#C21F36;
    --accent-fg:#FFFFFF;
    --rail-accent:#FFFFFF;
    --muted:#5B6C8F;
    --btn-bg:var(--grad);
    --btn-fg:#FFFFFF;
    --glow-blue:rgba(31,79,194,.10);
    --glow-red:rgba(215,38,61,.09);
    --focus:rgba(31,79,194,.22);
    --shadow:0 1px 2px rgba(11,42,111,.06),0 10px 30px rgba(31,79,194,.10);
    --row-hover:rgba(31,79,194,.05);
    --paper-blur:rgba(255,255,255,.88);
    --chart-bar:#D7263D;
    --chart-line:#1F4FC2;
    --band:linear-gradient(90deg,#E4EDFF 0%,#EFE9FA 55%,#FBE6EA 100%);
    --band-shadow:0 10px 18px -12px rgba(11,42,111,.35);
  }
  html[data-theme="dark"]{
    --ink:#E8EEFB;
    --paper:#070C1C;
    --paper-deep:#0E1636;
    --panel:#0B1330;
    --line:#1C2B55;
    --rail:#050E2B;
    --rail-grad:linear-gradient(180deg,#050E2B 0%,#0E2A7A 38%,#6B1B4C 74%,#8A1428 100%);
    --rail-soft:#0C1838;
    --grad:linear-gradient(120deg,#2F5BD8 0%,#7B3FB5 50%,#E0364C 100%);
    --blue:#6EA0FF;
    --accent:#FF5468;
    --accent-deep:#FF8794;
    --accent-fg:#FFFFFF;
    --rail-accent:#FFFFFF;
    --muted:#8E9CC0;
    --btn-bg:var(--grad);
    --btn-fg:#FFFFFF;
    --glow-blue:rgba(47,91,216,.16);
    --glow-red:rgba(224,54,76,.12);
    --focus:rgba(110,160,255,.30);
    --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.42);
    --row-hover:rgba(110,160,255,.07);
    --paper-blur:rgba(7,12,28,.88);
    --chart-bar:#FF5468;
    --chart-line:#6EA0FF;
    --band:linear-gradient(90deg,#0F1B45 0%,#1B1846 55%,#2B1531 100%);
    --band-shadow:0 10px 18px -12px rgba(0,0,0,.7);
  }
  html[data-theme="dark"] .stat-card .icon{background:var(--rail-soft);}
  *{box-sizing:border-box;}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--paper);color:var(--ink);}
  h1,h2{font-family:Georgia,serif;font-weight:normal;margin:0;}
  button{cursor:pointer;font-family:inherit;}
  input,select{font-family:inherit;font-size:14px;}

  .app{display:flex;min-height:100vh;}

  .sidebar{width:76px;flex-shrink:0;background:var(--rail-grad);display:flex;flex-direction:column;align-items:center;padding:24px 0;position:sticky;top:0;height:100vh;align-self:flex-start;z-index:20;}
  .brand{padding:0 4px;margin-bottom:28px;text-align:center;background:transparent;border:none;display:block;cursor:pointer;font-family:inherit;border-radius:8px;transition:transform .15s ease;}
  .brand:hover{transform:scale(1.06);}
  .brand:active{transform:scale(.96);}
  .brand:focus-visible{outline:2px solid var(--accent);outline-offset:4px;}
  .brand-mark{width:44px;height:44px;margin:0 auto 10px;}
  .brand-mark svg{width:100%;height:100%;display:block;}
  .brand .name{color:var(--rail-accent);font-size:10px;font-weight:700;letter-spacing:.06em;}

  .nav{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;}
  .nav button{position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;background:#FFFFFF;border:2px solid #FFFFFF;border-radius:10px;transition:transform .12s ease,box-shadow .15s ease;}
  .nav button img{width:30px;height:30px;display:block;pointer-events:none;}
  .nav button:hover,.nav button:focus-visible{transform:translateY(-1px);box-shadow:0 3px 12px rgba(255,255,255,.22);}
  .nav button.active{box-shadow:0 0 0 3px rgba(255,255,255,.55),0 0 20px rgba(255,255,255,.4);}
  .nav button::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:#FFFFFF;color:#0E1B3D;font-size:12px;line-height:1;padding:7px 10px;border-radius:4px;white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s ease;z-index:100;}
  .nav button:hover::after,.nav button:focus-visible::after{opacity:1;visibility:visible;}
  .add-btn{position:relative;margin:8px 0 0;width:44px;height:44px;padding:0;background:#F4F4F2;border:none;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 2px 10px rgba(255,255,255,.12);transition:transform .12s ease,box-shadow .15s ease;}
  .add-btn svg{width:22px;height:22px;display:block;pointer-events:none;}
  .add-btn:hover,.add-btn:focus-visible{transform:translateY(-1px);box-shadow:0 0 0 1px rgba(255,255,255,.15),0 4px 14px rgba(255,255,255,.2);}
  .add-btn:active{transform:translateY(0) scale(.97);}
  .add-btn::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:#FFFFFF;color:#0E1B3D;font-size:12px;line-height:1;padding:7px 10px;border-radius:4px;white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s ease;z-index:100;}
  .add-btn:hover::after,.add-btn:focus-visible::after{opacity:1;visibility:visible;}
  .sidebar-footer{margin-top:auto;padding:24px 6px 0;color:rgba(255,255,255,.72);font-size:10px;line-height:1.35;text-align:center;word-break:break-word;}
  .header-actions{display:flex;align-items:center;gap:14px;}
  .theme-toggle{padding:0;background:transparent;border:none;display:block;flex-shrink:0;}
  .switch{position:relative;display:block;width:52px;height:30px;border:2px solid var(--muted);border-radius:30px;background:transparent;transition:background .2s ease,border-color .2s ease;}
  .switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;transition:left .2s ease,background .2s ease;}
  .switch .knob svg{width:12px;height:12px;display:block;}
  .switch .knob svg path{fill:var(--paper);}
  html[data-theme="dark"] .switch{border-color:transparent;background:var(--grad);}
  html[data-theme="dark"] .switch .knob{left:25px;background:#14181D;}
  html[data-theme="dark"] .switch .knob svg path{fill:#F4E9D8;}
  .theme-toggle:focus-visible .switch{outline:2px solid var(--accent);outline-offset:3px;}

  .main{flex:1;min-width:0;padding:32px;}

  .page-header{display:flex;align-items:center;justify-content:between;justify-content:space-between;margin-bottom:24px;}
  .page-header h1{font-size:24px;}
  .page-header p{color:var(--muted);font-size:14px;margin-top:4px;}
  .btn-dark{background:var(--btn-bg);color:var(--btn-fg);border:none;padding:10px 16px;font-size:14px;display:flex;align-items:center;gap:8px;}
  .btn-accent{background:var(--grad);color:#fff;border:none;padding:10px 20px;font-size:14px;}
  .btn-plain{background:transparent;border:none;color:var(--muted);padding:10px 20px;font-size:14px;}
  .btn-outline{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:10px 16px;font-size:14px;display:flex;align-items:center;gap:8px;}

  .stat-row{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:24px;}
  .stat-card{flex:1;min-width:190px;background:var(--panel);border:1px solid var(--line);padding:20px;}
  .stat-card .icon{width:32px;height:32px;background:var(--paper-deep);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:15px;}
  .stat-card .label{color:var(--muted);font-size:13px;}
  .stat-card .value{font-family:Georgia,serif;font-size:24px;margin-top:12px;}

  .grid-2{display:grid;grid-template-columns:2fr 3fr;gap:16px;}
  @media (max-width:900px){.grid-2{grid-template-columns:1fr;}}
  .panel{background:var(--panel);border:1px solid var(--line);padding:20px;}
  .panel h2{color:var(--ink);font-family:system-ui,sans-serif;font-size:13px;margin-bottom:16px;color:var(--muted);}

  .status-row{display:flex;align-items:center;gap:12px;font-size:13px;margin-bottom:10px;}
  .status-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;font-size:12px;border:1px solid;white-space:nowrap;}
  .status-dot{width:6px;height:6px;border-radius:50%;}
  .bar-track{flex:1;height:8px;background:var(--paper-deep);}
  .bar-fill{height:100%;}
  .count-label{width:26px;text-align:right;color:var(--muted);}

  .filters{display:flex;flex-wrap:wrap;gap:12px;margin:0 -32px 16px;padding:12px 32px;position:sticky;top:0;z-index:15;background:var(--paper);}
  .search-box{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--paper);border:1px solid var(--line);min-width:220px;}
  .search-box input{border:none;background:transparent;padding:10px 0;width:100%;outline:none;color:var(--ink);}
  select.filter-select{padding:9px 10px;background:var(--paper);border:1px solid var(--line);color:var(--ink);}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  thead tr{border-bottom:1px solid var(--line);}
  th{text-align:left;padding:12px 16px;font-weight:normal;color:var(--muted);}
  td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top;}
  .table-wrap{background:var(--panel);border:1px solid var(--line);overflow-x:auto;}
  .empty-state{padding:48px 20px;text-align:center;color:var(--muted);font-size:14px;}
  .sub-text{color:var(--muted);font-size:12px;margin-top:2px;}
  .mono{font-family:ui-monospace,Consolas,monospace;}
  .row-actions{display:flex;align-items:center;gap:14px;}
  .row-actions button{background:none;border:none;color:var(--muted);font-size:13px;padding:0;}
  .status-select{border:1px solid currentColor;border-radius:8px;background-color:var(--panel);background-color:color-mix(in srgb,currentColor 9%,var(--panel));font-size:12.5px;font-weight:600;padding:7px 10px;min-width:118px;cursor:pointer;transition:box-shadow .15s ease,transform .1s ease;}
  td:nth-child(n+5):nth-child(-n+8){white-space:nowrap;}
  .status-select:hover{box-shadow:0 2px 8px color-mix(in srgb,currentColor 28%,transparent);}
  .status-select:focus{outline:none;box-shadow:0 0 0 3px var(--focus);}
  .status-select option{color:var(--ink);background:var(--panel);font-weight:500;}
  tr.row-flash td{animation:rowFlash 1.6s ease;}
  @keyframes rowFlash{from{background:rgba(217,138,43,.38);}to{background:transparent;}}
  .load-more{padding:18px;text-align:center;color:var(--muted);font-size:13px;}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:8px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .save-layer{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:1;transition:opacity .25s ease;}
  .save-layer[hidden]{display:none;}
  .save-layer.out{opacity:0;}
  .save-layer.toast{align-items:flex-end;padding-bottom:28px;}
  .save-layer.block{background:rgba(10,13,17,.5);pointer-events:auto;}
  .save-card{display:flex;align-items:center;gap:14px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:18px 26px;box-shadow:0 14px 40px rgba(0,0,0,.35);animation:savePop .22s ease;}
  .save-layer.center .save-card{flex-direction:column;gap:12px;padding:28px 40px;min-width:230px;}
  @keyframes savePop{from{opacity:0;transform:translateY(8px) scale(.94);}to{opacity:1;transform:none;}}
  .save-text{font-size:14px;font-weight:700;letter-spacing:.06em;}
  .save-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .save-spinner{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite;}
  .save-icon svg{width:40px;height:40px;display:block;}
  .sc-circle{stroke:#3F7D58;stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151;animation:scDraw .5s ease forwards;}
  .sc-tick{stroke:#3F7D58;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:scDraw .3s .38s ease forwards;}
  .sc-x{stroke:#C1443C;stroke-width:4;stroke-linecap:round;}
  .save-card[data-state="saved"] .save-text{color:#3F7D58;}
  .save-card[data-state="error"] .save-text{color:#C1443C;}
  @keyframes scDraw{to{stroke-dashoffset:0;}}
  .modal-overlay{position:fixed;inset:0;background:rgba(10,13,17,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;}
  .modal-overlay[hidden]{display:none;}
  .modal{width:100%;max-width:360px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:28px 24px 22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:modalIn .15s ease;}
  @keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.97);}to{opacity:1;transform:none;}}
  .modal-edit{max-width:680px;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;text-align:left;padding:22px;}
  .edit-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .edit-head h2{font-size:20px;}
  .edit-head button{background:none;border:none;font-size:24px;line-height:1;color:var(--muted);padding:2px 8px;}
  #editForm{max-width:none;}
  @media (max-width:600px){.field-grid{grid-template-columns:1fr;}}
  .modal-icon{width:44px;height:44px;margin:0 auto 14px;border-radius:50%;background:#C1443C;color:#fff;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .modal-confirm h3{margin:0 0 8px;font-size:17px;letter-spacing:.02em;}
  .modal-confirm p{margin:0 0 22px;color:var(--muted);font-size:13px;min-height:1em;word-break:break-word;}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions button{flex:1;padding:11px 12px;font-size:14px;border-radius:8px;border:1px solid var(--line);}
  .modal-no{background:var(--paper);color:var(--ink);}
  .modal-yes{background:#C1443C;color:#fff;border-color:#C1443C !important;}
  .modal-actions button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  form{display:flex;flex-direction:column;gap:20px;max-width:760px;}
  .form-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .form-header button{background:none;border:none;font-size:20px;color:var(--muted);}
  fieldset{border:none;padding:0;margin:0;}
  .section{background:var(--panel);border:1px solid var(--line);padding:20px;}
  .section h3{color:var(--muted);font-size:12px;margin:0 0 16px;font-weight:normal;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .field{display:flex;flex-direction:column;gap:6px;font-size:13px;}
  .field span{color:var(--muted);}
  .field span .req{color:var(--accent-deep);}
  .field input,.field select{padding:9px 10px;background:var(--paper);border:1px solid var(--line);color:var(--ink);}
  .field input[readonly]{opacity:.7;}
  .form-actions{display:flex;align-items:center;gap:12px;}

  .loading{color:var(--muted);font-size:14px;}

  /* ===== Tema: Biru–Merah Gradien Putih ===== */
  body{background:radial-gradient(760px 380px at 8% -60px,var(--glow-blue),transparent 70%),radial-gradient(760px 380px at 95% -60px,var(--glow-red),transparent 70%),var(--paper);background-attachment:fixed;}
  .sidebar{background:var(--rail-grad);box-shadow:2px 0 18px rgba(11,42,111,.18);}
  .page-header h1{font-size:26px;letter-spacing:.01em;}
  .page-header h1::after{content:"";display:block;width:44px;height:3px;border-radius:3px;background:var(--grad);margin-top:8px;}
  .stat-card,.panel,.table-wrap,.section{border-radius:12px;box-shadow:var(--shadow);}
  .modal .section{box-shadow:none;}
  .stat-card{position:relative;overflow:hidden;}
  .stat-card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--grad);}
  .stat-card .icon{border-radius:8px;}
  .btn-dark,.btn-accent,.btn-outline,.btn-plain{border-radius:8px;font-weight:600;}
  .btn-dark,.btn-accent{transition:transform .12s ease,filter .15s ease;}
  .btn-dark:hover,.btn-accent:hover{filter:brightness(1.1);transform:translateY(-1px);}
  .btn-accent{color:var(--accent-fg);background:var(--grad);}
  .btn-dark,.btn-accent{box-shadow:0 4px 14px rgba(31,79,194,.25);}
  .search-box,select.filter-select,.field input,.field select{border-radius:8px;transition:border-color .15s ease,box-shadow .15s ease;}
  .search-box:focus-within,select.filter-select:focus,.field input:focus,.field select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--focus);}
  .filters{background:var(--paper-blur);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;}
  tbody tr{transition:background .15s ease;}
  tbody tr:hover td{background:var(--row-hover);}
  .bar-track{border-radius:6px;overflow:hidden;}
  .status-badge{border-radius:6px;}

  /* ===== Pita judul + pencarian (Daftar Pengadaan): latar warna & garis pemisah dari paling atas ===== */
  .list-band{margin:-32px -32px 0;padding:28px 32px 8px;background:var(--band);}
  .filters{background:var(--band);-webkit-backdrop-filter:none;backdrop-filter:none;padding:12px 32px 18px;margin-bottom:18px;box-shadow:var(--band-shadow);}
  .filters::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--grad);}

  /* ===== Bukti / foto ===== */
  .proof-list{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
  .proof-item{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--paper-deep);}
  .proof-item a{display:block;width:100%;height:100%;}
  .proof-item img{width:100%;height:100%;object-fit:cover;display:block;}
  .proof-item.pending{border-color:var(--blue);}
  .proof-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(10,20,50,.78);color:#fff;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;}
  .proof-del:hover{background:#D7263D;}
  .proof-new{position:absolute;left:4px;bottom:4px;background:var(--grad);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;}
  .proof-empty{color:var(--muted);font-size:13px;padding:6px 0;}
  .proof-broken{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:6px;text-align:center;color:var(--muted);font-size:11px;}
  .proof-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .proof-actions .btn-outline:disabled{opacity:.5;cursor:not-allowed;}
  .proof-hint{color:var(--muted);font-size:12px;}
  .proof-btn{display:inline-flex !important;align-items:center;gap:2px;}
  .proof-btn span{font-size:11px;font-weight:700;color:var(--accent-deep);}
  .modal-proof{max-width:780px;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;text-align:left;padding:22px;}
  .proof-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
  .proof-card{display:block;border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;color:var(--ink);background:var(--paper-deep);}
  .proof-card img{width:100%;height:170px;object-fit:cover;display:block;}
  .proof-card .proof-broken{height:170px;}
  .proof-card span{display:block;padding:6px 8px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ===== Penerimaan: sesuai / kurang / lebih ===== */
  .tm-badge{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;}
  .tm-badge.kurang,#terimaHint.kurang,#tHint.kurang{color:#D7263D;background:rgba(215,38,61,.12);}
  .tm-badge.lebih,#terimaHint.lebih,#tHint.lebih{color:#B5760B;background:rgba(224,154,26,.16);}
  .tm-badge.sesuai,#terimaHint.sesuai,#tHint.sesuai{color:#1B8A5A;background:rgba(31,163,107,.14);}
  .terima-note{display:flex;align-items:center;gap:10px;min-height:22px;}
  #terimaHint,#tHint{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;}
  #terimaHint:empty,#tHint:empty{display:none;}
  .link-btn{background:none;border:none;padding:0;color:var(--blue);font-size:12px;text-decoration:underline;cursor:pointer;}
  .stat-link{cursor:pointer;transition:transform .12s ease,box-shadow .15s ease;}
  .stat-link:hover,.stat-link:focus-visible{transform:translateY(-2px);outline:none;box-shadow:0 0 0 3px var(--focus),var(--shadow);}

  /* ===== 4 menu: ikon svg, penerimaan ===== */
  .nav button svg{width:28px;height:28px;display:block;pointer-events:none;}
  .muted-dash{color:var(--muted);}
  .terima-msg{margin-top:12px;font-size:13px;color:var(--muted);min-height:1em;}
  .btn-accent:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none;}
  .field input:disabled{opacity:.55;cursor:not-allowed;}
  .link-btn:disabled{opacity:.4;cursor:not-allowed;text-decoration:none;}
  .sub-title{font-size:18px;margin:32px 0 12px;}
  #terimaForm .field-grid{grid-template-columns:1fr 1fr 1fr;}
  #terimaForm .section:nth-of-type(3) .field-grid{grid-template-columns:1fr 1fr;}
  @media (max-width:700px){#terimaForm .field-grid,#terimaForm .section:nth-of-type(3) .field-grid{grid-template-columns:1fr;}}
</style>
</head>

// ================= ONLINE SYNC =================
// Paste your Google Apps Script Web App URL here after deployment.
// Example: https://script.google.com/macros/s/XXXXXXXX/exec
const API_URL = "https://script.google.com/macros/s/AKfycby8pg4rfD_9EjbmTv6-s2a1szocnB7VhQrB7VWJOqQ-M35Q3ZA-ph3lKU2beEx34miKwA/exec";
const SYNC_INTERVAL_MS = 30000;
let syncTimer = null;
let isSyncing = false;

function onlineMode(){
  return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL);
}

const sleep = ms => new Promise(r=>setTimeout(r, ms));
async function apiRequest(payload, attempt=0, timeoutMs=20000){
  if(!onlineMode()) throw new Error("API_URL belum diisi.");
  // Batas waktu 20 detik + coba ulang otomatis (jaringan baru bangun dari sleep, dsb.)
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), timeoutMs);
  try{
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(payload),
      signal: ctrl.signal
    });
    if(!response.ok) throw new Error("Server API gagal: HTTP " + response.status);
    const data = await response.json();
    if(!data.ok){ const err = new Error(data.error || "API mengembalikan error."); err.noRetry = true; throw err; }
    return data;
  }catch(e){
    if(!e.noRetry && attempt < 2){
      await sleep(1500 * (attempt + 1));
      return apiRequest(payload, attempt + 1, timeoutMs);
    }
    if(e.name === "AbortError") throw new Error("Koneksi timeout, coba lagi.");
    throw e;
  }finally{
    clearTimeout(timer);
  }
}

function showSyncStatus(message, isError=false){
  const el = document.getElementById("syncStatus");
  if(!el) return;
  el.textContent = message;
  el.style.color = isError ? "#FFE08A" : "inherit";   // latar sidebar gradien: pakai putih / kuning agar terbaca
}

async function loadRecordsOnline(silent=false){
  if(!onlineMode()){
    loadRecords();
    return;
  }
  if(isSyncing) return;
  if(silent && pendingWrites > 0) return;
  isSyncing = true;
  if(!silent) showSyncStatus("Sabar Lagi Mikir Bree...");
  try{
    const data = await apiRequest({action:"list"});
    if(silent && pendingWrites > 0) return;   // ada simpanan yang belum selesai: jangan timpa
    const before = JSON.stringify(records);
    records = Array.isArray(data.records) ? data.records.map(normRecord) : [];
    const changed = before !== JSON.stringify(records);
    showSyncStatus("✓ Tersinkron • " + new Date().toLocaleTimeString("id-ID"));
    // Jangan render ulang kalau data tidak berubah (sinkron otomatis) atau user sedang mengisi form.
    if(view !== "form" && view !== "terima"){ if(changed || !silent || !document.getElementById("mainContent").children.length) render(); }
    else document.getElementById("recordCountLabel").textContent = records.length;
  }catch(e){
    console.error(e);
    // Sinkron otomatis yang gagal tidak dianggap error: data di layar tetap aman, nanti dicoba lagi.
    if(silent) showSyncStatus("Sinkron tertunda, mencoba lagi...");
    else showSyncStatus("Gagal sinkron: " + e.message, true);
  }finally{
    isSyncing = false;
  }
}
async function saveRecordOnline(record){
  if(!onlineMode()){
    const idx = records.findIndex(r=>r.id===record.id);
    if(idx>=0) records[idx]=record; else records.push(record);
    persist();
    return;
  }
  const rec = normRecord(record);
  pendingWrites++;
  showSyncStatus("sabar anjing...");
  try{
    await apiRequest({action:"save", record: rec});
    // Cukup perbarui data lokal; tidak perlu mengunduh ulang seluruh daftar (hemat satu permintaan ke server).
    const idx = records.findIndex(r=>r.id===rec.id);
    if(idx>=0) records[idx]=rec; else records.push(rec);
    showSyncStatus("✓ Wis Tek Simpen SUU • " + new Date().toLocaleTimeString("id-ID"));
  }finally{
    pendingWrites--;
  }
}

async function deleteRecordOnline(id){
  const idx = records.findIndex(r=>r.id===id);
  if(idx < 0) return;
  const removed = records[idx];
  // Hilang dari layar seketika; penghapusan di server berjalan di latar belakang.
  records.splice(idx, 1);
  saveStart(false, "SEDANG MENGHAPUS...");
  if(!onlineMode()){
    persist();
    saveDone("TERHAPUS BREE");
    return;
  }
  pendingWrites++;
  showSyncStatus("Menghapus...");
  try{
    await apiRequest({action:"delete", id});
    showSyncStatus("✓ Terhapus • " + new Date().toLocaleTimeString("id-ID"));
    saveDone("TERHAPUS BREE");
  }catch(e){
    saveFail("GAGAL MENGHAPUS");
    records.splice(idx, 0, removed);   // gagal: kembalikan datanya
    if(view !== "form") render();
    showSyncStatus("Gagal menghapus", true);
    throw e;
  }finally{
    pendingWrites--;
  }
}

let pendingWrites = 0;
async function updateStatusOnline(id, status){
  const rec = records.find(r=>r.id===id);
  if(!rec) return;
  const prev = rec.status;
  // Tampilan langsung berubah (optimistik), simpan ke server berjalan di latar belakang.
  rec.status = status;
  saveStart(false);
  if(!onlineMode()){
    persist();
    saveDone();
    return;
  }
  pendingWrites++;
  showSyncStatus("Menyimpan...");
  try{
    await apiRequest({action:"save", record: normRecord({...rec, status})});
    showSyncStatus("✓ Tersimpan • " + new Date().toLocaleTimeString("id-ID"));
    saveDone();
  }catch(e){
    saveFail();
    rec.status = prev;           // gagal: kembalikan status lama
    if(view !== "form") render();
    showSyncStatus("Gagal menyimpan status", true);
    throw e;
  }finally{
    pendingWrites--;
  }
}

function startAutoSync(){
  if(!onlineMode()) return;
  if(syncTimer) clearInterval(syncTimer);
  syncTimer = setInterval(()=>loadRecordsOnline(true), SYNC_INTERVAL_MS);

  // Sinkron langsung begitu tab/aplikasi difokuskan lagi (mis. balik dari app lain di HP)
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState === "visible") loadRecordsOnline(true);
  });
  window.addEventListener("focus", ()=> loadRecordsOnline(true));
  window.addEventListener("online", ()=> loadRecordsOnline(true));
}

}

// ---------- Helpers ----------
// Google Sheets mengubah "2026-09-25" jadi tanggal sungguhan, lalu dikirim balik sebagai
// "2026-09-24T17:00:00.000Z" (UTC). Kembalikan ke tanggal lokal polos YYYY-MM-DD.
const DATE_FIELDS = ["tglPengajuan","tglPO","tglDiterima"];
function normDate(v){
  if(typeof v !== "string") return v;
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  if(/^\d{4}-\d{2}-\d{2}T/.test(v)){
    const d = new Date(v);
    if(isNaN(d.getTime())) return v;
    const m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
    return d.getFullYear()+"-"+m+"-"+day;
  }
  return v;
}
function normRecord(r){
  const o = {...r};
  DATE_FIELDS.forEach(k=>{ if(o[k]) o[k] = normDate(o[k]); });
  return o;
}

function idFor(){ return Date.now()+"-"+Math.random().toString(36).slice(2,8); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nextNoPengadaan(){
  let max=0;
  records.forEach(r=>{
    const m=/PGD-(\d+)/.exec(r.noPengadaan||"");
    if(m) max=Math.max(max, parseInt(m[1],10));
  });
  return "PGD-"+String(max+1).padStart(3,"0");
}
function formatRupiah(n){ return "Rp " + (Number(n)||0).toLocaleString("id-ID"); }
function formatRupiahShort(n){
  n = Number(n)||0;
  const neg = n<0; n = Math.abs(n);
  let out;
  if(n>=1000000000) out = (n/1000000000).toFixed(1).replace(/\.0$/,"")+" M";
  else if(n>=1000000) out = (n/1000000).toFixed(1).replace(/\.0$/,"")+" jt";
  else if(n>=1000) out = (n/1000).toFixed(0)+" rb";
  else out = String(n);
  return "Rp " + (neg?"-":"") + out;
}
function formatTgl(iso){
  if(!iso) return "-";
  const d=new Date(iso);
  if(isNaN(d.getTime())) return iso;
  return d.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"});
}
function monthIndexFromISO(iso){
  if(!iso) return null;
  const d=new Date(iso);
  if(isNaN(d.getTime())) return null;
  return d.getMonth();
}
function emptyForm(){
  return {
    id:"", noPengadaan:"", tglPengajuan: todayISO(), divisi:"GA", departemen:"Produksi",
    keperluan:"", namaBarang:"", spesifikasi:"", qty:"", satuan:"Pcs", estimasiHarga:"",
    supplier:"", tglPO:"", tglDiterima:"", status:"Pengajuan", keterangan:"", qtyDiterima:""
  };
}
function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ---------- Pengadaan vs penerimaan ----------
// qtyDiterima kosong = belum dicatat. Selisih = diterima - dipesan (negatif = kurang).
function terimaInfo(r){
  if(r.qtyDiterima === "" || r.qtyDiterima == null) return {kind:"belum", diff:0};
  const diff = (Number(r.qtyDiterima)||0) - (Number(r.qty)||0);
  return {kind: diff < 0 ? "kurang" : diff > 0 ? "lebih" : "sesuai", diff};
}
const TERIMA_FILTERS = ["Semua","Kurang","Sesuai","Lebih","Belum dicatat"];
function normQtyTerima(o){
  o.qtyDiterima = (o.qtyDiterima === "" || o.qtyDiterima == null) ? "" : Math.max(0, Number(o.qtyDiterima)||0);
}
function terimaBadge(r){
  if(r.status === "Batal") return "";
  const t = terimaInfo(r);
  if(t.kind === "kurang") return `<div class="tm-badge kurang">Kurang ${-t.diff}</div>`;
  if(t.kind === "lebih")  return `<div class="tm-badge lebih">Lebih ${t.diff}</div>`;
  if(t.kind === "sesuai") return `<div class="tm-badge sesuai">Sesuai</div>`;
  return "";
}
function countKurang(){
  return records.filter(r=> r.status !== "Batal" && terimaInfo(r).kind === "kurang").length;
}

// ---------- Derived ----------
function computeStats(){
  const total = records.length;
  const ga = records.filter(r=>r.divisi==="GA").length;
  const purchasing = records.filter(r=>r.divisi==="Purchasing").length;
  const totalNilai = records.filter(r=>r.status!=="Batal").reduce((s,r)=> s + (Number(r.qty)||0)*(Number(r.estimasiHarga)||0), 0);
  const statusCounts = {};
  STATUS_LIST.forEach(s=>statusCounts[s]=0);
  records.forEach(r=>{ if(statusCounts[r.status]!==undefined) statusCounts[r.status]++; });
  return {total,ga,purchasing,totalNilai,statusCounts};
}
function computeMonthly(){
  const counts = MONTHS.map(m=>({bulan:m.slice(0,3), total:0, nilai:0}));
  records.forEach(r=>{
    const idx = monthIndexFromISO(r.tglPengajuan);
    if(idx!==null){
      counts[idx].total++;
      counts[idx].nilai += (Number(r.qty)||0)*(Number(r.estimasiHarga)||0);
    }
  });
  return counts;
}
function computeTotalEstimasiForBulan(bulan){
  // Pengadaan berstatus "Batal" tidak dihitung ke total estimasi
  const aktif = records.filter(r=> r.status !== "Batal");
  const nilai = r => (Number(r.qty)||0)*(Number(r.estimasiHarga)||0);
  if(bulan==="Semua"){
    return aktif.reduce((s,r)=> s + nilai(r), 0);
  }
  const idx = MONTHS.indexOf(bulan);
  return aktif.reduce((s,r)=>{
    if(monthIndexFromISO(r.tglPengajuan)===idx) return s + nilai(r);
    return s;
  },0);
}
function computeFiltered(){
  // "records" disimpan menurut urutan input (sama seperti baris di Sheet); tampilkan yang terbaru di paling atas.
  return records.filter(r=>{
    if(filterDivisi!=="Semua" && r.divisi!==filterDivisi) return false;
    if(filterStatus!=="Semua" && r.status!==filterStatus) return false;
    if(filterTerima!=="Semua"){
      if(r.status === "Batal") return false;      // pengadaan batal tidak dihitung dalam pengecekan penerimaan
      const k = terimaInfo(r).kind;
      const want = {"Kurang":"kurang","Sesuai":"sesuai","Lebih":"lebih","Belum dicatat":"belum"}[filterTerima];
      if(k !== want) return false;
    }
    if(filterBulan!=="Semua"){
      const idx = monthIndexFromISO(r.tglPengajuan);
      if(idx===null || MONTHS[idx]!==filterBulan) return false;
    }
    if(search.trim()){
      const q=search.toLowerCase();
      const hay = `${r.noPengadaan} ${r.namaBarang} ${r.supplier} ${r.departemen}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).reverse();
}

    b.classList.toggle("active", b.dataset.view===view);
  });

  if(pendingScrollY){
    const y = pendingScrollY; pendingScrollY = 0;
    window.scrollTo(0, y); main.scrollTop = y;
    requestAnimationFrame(()=>{ window.scrollTo(0, y); main.scrollTop = y; });
  }else if(keepY || keepTop){
    window.scrollTo(0, keepY); main.scrollTop = keepTop;
    requestAnimationFrame(()=>{ window.scrollTo(0, keepY); main.scrollTop = keepTop; });
  }
  setTimeout(()=>{ main.style.minHeight = ""; }, 300);

function listCountText(filtered){
  const n = Math.min(visibleCount, filtered.length);
  const aktif = filtered.filter(r=>r.status !== "Batal");   // yang Batal tidak dihitung dalam total
  const harga = r => Number(r.estimasiHarga)||0;
  const totalPO = aktif.reduce((t,r)=> t + (Number(r.qty)||0)*harga(r), 0);
  const totalReal = aktif.reduce((t,r)=> terimaInfo(r).kind==="belum" ? t : t + (Number(r.qtyDiterima)||0)*harga(r), 0);
  return `Menampilkan ${n} dari ${filtered.length} data · Total Pengadaan ${formatRupiah(totalPO)} · Total Realisasi ${formatRupiah(totalReal)}`;
}

          const ti = terimaInfo(r);
          const totalReal = ti.kind==="belum" ? null : (Number(r.qtyDiterima)||0)*harga;   // Total Realisasi = Qty Diterima x harga satuan
          const statusOpts = STATUS_LIST.map(s=>`<option value="${s}" ${r.status===s?"selected":""}>${s}</option>`).join("");
          const nb = (r.bukti||[]).length;
          const proofBtn = nb ? `<button data-proof="${r.id}" class="proof-btn" title="Lihat bukti (${nb} foto)">📎<span>${nb}</span></button>` : "";
          const actionsHtml = `<div class="row-actions">
                ${proofBtn}
                <button data-edit="${r.id}" title="Edit">✎</button>
                <button data-del="${r.id}" title="Hapus">🗑</button>
               </div>`;
          return `<tr>
            <td class="mono">${escapeHtml(r.noPengadaan)}</td>
            <td>${formatTgl(r.tglPengajuan)}</td>
            <td>${escapeHtml(r.divisi)}</td>
            <td>${escapeHtml(r.namaBarang)}<div class="sub-text">${escapeHtml(r.departemen)}</div></td>
            <td>${r.qty} ${escapeHtml(r.satuan)}</td>
            <td>${ti.kind==="belum" ? '<span class="muted-dash">–</span>' : (r.qtyDiterima+" "+escapeHtml(r.satuan))}${terimaBadge(r)}</td>
            <td>${formatRupiah(totalPO)}</td>
            <td>${totalReal==null ? '<span class="muted-dash">–</span>' : formatRupiah(totalReal)}</td>
            <td><select class="status-select" data-status-change="${r.id}" style="color:${STATUS_COLORS[r.status]}">${statusOpts}</select></td>
            <td>${actionsHtml}</td>
          </tr>`;
        }).join("")}
        </tbody>
      </table>`;

  const more = shown.length < filtered.length
    ? `<div class="load-more" id="loadMore">Gulir ke bawah untuk memuat data berikutnya</div>`
    : "";
  return `<div class="table-wrap">${rowsHtml}</div>${more}`;
}

function drawChart(){
  const canvas = document.getElementById("monthlyChart");
  if(!canvas || typeof Chart === "undefined") return;
  const data = computeMonthly();
  const cs = getComputedStyle(document.documentElement);
  const C = n => cs.getPropertyValue(n).trim();
  const cMuted=C("--muted"), cLine=C("--line"), cBar=C("--chart-bar"), cLn=C("--chart-line"),
        cInk=C("--ink"), cPanel=C("--panel"), cAcc=C("--accent-deep");
  if(chartInstance){ chartInstance.destroy(); }
  chartInstance = new Chart(canvas, {
    data: {
      labels: data.map(d=>d.bulan),
      datasets: [
        {
          type: "bar",
          label: "Jumlah Pengajuan",
          data: data.map(d=>d.total),
          backgroundColor: cBar,
          borderRadius: 2,
          maxBarThickness: 28,
          yAxisID: "y",
          order: 2
        },
        {
          type: "line",
          label: "Nilai Pengajuan (Rp)",
          data: data.map(d=>d.nilai),
          borderColor: cLn,
          backgroundColor: cLn,
          pointBackgroundColor: cLn,
          pointRadius: 3,
          tension: 0.3,
          yAxisID: "y1",
          order: 1
        }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{ display:true, labels:{ color:cMuted, font:{size:11}, boxWidth:12 } },
        tooltip:{
          backgroundColor:cPanel, titleColor:cInk, bodyColor:cInk, borderColor:cLine, borderWidth:1,

function exportToExcel(){
  if(typeof XLSX === "undefined"){
    alert("Library Excel belum siap, coba lagi sebentar.");
    return;
  }
  const data = computeFiltered();
  if(data.length === 0){
    alert("Tidak ada data untuk diekspor.");
    return;
  }
  const rows = data.map(r=>({
    "No. Pengadaan": r.noPengadaan,
    "Tanggal Pengajuan": formatTgl(r.tglPengajuan),
    "Divisi": r.divisi,
    "Departemen": r.departemen,
    "Keperluan": r.keperluan,
    "Nama Barang": r.namaBarang,
    "Spesifikasi": r.spesifikasi,
    "Qty PO": Number(r.qty)||0,
    "Satuan": r.satuan,
    "Qty Diterima": (r.qtyDiterima === "" || r.qtyDiterima == null) ? "" : Number(r.qtyDiterima),
    "Selisih Penerimaan": (r.qtyDiterima === "" || r.qtyDiterima == null) ? "" : (Number(r.qtyDiterima) - (Number(r.qty)||0)),
    "Estimasi Harga Satuan": Number(r.estimasiHarga)||0,
    "Total Pengadaan": (Number(r.qty)||0)*(Number(r.estimasiHarga)||0),
    "Total Realisasi": (r.qtyDiterima === "" || r.qtyDiterima == null) ? "" : (Number(r.qtyDiterima)||0)*(Number(r.estimasiHarga)||0),
    "Supplier": r.supplier,
    "Status": r.status,
    "Tanggal PO": formatTgl(r.tglPO),
    "Tanggal Diterima": formatTgl(r.tglDiterima),
    "Keterangan": r.keterangan
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws["!cols"] = [
    {wch:14},{wch:14},{wch:12},{wch:14},{wch:20},{wch:22},{wch:22},
    {wch:8},{wch:8},{wch:12},{wch:18},{wch:18},{wch:18},{wch:18},{wch:16},{wch:14},{wch:14},{wch:14},{wch:24}
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Laporan Permintaan");
  const tanggal = todayISO();
  XLSX.writeFile(wb, `laporan-permintaan-${tanggal}.xlsx`);
}

// ---------- Muat data bertahap saat di-scroll ----------
function setupLoadMore(){
  if(loadObserver){ loadObserver.disconnect(); loadObserver = null; }
  const el = document.getElementById("loadMore");
  if(!el || typeof IntersectionObserver === "undefined") return;
  loadObserver = new IntersectionObserver((entries)=>{
    if(entries.some(e=>e.isIntersecting)) loadMoreRows();
  }, {rootMargin:"0px 0px 60px 0px"});
  loadObserver.observe(el);
}
function loadMoreRows(){
  if(loadingMore || view !== "list") return;
  const filtered = computeFiltered();
  if(visibleCount >= filtered.length) return;
  loadingMore = true;
  const el = document.getElementById("loadMore");
  if(el) el.innerHTML = '<span class="spinner"></span>Memuat data...';
  setTimeout(()=>{
    loadingMore = false;
    if(view !== "list") return;
    visibleCount += PAGE_SIZE;
    const f = computeFiltered();
    const body = document.getElementById("listBody");
    if(!body) return;
    body.innerHTML = renderListBody(f);          // hanya tabel yang diperbarui, bukan seluruh halaman
    const c = document.getElementById("listCount");
    if(c) c.textContent = listCountText(f);
    bindRowHandlers();
    setupLoadMore();
    saveUI();
  }, 500);
}

function attachHandlers(){
  document.querySelectorAll(".theme-toggle").forEach(b=> b.onclick = toggleTheme);
  const btnAddDash = document.getElementById("btnAddDash");
  if(btnAddDash) btnAddDash.onclick = openNewForm;
  const btnAddList = document.getElementById("btnAddList");
  if(btnAddList) btnAddList.onclick = openNewForm;

  if(view==="dashboard"){
    const cardKurang = document.getElementById("cardKurang");
    if(cardKurang){
      const go = ()=>{ filterTerima = "Kurang"; filterStatus = "Semua"; filterDivisi = "Semua"; filterBulan = "Semua"; search = ""; setView("list"); };
      cardKurang.onclick = go;
      cardKurang.onkeydown = (e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } };
    }
    const statBulanSelect = document.getElementById("statBulanSelect");
    if(statBulanSelect) statBulanSelect.onchange = (e)=>{ statBulan = e.target.value; render(); };
  }

  if(view==="terima") bindTerima();

  if(view==="list"){
    const searchInput = document.getElementById("searchInput");
    if(searchInput){
      searchInput.oninput = (e)=>{ search = e.target.value; visibleCount = PAGE_SIZE; renderListOnly(); };
      // keep focus after re-render
      searchInput.focus({preventScroll:true});
      searchInput.selectionStart = searchInput.selectionEnd = searchInput.value.length;
    }
    const fd = document.getElementById("filterDivisi");
    if(fd) fd.onchange = (e)=>{ filterDivisi = e.target.value; visibleCount = PAGE_SIZE; render(); };
    const ft = document.getElementById("filterTerima");
    if(ft) ft.onchange = (e)=>{ filterTerima = e.target.value; visibleCount = PAGE_SIZE; render(); };
    const fs = document.getElementById("filterStatus");
    if(fs) fs.onchange = (e)=>{ filterStatus = e.target.value; visibleCount = PAGE_SIZE; render(); };
    const fb = document.getElementById("filterBulan");
    if(fb) fb.onchange = (e)=>{ filterBulan = e.target.value; visibleCount = PAGE_SIZE; render(); };
    const btnExport = document.getElementById("btnExportExcel");
    if(btnExport) btnExport.onclick = exportToExcel;

    bindRowHandlers();
    setupLoadMore();
  }

  if(view==="form"){
    const f = document.getElementById("pengadaanForm");
    const closeBtn = document.getElementById("btnCloseForm");
    const cancelBtn = document.getElementById("btnCancelForm");
    if(closeBtn) closeBtn.onclick = ()=> setView("list");
    if(cancelBtn) cancelBtn.onclick = ()=> setView("list");

    function syncFormFromDOM(){
      const fd = new FormData(f);
      for(const [k,v] of fd.entries()) form[k]=v;
    }
    function updateTotalDisplay(){
      const total = (Number(f.elements["qty"].value)||0) * (Number(f.elements["estimasiHarga"].value)||0);
      const totalEl = document.getElementById("estimasiTotalDisplay");
      if(totalEl) totalEl.value = formatRupiah(total);
    }
    bindProofSection();
    bindTerimaHint(f);
    if(f.elements["qty"]) f.elements["qty"].oninput = ()=>{ syncFormFromDOM(); updateTotalDisplay(); };
    if(f.elements["estimasiHarga"]) f.elements["estimasiHarga"].oninput = ()=>{ syncFormFromDOM(); updateTotalDisplay(); };

    f.onsubmit = (e)=>{
      e.preventDefault();
      const fd = new FormData(f);
      const updated = {...form};
      for(const [k,v] of fd.entries()) updated[k]=v;
      if(!updated.noPengadaan.trim() || !updated.namaBarang.trim() || !updated.qty || !updated.tglPengajuan) return;
      updated.qty = Number(updated.qty)||0;
      updated.estimasiHarga = Number(updated.estimasiHarga)||0;
      normQtyTerima(updated);

      const st = proofState;
      saveStart(true);      // layar terkunci + "SEDANG MENYIMPAN..." selama menunggu server
      saveRecordOnline(updated)
        .then(async ()=>{
          let errs = [];
          if(hasProofChanges(st)) errs = (await syncProofs(updated.id, st)).errors;   // foto ikut diunggah
          saveDone(); setView("list"); if(!editingId) revealRecord(updated.id);
          if(errs.length) alert("Data tersimpan, tetapi ada foto yang gagal:\n"+errs.join("\n"));
        })
        .catch(e=>{ saveFail(); alert("Gagal menyimpan: "+e.message); });
    };
  }
}

function renderListOnly(){
  // re-render just the list without losing search focus is tricky with full re-render,
  // so we do a full render but restore focus/cursor for search.
  const active = document.activeElement;
  const wasSearch = active && active.id === "searchInput";
  const cursorPos = wasSearch ? active.selectionStart : null;
  render();
  if(wasSearch){
    const el = document.getElementById("searchInput");
    if(el){ el.focus(); el.selectionStart = el.selectionEnd = cursorPos; }
  }
}

// Petunjuk langsung di form: sesuai / kurang / lebih dibanding Qty pengadaan.
function bindTerimaHint(formEl){
  if(!formEl) return;
  const q = formEl.elements["qty"], t = formEl.elements["qtyDiterima"];
  const hint = document.getElementById("terimaHint"), fill = document.getElementById("fillTerima");
  if(!q || !t || !hint) return;
  const upd = ()=>{
    hint.className = "";
    if(t.value === ""){ hint.textContent = ""; return; }
    const diff = (Number(t.value)||0) - (Number(q.value)||0);
    if(diff < 0){ hint.textContent = "Kurang " + (-diff); hint.className = "kurang"; }
    else if(diff > 0){ hint.textContent = "Lebih " + diff; hint.className = "lebih"; }
    else { hint.textContent = "Sesuai"; hint.className = "sesuai"; }
  };
  q.addEventListener("input", upd); t.addEventListener("input", upd);
  if(fill) fill.onclick = ()=>{ t.value = q.value; upd(); t.focus({preventScroll:true}); };
  upd();
}

          <label class="field"><span>Tanggal Diterima <span class="req">*</span></span><input type="date" name="tglDiterima" required></label>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-accent">Simpan Penerimaan</button>
        <button type="button" class="btn-plain" id="tReset">Reset</button>
      </div>
    </form>
    <h2 class="sub-title">Penerimaan Terakhir</h2>
    <div class="table-wrap">${recentHtml}</div>
  `;
}

function bindTerima(){
  const f = document.getElementById("terimaForm");
  if(!f) return;
  const el = n => f.elements[n];
  const msg = document.getElementById("terimaMsg"), hint = document.getElementById("tHint"), fill = document.getElementById("tFill");
  const submitBtn = f.querySelector('button[type=submit]');
  const setManual = on => { el("qtyDiterima").disabled = !on; el("tglDiterima").disabled = !on; fill.disabled = !on; submitBtn.disabled = !on; };
  const updHint = ()=>{
    hint.className = "";
    if(!terimaSelId || el("qtyDiterima").value === ""){ hint.textContent = ""; return; }
    const diff = (Number(el("qtyDiterima").value)||0) - (Number(el("tQty").value)||0);
    if(diff < 0){ hint.textContent = "Kurang " + (-diff); hint.className = "kurang"; }
    else if(diff > 0){ hint.textContent = "Lebih " + diff; hint.className = "lebih"; }
    else { hint.textContent = "Sesuai"; hint.className = "sesuai"; }
  };
  const find = v => {
    v = (v||"").trim().toLowerCase();
    return v ? (terimaOptions().find(r=> String(r.noPengadaan).trim().toLowerCase() === v) || null) : null;
  };
  const apply = ()=>{
    const r = find(el("terimaNo").value);
    terimaSelId = r ? r.id : null;
    if(!r){
      el("tNama").value = el("tQty").value = el("tSatuan").value = "";
      el("qtyDiterima").value = ""; el("tglDiterima").value = "";
      msg.textContent = el("terimaNo").value.trim() ? "No. Pengadaan tidak ditemukan." : "";
      setManual(false); updHint();
      return;
    }
    el("tNama").value = r.namaBarang; el("tQty").value = r.qty; el("tSatuan").value = r.satuan;
    const had = terimaInfo(r).kind !== "belum";
    el("qtyDiterima").value = had ? r.qtyDiterima : "";
    el("tglDiterima").value = r.tglDiterima || todayISO();
    msg.textContent = had
      ? `Sudah tercatat diterima ${r.qtyDiterima} ${r.satuan}${r.tglDiterima ? " pada "+formatTgl(r.tglDiterima) : ""}. Isi total yang sudah diterima; menyimpan akan memperbarui data ini.`
      : "";
    setManual(true); updHint();
  };
  el("terimaNo").addEventListener("input", apply);
  el("terimaNo").addEventListener("change", apply);
  el("qtyDiterima").addEventListener("input", updHint);
  fill.onclick = ()=>{ el("qtyDiterima").value = el("tQty").value; updHint(); };
  document.getElementById("tReset").onclick = ()=>{ terimaSelId = null; render(); };
  f.onsubmit = (e)=>{
    e.preventDefault();
    const r = records.find(x=>x.id === terimaSelId);
    if(!r){ msg.textContent = "Pilih No. Pengadaan yang valid dulu."; return; }
    const q = el("qtyDiterima").value, tgl = el("tglDiterima").value;
    if(q === "" || !tgl) return;
    const updated = {...r, qtyDiterima: Math.max(0, Number(q)||0), tglDiterima: tgl};
    terimaSelId = null;
    saveEditOptimistic(updated, null).catch(err=>alert("Gagal menyimpan: "+err.message));   // halaman ter-reset otomatis
  };
  setManual(false);
  const keep = terimaSelId && records.find(x=>x.id === terimaSelId);
  if(keep){ el("terimaNo").value = keep.noPengadaan; apply(); }
}

// ---------- Bukti / foto pengajuan ----------
// Foto disimpan di Google Drive (lewat Apps Script); di Spreadsheet hanya tab "BUKTI" yang menyimpan daftarnya.
const MAX_PROOF = 8;
let proofState = null;   // {existing:[{id,name}], removed:[...], added:[{name,mime,data,preview,key}]}
function newProofState(existing){
  return {existing:(existing||[]).map(x=>({id:x.id,name:x.name})), removed:[], added:[]};
}
const proofThumb = (id,w)=>`https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w}`;
const proofView  = id=>`https://drive.google.com/file/d/${encodeURIComponent(id)}/view`;
function proofCount(st){ return st.existing.length + st.added.length; }

function compressImage(file, maxDim=1280, quality=0.8){
  return new Promise((resolve,reject)=>{
    if(!/^image\//.test(file.type)) return reject(new Error("Bukan file gambar: "+file.name));
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const sc = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width*sc)), h = Math.max(1, Math.round(img.height*sc));
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      const dataUrl = c.toDataURL("image/jpeg", quality);
      URL.revokeObjectURL(url);
      resolve({name:(file.name||"foto").replace(/\.[^.]+$/,"")+".jpg", mime:"image/jpeg",
               data:dataUrl.split(",")[1], preview:dataUrl, key:idFor()});
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("Gambar tidak bisa dibaca: "+file.name)); };
    img.src = url;
  });
}

function brokenThumb(img){
  const sp = document.createElement("span");
  sp.className = "proof-broken"; sp.textContent = "Tidak bisa dimuat";
  img.replaceWith(sp);
}

function renderProofList(){
  const box = document.getElementById("proofList");
  if(!box || !proofState) return;
  const st = proofState;
  const items = [
    ...st.existing.map(x=>`<div class="proof-item"><a href="${proofView(x.id)}" target="_blank" rel="noopener" title="Buka ukuran penuh"><img data-remote src="${proofThumb(x.id,240)}" alt="" loading="lazy"></a><button type="button" class="proof-del" data-pdel="${escapeHtml(x.id)}" aria-label="Hapus foto">×</button></div>`),
    ...st.added.map((x,i)=>`<div class="proof-item pending"><img src="${x.preview}" alt=""><span class="proof-new">Baru</span><button type="button" class="proof-del" data-pnew="${i}" aria-label="Batalkan foto">×</button></div>`)
  ];
  box.innerHTML = items.length ? items.join("") : '<div class="proof-empty">Belum ada foto bukti.</div>';
  box.querySelectorAll("img[data-remote]").forEach(im=> im.onerror = ()=>brokenThumb(im));
  box.querySelectorAll("[data-pdel]").forEach(b=> b.onclick = ()=>{
    const it = st.existing.find(x=>x.id===b.dataset.pdel);
    if(it){ st.removed.push(it); st.existing = st.existing.filter(x=>x.id!==it.id); renderProofList(); }
  });
  box.querySelectorAll("[data-pnew]").forEach(b=> b.onclick = ()=>{
    st.added.splice(Number(b.dataset.pnew),1); renderProofList();
  });
}

function bindProofSection(){
  const add = document.getElementById("proofAdd"), input = document.getElementById("proofInput");
  const hint = document.getElementById("proofHint");
  if(!add || !input || !proofState) return;
  if(!onlineMode()){
    add.disabled = true;
    hint.textContent = "Foto hanya bisa dilampirkan di mode online (API_URL harus terisi).";
  }
  add.onclick = ()=> input.click();
  input.onchange = async ()=>{
    const files = [...input.files]; input.value = "";
    const room = Math.max(0, MAX_PROOF - proofCount(proofState));
    if(files.length > room) alert(`Maksimal ${MAX_PROOF} foto per pengadaan. Hanya ${room} foto lagi yang bisa ditambahkan.`);
    add.disabled = true; add.textContent = "Memproses...";
    for(const f of files.slice(0, room)){
      try{ proofState.added.push(await compressImage(f)); }
      catch(e){ alert(e.message); }
    }
    add.disabled = false; add.textContent = "📷 Tambah Foto";
    renderProofList();
  };
  renderProofList();
}

// Kirim perubahan foto ke server setelah data pengadaannya tersimpan.
async function syncProofs(recordId, st){
  const errors = [];
  const final = st.existing.map(x=>({...x}));
  for(const r of st.removed){
    try{ await apiRequest({action:"deleteProof", recordId, fileId:r.id}); }
    catch(e){ errors.push("hapus "+(r.name||"foto")+": "+e.message); final.push(r); }
  }
  for(const a of st.added){
    try{
      const res = await apiRequest({action:"uploadProof", recordId, name:a.name, mime:a.mime, data:a.data, key:a.key}, 0, 60000);
      final.push(res.proof);
    }catch(e){ errors.push(a.name+": "+e.message); }
  }
  const rec = records.find(r=>r.id===recordId);
  if(rec) rec.bukti = final;
  return {errors};
}
const hasProofChanges = st => !!st && onlineMode() && (st.added.length > 0 || st.removed.length > 0);

// Popup melihat foto bukti
function openProofModal(id){
  const r = records.find(x=>x.id===id);
  if(!r || !(r.bukti||[]).length) return;
  document.getElementById("proofTitle").textContent = "Bukti Pengajuan — " + [r.noPengadaan, r.namaBarang].filter(Boolean).join(" · ");
  const grid = document.getElementById("proofGrid");
  grid.innerHTML = r.bukti.map(x=>`<a class="proof-card" href="${proofView(x.id)}" target="_blank" rel="noopener" title="Buka ukuran penuh"><img data-remote src="${proofThumb(x.id,600)}" alt="${escapeHtml(x.name)}"><span>${escapeHtml(x.name)}</span></a>`).join("");
  grid.querySelectorAll("img[data-remote]").forEach(im=> im.onerror = ()=>brokenThumb(im));
  lockScroll();
  document.getElementById("proofModal").hidden = false;
}
function closeProofModal(){
  document.getElementById("proofModal").hidden = true;
  unlockScroll();
}

// Data baru tampil di paling atas: gulir ke barisnya dan sorot sebentar.
function revealRecord(id){
  const idx = computeFiltered().findIndex(r=>r.id===id);   // posisi di tampilan (terbaru = 0)
  if(idx < 0 || view !== "list") return;
  if(idx >= visibleCount){
    visibleCount = Math.ceil((idx + 1) / PAGE_SIZE) * PAGE_SIZE;
    render();
  }
  requestAnimationFrame(()=>{
    const b = document.querySelector(`[data-edit="${id}"]`);
    const tr = b && b.closest("tr");
    if(!tr) return;
    tr.scrollIntoView({block:"center", behavior:"smooth"});
    tr.classList.add("row-flash");
    setTimeout(()=>tr.classList.remove("row-flash"), 1800);
  });
}

// ---------- Animasi "sedang menyimpan" / "tersimpan" ----------
let savingCount = 0, saveHideTimer = null, saveMode = "toast";
const SAVE_ICONS = {
  saving: '<div class="save-spinner"></div>',
  saved:  '<svg viewBox="0 0 52 52" aria-hidden="true"><circle class="sc-circle" cx="26" cy="26" r="24" fill="none"/><path class="sc-tick" fill="none" d="M14 27l8 8 16-17"/></svg>',
  error:  '<svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24" fill="none" stroke="#C1443C" stroke-width="3"/><path class="sc-x" d="M18 18l16 16M34 18L18 34"/></svg>'
};
function saveShow(state, text){
  const layer = document.getElementById("saveLayer");
  clearTimeout(saveHideTimer);
  layer.hidden = false;
  layer.className = "save-layer " + saveMode + (state==="saving" && saveMode==="center" ? " block" : "");
  document.getElementById("saveCard").dataset.state = state;
  document.getElementById("saveIcon").innerHTML = SAVE_ICONS[state];
  document.getElementById("saveText").textContent = text;
}
function saveHide(){
  const layer = document.getElementById("saveLayer");
  layer.classList.add("out");
  setTimeout(()=>{ if(layer.classList.contains("out")) layer.hidden = true; }, 260);
}
function saveStart(center, text){
  if(savingCount === 0) saveMode = center ? "center" : "toast";
  else if(center) saveMode = "center";
  savingCount++;
  saveShow("saving", text || "SEDANG MENYIMPAN...");
}
function saveDone(text){
  savingCount = Math.max(0, savingCount - 1);
  if(savingCount > 0) return;
  saveShow("saved", text || "TERSIMPAN BREE");
  saveHideTimer = setTimeout(saveHide, 1400);
}
function saveFail(msg){
  savingCount = Math.max(0, savingCount - 1);
  saveShow("error", msg || "GAGAL MENYIMPAN");
  saveHideTimer = setTimeout(saveHide, 2600);
}

// ---------- Popup ubah pengadaan ----------
let editModalId = null, editFormData = null;
function lockScroll(){
  const sw = window.innerWidth - document.documentElement.clientWidth;
  document.body.style.overflow = "hidden";
  if(sw > 0) document.body.style.paddingRight = sw + "px";
}
function unlockScroll(){
  document.body.style.overflow = "";
  document.body.style.paddingRight = "";
}
function openEditForm(id){
  const r = records.find(x=>x.id===id);
  if(!r) return;
  editModalId = id;
  editFormData = {...emptyForm(), ...r};
  proofState = newProofState(r.bukti);
  document.getElementById("editFields").innerHTML = renderFormSections(editFormData, "editTotalDisplay");
  bindProofSection();
  const f = document.getElementById("editForm");
  bindTerimaHint(f);
  const upd = ()=>{
    const t = (Number(f.elements["qty"].value)||0) * (Number(f.elements["estimasiHarga"].value)||0);
    document.getElementById("editTotalDisplay").value = formatRupiah(t);
  };
  f.elements["qty"].oninput = upd;
  f.elements["estimasiHarga"].oninput = upd;
  lockScroll();
  document.getElementById("editModal").hidden = false;
  document.querySelector("#editModal .modal").scrollTop = 0;
  f.elements["namaBarang"].focus({preventScroll:true});
}
function closeEditModal(){
  editModalId = null; editFormData = null; proofState = null;
  document.getElementById("editModal").hidden = true;
  unlockScroll();
}
// Perubahan tampil seketika; penyimpanan ke server berjalan di latar belakang.
async function saveEditOptimistic(updated, st){
  const idx = records.findIndex(r=>r.id===updated.id);
  if(idx < 0) return;
  const prev = records[idx];
  updated = normRecord(updated);
  records[idx] = updated;
  if(view !== "form") render();
  saveStart(false);
  if(!onlineMode()){ persist(); saveDone(); return; }
  pendingWrites++;
  showSyncStatus("Menyimpan...");
  try{
    await apiRequest({action:"save", record: updated});
    showSyncStatus("✓ Tersimpan • " + new Date().toLocaleTimeString("id-ID"));
    let errs = [];
    if(hasProofChanges(st)){
      errs = (await syncProofs(updated.id, st)).errors;
      if(view !== "form") render();
    }
    if(errs.length){ saveFail("FOTO GAGAL DIUNGGAH"); alert("Data tersimpan, tetapi ada foto yang gagal:\n"+errs.join("\n")); }
    else saveDone();
  }catch(e){
    saveFail();
    const i = records.findIndex(r=>r.id===updated.id);
    if(i >= 0) records[i] = prev;          // gagal: kembalikan data lama
    if(view !== "form") render();
    showSyncStatus("Gagal menyimpan", true);
    throw e;
  }finally{
    pendingWrites--;
  }
}
document.getElementById("editClose").addEventListener("click", closeEditModal);
document.getElementById("editCancel").addEventListener("click", closeEditModal);
document.getElementById("editForm").addEventListener("submit", (e)=>{
  e.preventDefault();
  if(!editFormData) return;
  const fd = new FormData(e.target);
  const updated = {...editFormData};
  for(const [k,v] of fd.entries()) updated[k]=v;
  if(!updated.noPengadaan.trim() || !updated.namaBarang.trim() || !updated.qty || !updated.tglPengajuan) return;
  updated.qty = Number(updated.qty)||0;
  updated.estimasiHarga = Number(updated.estimasiHarga)||0;
  normQtyTerima(updated);
  const st = proofState;
  if(st) updated.bukti = st.existing.map(x=>({...x}));    // foto yang dihapus langsung hilang dari tampilan
  closeEditModal();
  saveEditOptimistic(updated, st).catch(err=>alert("Gagal menyimpan: "+err.message));
});

// ---------- Popup konfirmasi hapus ----------
let deleteTargetId = null;
function askDelete(id){
  const r = records.find(x=>x.id===id);
  if(!r) return;
  deleteTargetId = id;
  document.getElementById("confirmDesc").textContent =
    [r.noPengadaan, r.namaBarang].filter(Boolean).join(" — ");
  const m = document.getElementById("confirmModal");
  m.hidden = false;
  document.getElementById("confirmNo").focus();   // default aman: Tidak
}
function closeDeleteModal(){
  deleteTargetId = null;
  document.getElementById("confirmModal").hidden = true;
}
document.getElementById("confirmNo").addEventListener("click", closeDeleteModal);
document.getElementById("confirmYes").addEventListener("click", ()=>{
  const id = deleteTargetId;
  closeDeleteModal();
  if(!id) return;
  deleteRecordOnline(id).catch(e=>alert("Gagal menghapus: "+e.message));
  if(view !== "form") render();
});
document.getElementById("confirmModal").addEventListener("click", (e)=>{
  if(e.target.id === "confirmModal") closeDeleteModal();   // klik di luar kotak = Tidak
});
document.addEventListener("keydown", (e)=>{
  if(e.key === "Escape" && !document.getElementById("confirmModal").hidden) closeDeleteModal();
  if(e.key === "Escape" && !document.getElementById("editModal").hidden) closeEditModal();

document.getElementById("brandBtn").addEventListener("click", ()=>{

});

  b.addEventListener("click", ()=>{ if(b.dataset.view === "form") openNewForm(); else setView(b.dataset.view); });
});

initTheme();
if(onlineMode()){
  showSyncStatus("Menghubungkan...");
  loadRecordsOnline().then(startAutoSync);
}else{
  loadRecords();
  render();
  showSyncStatus("Mode lokal — isi API_URL untuk sinkron HP ↔ PC");
}
