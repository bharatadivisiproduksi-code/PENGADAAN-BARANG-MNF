  document.querySelectorAll("[data-sn]").forEach(el=> el.oninput = el.onchange = ()=>{
    const row = soNewRows[Number(el.dataset.sn)];
    row[el.dataset.f] = el.value;
    // update cek balance baris item baru secara langsung
    if(el.dataset.f === "awal" || el.dataset.f === "hasil" || el.dataset.f === "nama"){
      const cell = document.querySelector(`[data-sncheck="${el.dataset.sn}"]`);
      if(cell){
        const kel = keluarBulan(soDivisi, row.nama, bulan);
        if(row.awal !== "" && row.hasil !== ""){
          const sisa = (Number(row.awal)||0) + (Number(row.masuk)||0) - (Number(row.hasil)||0);
          cell.innerHTML = sisa === kel
            ? '<span class="rm-badge aman">BALANCE / OK</span>'
            : `<div><span class="rm-badge terlambat">NOT BALANCE</span><div class="sub-text">sisa: ${fmtNum(sisa)}</div></div>

          cell.querySelector("input").oninput = cell.querySelector("input").onchange = ()=>{ row.alasan = cell.querySelector("input").value; };
        }else cell.innerHTML = '<span class="muted-dash">–</span>';
      }
    }
  });
  document.querySelectorAll("[data-sn-del]").forEach(b=> b.onclick = ()=>{ soNewRows.splice(Number(b.dataset.snDel),1); render(); });
  document.querySelectorAll("[data-so-del]").forEach(b=> b.onclick = ()=> askDeleteSo(b.dataset.soDel));
  document.querySelectorAll("[data-so-hist]").forEach(b=> b.onclick = ()=> openSoHistory(b.dataset.soHist));
  document.querySelectorAll("[data-sat-edit]").forEach(b=> b.onclick = ()=>{ const it = byKey.get(b.dataset.satEdit); if(it) openGantiSatuan(it); });
  document.getElementById("soSave").onclick = ()=>{
    if(!/^\d{4}-\d{2}$/.test(bulan)){ alert("Pilih bulan SO dulu."); return; }
    const recs = [], missing = [], missingAlasan = [];
    items.forEach(i=>{
      const e = soEff(i, bulan);
      if(e.hasil === "") return;                                   // tidak diisi = tidak disimpan
      const sv = e.saved;
      if(sv && Number(e.awal) === sv.awal && Number(e.masuk) === sv.masuk && Number(e.hasil) === sv.fisik && (e.ket||"") === (sv.ket||"") && (e.alasan||"") === (sv.alasan||"")) return;   // tidak berubah
      if(e.awal === ""){ missing.push(i.nama); return; }
      const b = soBalance(e, i.divisi, i.nama, bulan);
      if(b && !b.ok && !(e.alasan||"").trim()){ missingAlasan.push(i.nama); return; }   // stok not balance wajib ada alasannya
      recs.push(buildSoRecord(i.divisi, i.nama, i.satuan, bulan, e, sv ? sv.id : null));
    });
    for(const r of soNewRows){
      if(!r.nama.trim() && r.hasil === "" && r.awal === "") continue;
      if(!r.nama.trim() || r.hasil === "" || r.awal === ""){ alert("Item baru: nama barang, stok awal, dan hasil SO harus diisi."); return; }
      const ex = soRows.find(o=> o.bulan === bulan && itemKey(o.divisi,o.namaBarang,o.satuan) === itemKey(soDivisi, r.nama, r.satuan));
      const kel = keluarBulan(soDivisi, r.nama, bulan);
      if(((Number(r.awal)||0) + (Number(r.masuk)||0) - (Number(r.hasil)||0)) !== kel && !(r.alasan||"").trim()){ missingAlasan.push(r.nama.trim()); continue; }
      recs.push(buildSoRecord(soDivisi, r.nama.trim(), r.satuan, bulan, {awal:r.awal, masuk:r.masuk||"0", hasil:r.hasil, ket:"", alasan:r.alasan||""}, ex ? ex.id : null));
    }
    if(missing.length){ alert("Stok Awal belum diisi untuk:\n- " + missing.join("\n- ") + "\n\nIsi stok awal (hitungan pertama kali) dulu."); return; }
    if(missingAlasan.length){ alert("STOK NOT BALANCE — alasan belum diisi untuk:\n- " + missingAlasan.join("\n- ") + "\n\nIsi kolom alasan di baris tersebut (cek balance) sebelum menyimpan."); return; }
    if(!recs.length){ alert("Belum ada Hasil SO baru yang diisi."); return; }
    soDraft = {}; soNewRows = [];
    saveSoMany(recs).catch(err=>alert(err.message));
  };
}

// Server hanya menerima 1 data per permintaan (saveSO), jadi dikirim 3 sekaligus secara paralel.
async function saveSoMany(list){
  const before = soRows.map(r=>({...r}));
  list.forEach(r=>{
    const n = normSo(r), i = soRows.findIndex(x=>x.id === n.id);
    if(i >= 0) soRows[i] = n; else soRows.push(n);
  });
  if(view !== "form") render();
  saveStart(false);
  if(!onlineMode()){ persistSo(); saveDone(); return; }
  pendingWrites++;
  const failed = [];
  let next = 0;
  const worker = async ()=>{
    while(next < list.length){
      const r = list[next++];
      try{ await apiRequest({action:"saveSO", record:{...r, history: JSON.stringify(r.history)}}); }
      catch(e){ failed.push({r, e}); }
    }
  };
  try{ await Promise.all([worker(), worker(), worker()]); }
  finally{ pendingWrites--; }
  if(failed.length){
    failed.forEach(({r})=>{                                 // kembalikan yang gagal
      const old = before.find(x=>x.id === r.id), i = soRows.findIndex(x=>x.id === r.id);
      if(old){ if(i >= 0) soRows[i] = old; } else if(i >= 0) soRows.splice(i, 1);
    });
    if(view !== "form") render();
    saveFail(failed.length + " DATA GAGAL");
    throw new Error("Gagal menyimpan " + failed.length + " dari " + list.length + " data SO: " + failed[0].e.message);
  }
  showSyncStatus("✓ SO tersimpan • " + new Date().toLocaleTimeString("id-ID"));
  saveDone();
}
async function deleteSoRecord(id){
  const idx = soRows.findIndex(o=>o.id === id);
  if(idx < 0) return;
  const removed = soRows[idx];
  soRows.splice(idx, 1);
  saveStart(false, "SEDANG MENGHAPUS...");
  if(view !== "form") render();
  if(!onlineMode()){ persistSo(); saveDone("TERHAPUS BREE"); return; }
  pendingWrites++;
  try{
    await apiRequest({action:"deleteSO", id});
    saveDone("TERHAPUS BREE");
  }catch(e){
    soRows.splice(idx, 0, removed);
    if(view !== "form") render();
    saveFail("GAGAL MENGHAPUS");
    throw e;
  }finally{
    pendingWrites--;
  }
}

// ---------- Tabel riwayat: cari item + halaman (10 data / halaman) ----------
const RIW_SIZE = 10;
const riwState = {};   // key -> {q, page}
const riwCfg = {};     // key -> {rows(), text(r), head, row(r), empty, full, noSearch, ph, after(root)}
const riwGet = k => riwState[k] || (riwState[k] = {q:"", page:1});
function riwList(k){
  const c = riwCfg[k], st = riwGet(k), q = st.q.trim().toLowerCase();
  const all = c.rows();
  const list = q ? all.filter(r=> String(c.text(r)).toLowerCase().includes(q)) : all;
  const pages = Math.max(1, Math.ceil(list.length / RIW_SIZE));
  st.page = Math.min(Math.max(1, st.page), pages);
  return {all, list, pages, st};
}
function riwPager(k, total, pages, page){
  if(total <= RIW_SIZE) return `<div class="pager"><span>${total} data</span></div>`;
  const nums = [];
  for(let p=1; p<=pages; p++){
    if(p === 1 || p === pages || Math.abs(p - page) <= 1) nums.push(p);
    else if(nums[nums.length-1] !== "…") nums.push("…");
  }
  const btn = (p, label, dis, on)=> `<button type="button" class="pg-btn${on?" on":""}" data-riw-page="${k}" data-p="${p}" ${dis?"disabled":""}>${label}</button>`;
  return `<div class="pager"><span>Halaman ${page} dari ${pages} · ${total} data</span><div class="pg-nums">
    ${btn(page-1, "‹", page<=1)}
    ${nums.map(p=> p === "…" ? '<span class="pg-gap">…</span>' : btn(p, p, false, p===page)).join("")}
    ${btn(page+1, "›", page>=pages)}</div></div>`;
}
function riwBody(k){
  const c = riwCfg[k], {list, pages, st} = riwList(k);
  const slice = list.slice((st.page-1)*RIW_SIZE, st.page*RIW_SIZE);
  const table = slice.length
    ? `<table><thead>${c.head}</thead><tbody>${slice.map(c.row).join("")}</tbody></table>`
    : `<div class="empty-state">Tidak ada data yang cocok dengan pencarian.</div>`;
  return `<div class="table-wrap">${table}</div>${riwPager(k, list.length, pages, st.page)}`;
}
function riwBox(k){
  const c = riwCfg[k], st = riwGet(k), total = c.rows().length;
  if(!total) return `<div class="table-wrap">${c.empty}</div>`;
  const bar = c.noSearch ? "" : `<div class="riw-bar"><div class="search-box">🔍 <input data-riw-q="${k}" placeholder="${escapeHtml(c.ph || "Cari nama item...")}" value="${escapeHtml(st.q)}"></div></div>`;
  return `${bar}<div data-riw-body="${k}">${riwBody(k)}</div>`;
}
function bindRiw(){
  const refresh = (k)=>{
    const c = riwCfg[k]; if(!c) return;
    if(c.full){
      render();
      const el = document.querySelector(`[data-riw-q="${k}"]`);
      if(el && document.activeElement !== el && riwGet(k).q){ el.focus({preventScroll:true}); el.selectionStart = el.selectionEnd = el.value.length; }
      return;
    }
    const body = document.querySelector(`[data-riw-body="${k}"]`);
    if(!body) return;
    body.innerHTML = riwBody(k);
    bindPagers(k); if(c.after) c.after(body);
  };
  const bindPagers = (k)=>{
    document.querySelectorAll(`[data-riw-page="${k}"]`).forEach(b=> b.onclick = ()=>{
      riwGet(k).page = Number(b.dataset.p); refresh(k);
    });
  };
  document.querySelectorAll("[data-riw-q]").forEach(inp=>{
    const k = inp.dataset.riwQ;
    inp.oninput = ()=>{
      const st = riwGet(k); st.q = inp.value; st.page = 1;
      if(riwCfg[k] && riwCfg[k].full){
        const pos = inp.selectionStart; render();
        const el = document.querySelector(`[data-riw-q="${k}"]`);
        if(el){ el.focus({preventScroll:true}); el.selectionStart = el.selectionEnd = pos; }
      }else refresh(k);
    };
  });
  document.querySelectorAll("[data-riw-body]").forEach(b=> bindPagers(b.dataset.riwBody));
}

function deleteTerima(recId, entryId){
  const r = records.find(x=>x.id === recId); if(!r) return;
  const log = terimaLog(r), e = log.find(p=>p.id === entryId); if(!e) return;
  if(!confirm(`Hapus penerimaan ${fmtNum(e.qty)} ${r.satuan} (${formatTgl(e.tgl)}) untuk ${r.namaBarang}?`)) return;
  const rest = log.filter(p=>p.id !== entryId);
  const updated = {...r, penerimaan: rest};
  if(!rest.length){ updated.qtyDiterima = ""; updated.tglDiterima = ""; }
  const total = rest.reduce((t,p)=> t + p.qty, 0);
  if((r.status === "Selesai" || r.status === "Diterima") && total < (Number(r.qty)||0)) updated.status = "Disetujui";
  saveEditOptimistic(updated, null).catch(err=>alert("Gagal menghapus: "+err.message));
}

    </div>
    ${terimaTab === "permintaan" ? renderForm(true) : (terimaTab === "pengeluaran" ? renderPengeluaran() : penerimaanHtml)}
  `;
}

// isian form pengeluaran (agar tidak hilang saat render ulang)
let keluarForm = { tanggal: todayISO(), nama: "", satuan: "Pcs", qty: "", ket: "" };
let keluarDivisiNama = "";   // divisi otomatis dari nama barang yang dipilih

function bindPengeluaran(){
  const f = document.getElementById("keluarForm");
  if(!f) return;
  const el = n => f.elements[n];
  // ===== Simpan pengeluaran: dipasang PALING AWAL supaya tombol Simpan selalu berfungsi =====
  f.onsubmit = (e)=>{
    e.preventDefault();
    const nama = el("kNama").value.trim(), qty = el("kQty").value;
    if(!nama || qty === ""){ alert("Nama barang dan Qty Keluar harus diisi."); return; }
    let divisi = keluarDivisiNama;
    try{
      if(!divisi){
        const m = analyzeItems().find(i=> i.nama.toLowerCase() === nama.toLowerCase()) || soRows.filter(o=> o.namaBarang.toLowerCase() === nama.toLowerCase())[0];
        divisi = m ? (m.divisi || "") : "";
      }
    }catch(err){ divisi = ""; }
    outRows.push({id:idFor(), tanggal: el("kTanggal").value || todayISO(), divisi: divisi,
                  namaBarang: nama, satuan: el("kSatuan").value, qty: Math.max(0, Number(qty)||0),
                  keterangan: el("kKet").value.trim()});
    persistOut();
    keluarForm = { tanggal: todayISO(), nama: "", satuan: "Pcs", qty: "", ket: "" };
    keluarDivisiNama = "";
    saveStart(false); saveDone("TERSIMPAN");
    render();
  };
  f.addEventListener("submit", e=> e.preventDefault());   // jaga-jaga: cegah reload halaman
  // ===== Sugest / dropdown nama barang saat diketik (dibungkus anti-error) =====
  try{
  const acInput = el("kNama"), acBox = document.getElementById("kNamaAc");
  const allItems = [...new Map([...analyzeItems().map(i=>[itemKey(i.divisi,i.nama,i.satuan), i]), ...soRows.map(o=>[itemKey(o.divisi,o.namaBarang,o.satuan), {divisi:o.divisi, nama:o.namaBarang, satuan:o.satuan}])])]
    .map(([,v])=>({nama:v.nama, satuan:v.satuan, divisi:v.divisi}))
    .filter(i=> i.nama)
    .sort((a,b)=> a.nama.localeCompare(b.nama, "id"));
  const applyItem = (it)=>{
    acInput.value = it.nama;
    if(it.satuan) el("kSatuan").value = it.satuan;
    keluarDivisiNama = it.divisi || "";
    hideAc();
  };
  const hideAc = ()=>{ if(acBox) acBox.hidden = true; };
  let acList = [];   // daftar saran yang sedang tampil
  const showAc = ()=>{
    if(!acBox) return;
    const q = acInput.value.trim().toLowerCase();
    acList = (q ? allItems.filter(i=> i.nama.toLowerCase().includes(q)) : allItems).slice(0, 30);
    if(!acList.length){ hideAc(); return; }
    acBox.innerHTML = acList.map((it,idx)=>
      `<div class="ac-item" data-ac="${idx}"><span>${escapeHtml(it.nama)}</span><span class="div-chip">${escapeHtml(it.divisi)}</span></div>`).join("");
    acBox.querySelectorAll("[data-ac]").forEach(d=>{
      d.addEventListener("mousedown", (ev)=>{ ev.preventDefault(); applyItem(acList[Number(d.dataset.ac)]); });
    });
    acBox.hidden = false;
  };
  acInput.addEventListener("focus", showAc);
  acInput.addEventListener("input", showAc);
  acInput.addEventListener("blur", ()=> setTimeout(hideAc, 150));
  acInput.addEventListener("keydown", (ev)=>{
    if(ev.key === "Escape") hideAc();
    if(ev.key === "Enter" && acBox && !acBox.hidden && acList.length){ ev.preventDefault(); applyItem(acList[0]); }
  });
  // isi satuan & divisi otomatis bila nama diketik manual dan cocok dengan item yang dikenal
  acInput.addEventListener("change", ()=>{
    const v = acInput.value.trim().toLowerCase();
    if(!v) return;
    const m = allItems.find(i=> i.nama.toLowerCase() === v);
    if(m){ if(m.satuan) el("kSatuan").value = m.satuan; keluarDivisiNama = m.divisi || ""; }
  });
  }catch(acErr){ console.error("Autocomplete pengeluaran gagal:", acErr); }
  const rs = document.getElementById("kReset");
  if(rs) rs.onclick = ()=>{ keluarForm = { tanggal: todayISO(), nama: "", satuan: "Pcs", qty: "", ket: "" }; keluarDivisiNama = ""; render(); };
  bindOutDel();
}

function bindTerima(){
  document.querySelectorAll("[data-terima-tab]").forEach(b=> b.onclick = ()=>{
    const t = b.dataset.terimaTab;
    if(t === "permintaan" && (!form || editingId)){ form = {...emptyForm(), id:idFor()}; editingId = null; proofState = newProofState([]); }   // draft baru tiap masuk tab
    terimaTab = t; render();
  });
  if(terimaTab === "permintaan" && (!form || editingId)){ form = {...emptyForm(), id:idFor()}; editingId = null; proofState = newProofState([]); }
  if(terimaTab === "permintaan"){ try{ bindPengadaanForm(); }catch(e){ console.error("Form permintaan error:", e); } }
  if(terimaTab === "pengeluaran"){ try{ bindPengeluaran(); }catch(e){ console.error("Tab pengeluaran error:", e); } }
  bindTerimaDel();
  const f = document.getElementById("terimaForm");
  if(!f) return;
  const el = n => f.elements[n];
  const msg = document.getElementById("terimaMsg"), hint = document.getElementById("tHint"), fill = document.getElementById("tFill");
  const submitBtn = f.querySelector('button[type=submit]');
  const setManual = on => { el("qtyDiterima").disabled = !on; el("tglDiterima").disabled = !on; el("sudahDiterima").disabled = !on; fill.disabled = !on; submitBtn.disabled = !on; };
  const selRec = ()=> records.find(x=>x.id === terimaSelId) || null;
  const priorQty = ()=>{ const r = selRec(); return r ? terimaTotal(r) : 0; };
  // Petunjuk: total setelah penerimaan ini dibanding Qty PO. Ceklis "Sudah diterima" otomatis tercentang jika total sudah lengkap.
  const updHint = (auto)=>{
    hint.className = "";
    if(!terimaSelId || el("qtyDiterima").value === ""){ hint.textContent = ""; return; }
    const diff = Math.round((priorQty() + (Number(el("qtyDiterima").value)||0) - (Number(el("tQty").value)||0)) * 100) / 100;
    if(diff < 0){ hint.textContent = "Masih kurang " + (-diff); hint.className = "kurang"; }
    else if(diff > 0){ hint.textContent = "Lebih " + diff; hint.className = "lebih"; }
    else { hint.textContent = "Sesuai"; hint.className = "sesuai"; }
    if(auto === true) el("sudahDiterima").checked = diff >= 0;
  };
  const renderRiwayat = (r)=>{
    const box = document.getElementById("tRiwayat"), log = r ? terimaLog(r) : [];
    if(!log.length){ box.innerHTML = ""; return; }
    box.innerHTML = `<div class="section"><h3>Penerimaan Tercatat</h3>
      <div class="table-wrap"><table><thead><tr><th>Ke</th><th>Tanggal</th><th>Qty Diterima</th><th></th></tr></thead><tbody>
      ${log.map((p,i)=>`<tr><td>${i+1}</td><td>${formatTgl(p.tgl)}</td><td>${fmtNum(p.qty)} ${escapeHtml(r.satuan)}</td>
        <td><button type="button" class="so-del" data-terima-del="${escapeHtml(r.id)}|${escapeHtml(p.id)}" title="Hapus penerimaan ini">🗑</button></td></tr>`).join("")}
      </tbody></table></div>
      <div class="sub-text" style="margin-top:8px">Penerimaan yang sudah tercatat tidak bisa diedit, hanya bisa dihapus. Penerimaan berikutnya otomatis mengisi sisanya.</div></div>`;
    bindTerimaDel(box);
  };
  let multiMode = false;
  const find = v => {
    v = (v||"").trim().toLowerCase();
    return v ? (terimaOptions().find(r=> terimaLabel(r).trim().toLowerCase() === v) || null) : null;
  };
  const multiBox = document.getElementById("tMulti"), singleBox = document.getElementById("tSingle");
  const multiItems = ()=>{
    const v = (el("terimaNo").value||"").trim().toLowerCase();
    return v ? terimaOptions().filter(x=> String(x.noPengadaan).trim().toLowerCase() === v).reverse() : [];
  };
  const renderMulti = (items)=>{
    const no = items[0].noPengadaan;
    multiBox.innerHTML = `<div class="section"><h3>${escapeHtml(no)} — ${items.length} item</h3>
      <div class="sub-text" style="margin-bottom:8px">Isi Qty Diterima hanya untuk item yang datang sekarang (boleh sebagian). Item yang dikosongkan tidak diubah.</div>
      <div class="table-wrap"><table><thead><tr><th>Barang</th><th>Qty PO</th><th>Sudah Diterima</th><th>Sisa</th><th>Qty Diterima Sekarang</th><th>Selesai</th></tr></thead><tbody>
      ${items.map(r=>{ const prior = terimaTotal(r), sisa = Math.max(0, Math.round(((Number(r.qty)||0) - prior)*100)/100);
        return `<tr data-id="${escapeHtml(r.id)}" data-sisa="${sisa}" data-prior="${prior}" data-qty="${Number(r.qty)||0}"><td>${escapeHtml(r.namaBarang)}</td><td>${fmtNum(r.qty)} ${escapeHtml(r.satuan)}</td><td>${fmtNum(prior)}</td><td>${fmtNum(sisa)}</td>
          <td><input type="number" min="0" data-q style="width:110px" placeholder="0"></td>
          <td style="text-align:center"><input type="checkbox" data-c ${(r.status==="Selesai"||r.status==="Diterima")?"checked":""} style="width:18px;height:18px;accent-color:#1FA36B"></td></tr>`; }).join("")}
      </tbody></table></div>
      <div class="field-grid" style="margin-top:14px"><label class="field"><span>Tanggal Diterima <span class="req">*</span></span><input type="date" id="tMultiTgl" value="${todayISO()}"></label></div>
      <button type="button" class="link-btn" id="tMultiFill">Semua sama dengan Sisa</button></div>`;
    multiBox.querySelectorAll("tr[data-id]").forEach(tr=>{
      const q = tr.querySelector("[data-q]"), c = tr.querySelector("[data-c]");
      q.addEventListener("input", ()=>{ if(q.value !== "") c.checked = (Number(tr.dataset.prior) + (Number(q.value)||0)) >= Number(tr.dataset.qty); });
    });
    document.getElementById("tMultiFill").onclick = ()=> multiBox.querySelectorAll("tr[data-id]").forEach(tr=>{
      const sisa = Number(tr.dataset.sisa); if(sisa > 0){ tr.querySelector("[data-q]").value = sisa; tr.querySelector("[data-c]").checked = true; } });
  };
  const apply = ()=>{
    const mi = multiItems();
    if(mi.length > 1){
      terimaSelId = null; multiMode = true;
      singleBox.hidden = true; multiBox.hidden = false; f.noValidate = true;
      setManual(false); submitBtn.disabled = false;      // panel multi punya input sendiri
      const key = mi.map(x=>x.id).join(",");
      if(multiBox.dataset.key !== key){ multiBox.dataset.key = key; renderMulti(mi); }   // jangan render ulang kalau sama (input yang sedang diisi tidak hilang)
      msg.textContent = ""; return;
    }
    multiMode = false; singleBox.hidden = false; multiBox.hidden = true; multiBox.innerHTML = ""; delete multiBox.dataset.key; f.noValidate = false;
    const r = find(el("terimaNo").value);
    terimaSelId = r ? r.id : null;
    if(!r){
      el("tNama").value = el("tQty").value = el("tSatuan").value = el("tTotal").value = el("tSisa").value = "";
      el("qtyDiterima").value = ""; el("tglDiterima").value = ""; el("sudahDiterima").checked = false;
      renderRiwayat(null);
      msg.textContent = el("terimaNo").value.trim() ? "No. Pengadaan tidak ditemukan." : "";
      setManual(false); updHint();
      return;
    }
    el("tNama").value = r.namaBarang; el("tQty").value = r.qty; el("tSatuan").value = r.satuan;
    const prior = terimaTotal(r), sisa = Math.round(((Number(r.qty)||0) - prior) * 100) / 100;
    el("tTotal").value = prior; el("tSisa").value = Math.max(0, sisa);
    renderRiwayat(r);
    // penerimaan ke-2 dst: Qty Diterima otomatis terisi sisanya
    el("qtyDiterima").value = (prior > 0 && sisa > 0) ? sisa : "";
    el("tglDiterima").value = todayISO();
    el("sudahDiterima").checked = (r.status === "Selesai" || r.status === "Diterima");
    msg.textContent = (prior > 0 && sisa <= 0) ? `Pengadaan ini sudah diterima lengkap (${fmtNum(prior)} dari ${fmtNum(r.qty)} ${r.satuan}). Isi qty hanya jika ada penerimaan tambahan.` : "";
    setManual(true); updHint(el("qtyDiterima").value !== "");
  };
  el("terimaNo").addEventListener("input", apply);
  el("terimaNo").addEventListener("change", apply);

  // Daftar pilihan No. Pengadaan: nama item + tanggal pengajuan (font kecil) di bawahnya
  const inp = el("terimaNo"), combo = document.getElementById("terimaCombo");
  let act = -1;
  const setAct = (n)=>{
    const its = combo.querySelectorAll(".combo-item");
    if(!its.length) return;
    act = (n + its.length) % its.length;
    its.forEach((x,i)=> x.classList.toggle("act", i === act));
    its[act].scrollIntoView({block:"nearest"});
  };
  const showCombo = ()=>{
    const q = inp.value.trim().toLowerCase();
    const all = terimaOptions().filter(r=> !q || (r.noPengadaan + " " + r.namaBarang).toLowerCase().includes(q));
    const seenNo = new Set(), list = [];
    all.forEach(r=>{ if(!seenNo.has(r.noPengadaan)){ seenNo.add(r.noPengadaan); list.push(r); } });
    combo.innerHTML = list.length
      ? list.slice(0, 100).map(r=>{
          const grp = terimaOptions().filter(x=>x.noPengadaan === r.noPengadaan);
          const desc = grp.length > 1 ? `${grp.length} item: ${escapeHtml(grp.slice().reverse().map(x=>x.namaBarang).join(", "))}` : `${escapeHtml(r.namaBarang)} — ${escapeHtml(r.qty)} ${escapeHtml(r.satuan)}`;
          return `<div class="combo-item" data-no="${escapeHtml(r.noPengadaan)}"><b>${escapeHtml(r.noPengadaan)}</b> — ${desc}<small>Diajukan: ${formatTgl(r.tglPengajuan)}</small></div>`; }).join("")
      : '<div class="combo-empty">Tidak ada pengadaan yang cocok.</div>';
    act = -1; combo.hidden = false;
  };
  const pick = (no)=>{ inp.value = no; combo.hidden = true; apply(); };
  inp.addEventListener("focus", showCombo);
  inp.addEventListener("input", showCombo);
  inp.addEventListener("blur", ()=>{ combo.hidden = true; });
  inp.addEventListener("keydown", (e)=>{
    if(e.key === "ArrowDown"){ e.preventDefault(); if(combo.hidden) showCombo(); setAct(act + 1); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); setAct(act - 1); }
    else if(e.key === "Enter" && !combo.hidden && act >= 0){ e.preventDefault(); const it = combo.querySelectorAll(".combo-item")[act]; if(it) pick(it.dataset.no); }
    else if(e.key === "Escape"){ combo.hidden = true; }
  });
  combo.addEventListener("mousedown", (e)=>{            // mousedown (bukan click) supaya input tidak kehilangan fokus lebih dulu
    const it = e.target.closest(".combo-item");
    if(it){ e.preventDefault(); pick(it.dataset.no); }
  });
  el("qtyDiterima").addEventListener("input", ()=> updHint(true));
  fill.onclick = ()=>{ el("qtyDiterima").value = Math.max(0, (Number(el("tQty").value)||0) - priorQty()); updHint(true); };
  document.getElementById("tReset").onclick = ()=>{ terimaSelId = null; render(); };
  f.onsubmit = (e)=>{
    e.preventDefault();
    if(multiMode){
      const tgl = document.getElementById("tMultiTgl").value;
      if(!tgl){ msg.textContent = "Isi Tanggal Diterima."; return; }
      const ups = [];
      multiBox.querySelectorAll("tr[data-id]").forEach(tr=>{
        const r = records.find(x=>x.id === tr.dataset.id); if(!r) return;
        const q = tr.querySelector("[data-q]").value, cek = tr.querySelector("[data-c]").checked;
        const wasDone = (r.status === "Selesai" || r.status === "Diterima");
        if(q === "" && cek === wasDone) return;                       // tidak ada perubahan untuk item ini
        const u = {...r};
        if(q !== "") u.penerimaan = terimaLog(r).concat([{id: idFor(), tgl, qty: Math.max(0, Number(q)||0), w: new Date().toISOString()}]);
        if(cek && r.status !== "Batal") u.status = "Selesai";
        else if(!cek && wasDone) u.status = "Disetujui";
        ups.push(u);
      });
      if(!ups.length){ msg.textContent = "Isi Qty Diterima minimal untuk satu item."; return; }
      saveStart(true);
      (async()=>{
        try{ for(const u of ups){ applyJenis(u); await saveRecordOnline(u); } saveDone(); terimaSelId = null; render(); }
        catch(err){ saveFail(); alert("Gagal menyimpan: " + err.message); }
      })();
      return;
    }
    const r = records.find(x=>x.id === terimaSelId);
    if(!r){ msg.textContent = "Pilih No. Pengadaan yang valid dulu."; return; }
    const q = el("qtyDiterima").value, tgl = el("tglDiterima").value;
    if(q === "" || !tgl) return;
    // Penerimaan baru DITAMBAHKAN ke daftar (yang lama tidak diubah). Qty Diterima total dihitung otomatis.
    const entry = {id: idFor(), tgl, qty: Math.max(0, Number(q)||0), w: new Date().toISOString()};
    const updated = {...r, penerimaan: terimaLog(r).concat([entry])};
    // Ceklis "Sudah diterima" -> status di Laporan Permintaan otomatis menjadi "Selesai".
    // (status "Batal" tidak diubah)
    const cek = el("sudahDiterima").checked;
    if(cek && r.status !== "Batal") updated.status = "Selesai";
    else if(!cek && (r.status === "Selesai" || r.status === "Diterima")) updated.status = "Disetujui";
    terimaSelId = null;
    saveEditOptimistic(updated, null).catch(err=>alert("Gagal menyimpan: "+err.message));   // halaman ter-reset otomatis
  };
  setManual(false);
  const keep = terimaSelId && records.find(x=>x.id === terimaSelId);
  if(keep){ el("terimaNo").value = keep.noPengadaan; apply(); }
}

const MAX_PROOF = 8;
let proofState = null;   // {existing:[{id,name}], removed:[...], added:[{name,mime,data,preview,key}]}
function newProofState(existing){
  return {existing:(existing||[]).map(x=>({id:x.id,name:x.name})), removed:[], added:[]};
}
const proofThumb = (id,w)=>`https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w}`;
const proofView  = id=>`https://drive.google.com/file/d/${encodeURIComponent(id)}/view`;
function proofCount(st){ return st.existing.length + st.added.length; }

function compressImage(file, maxDim=1280, quality=0.8){
  return new Promise((resolve,reject)=>{
    if(!/^image\//.test(file.type)) return reject(new Error("Bukan file gambar: "+file.name));
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const sc = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width*sc)), h = Math.max(1, Math.round(img.height*sc));
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      const dataUrl = c.toDataURL("image/jpeg", quality);
      URL.revokeObjectURL(url);
      resolve({name:(file.name||"foto").replace(/\.[^.]+$/,"")+".jpg", mime:"image/jpeg",
               data:dataUrl.split(",")[1], preview:dataUrl, key:idFor()});
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("Gambar tidak bisa dibaca: "+file.name)); };
    img.src = url;
  });
}

function brokenThumb(img){
  const sp = document.createElement("span");
  sp.className = "proof-broken"; sp.textContent = "Tidak bisa dimuat";
  img.replaceWith(sp);
}

function renderProofList(){
  const box = document.getElementById("proofList");
  if(!box || !proofState) return;
  const st = proofState;
  const items = [
    ...st.existing.map(x=>`<div class="proof-item"><a href="${proofView(x.id)}" target="_blank" rel="noopener" title="Buka ukuran penuh"><img data-remote src="${proofThumb(x.id,240)}" alt="" loading="lazy"></a><button type="button" class="proof-del" data-pdel="${escapeHtml(x.id)}" aria-label="Hapus foto">×</button></div>`),
    ...st.added.map((x,i)=>`<div class="proof-item pending"><img src="${x.preview}" alt=""><span class="proof-new">Baru</span><button type="button" class="proof-del" data-pnew="${i}" aria-label="Batalkan foto">×</button></div>`)
  ];
  box.innerHTML = items.length ? items.join("") : '<div class="proof-empty">Belum ada foto bukti.</div>';
  box.querySelectorAll("img[data-remote]").forEach(im=> im.onerror = ()=>brokenThumb(im));
  box.querySelectorAll("[data-pdel]").forEach(b=> b.onclick = ()=>{
    const it = st.existing.find(x=>x.id===b.dataset.pdel);
    if(it){ st.removed.push(it); st.existing = st.existing.filter(x=>x.id!==it.id); renderProofList(); }
  });
  box.querySelectorAll("[data-pnew]").forEach(b=> b.onclick = ()=>{
    st.added.splice(Number(b.dataset.pnew),1); renderProofList();
  });
}

function bindProofSection(){
  const add = document.getElementById("proofAdd"), input = document.getElementById("proofInput");
  const hint = document.getElementById("proofHint");
  if(!add || !input || !proofState) return;
  if(!onlineMode()){
    add.disabled = true;
    hint.textContent = "Foto hanya bisa dilampirkan di mode online (API_URL harus terisi).";
  }
  add.onclick = ()=> input.click();
  input.onchange = async ()=>{
    const files = [...input.files]; input.value = "";
    const room = Math.max(0, MAX_PROOF - proofCount(proofState));
    if(files.length > room) alert(`Maksimal ${MAX_PROOF} foto per pengadaan. Hanya ${room} foto lagi yang bisa ditambahkan.`);
    add.disabled = true; add.textContent = "Memproses...";
    for(const f of files.slice(0, room)){
      try{ proofState.added.push(await compressImage(f)); }
      catch(e){ alert(e.message); }
    }
    add.disabled = false; add.textContent = "📷 Tambah Foto";
    renderProofList();
  };
  renderProofList();
}

// Kirim perubahan foto ke server setelah data pengadaannya tersimpan.
async function syncProofs(recordId, st){
  const errors = [];
  const final = st.existing.map(x=>({...x}));
  for(const r of st.removed){
    try{ await apiRequest({action:"deleteProof", recordId, fileId:r.id}); }
    catch(e){ errors.push("hapus "+(r.name||"foto")+": "+e.message); final.push(r); }
  }
  for(const a of st.added){
    try{
      const res = await apiRequest({action:"uploadProof", recordId, name:a.name, mime:a.mime, data:a.data, key:a.key}, 0, 60000);
      final.push(res.proof);
    }catch(e){ errors.push(a.name+": "+e.message); }
  }
  const rec = records.find(r=>r.id===recordId);
  if(rec) rec.bukti = final;
  return {errors};
}
const hasProofChanges = st => !!st && onlineMode() && (st.added.length > 0 || st.removed.length > 0);

function revealRecord(id){

// ---------- Animasi "sedang menyimpan" / "tersimpan" ----------
let savingCount = 0, saveHideTimer = null, saveMode = "toast";
const SAVE_ICONS = {
  saving: '<div class="save-spinner"></div>',
  saved:  '<svg viewBox="0 0 52 52" aria-hidden="true"><circle class="sc-circle" cx="26" cy="26" r="24" fill="none"/><path class="sc-tick" fill="none" d="M14 27l8 8 16-17"/></svg>',
  error:  '<svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24" fill="none" stroke="#C1443C" stroke-width="3"/><path class="sc-x" d="M18 18l16 16M34 18L18 34"/></svg>'
};
function saveShow(state, text){
  const layer = document.getElementById("saveLayer");
  clearTimeout(saveHideTimer);
  layer.hidden = false;
  layer.className = "save-layer " + saveMode + (state==="saving" && saveMode==="center" ? " block" : "");
  document.getElementById("saveCard").dataset.state = state;
  document.getElementById("saveIcon").innerHTML = SAVE_ICONS[state];
  document.getElementById("saveText").textContent = text;
}
function saveHide(){
  const layer = document.getElementById("saveLayer");
  layer.classList.add("out");
  setTimeout(()=>{ if(layer.classList.contains("out")) layer.hidden = true; }, 260);
}
function saveStart(center, text){
  if(savingCount === 0) saveMode = center ? "center" : "toast";
  else if(center) saveMode = "center";
  savingCount++;
  saveShow("saving", text || "SEDANG MENYIMPAN...");
}
function saveDone(text){
  savingCount = Math.max(0, savingCount - 1);
  if(savingCount > 0) return;
  saveShow("saved", text || "TERSIMPAN BREE");
  saveHideTimer = setTimeout(saveHide, 1400);
}
function saveFail(msg){
  savingCount = Math.max(0, savingCount - 1);
  saveShow("error", msg || "GAGAL MENYIMPAN");
  saveHideTimer = setTimeout(saveHide, 2600);
}

// Perubahan tampil seketika; penyimpanan ke server berjalan di latar belakang.
async function saveEditOptimistic(updated, st){
  const idx = records.findIndex(r=>r.id===updated.id);
  if(idx < 0) return;
  const prev = records[idx];
  updated = normRecord(updated);
  records[idx] = updated;
  if(view !== "form") render();
  saveStart(false);
  if(!onlineMode()){ persist(); saveDone(); return; }
  pendingWrites++;
  showSyncStatus("Menyimpan...");
  try{
    await apiRequest({action:"save", record: updated});
    showSyncStatus("✓ Tersimpan • " + new Date().toLocaleTimeString("id-ID"));
    let errs = [];
    if(hasProofChanges(st)){
      errs = (await syncProofs(updated.id, st)).errors;
      if(view !== "form") render();
    }
    if(errs.length){ saveFail("FOTO GAGAL DIUNGGAH"); alert("Data tersimpan, tetapi ada foto yang gagal:\n"+errs.join("\n")); }
    else saveDone();
  }catch(e){
    saveFail();
    const i = records.findIndex(r=>r.id===updated.id);
    if(i >= 0) records[i] = prev;          // gagal: kembalikan data lama
    if(view !== "form") render();
    showSyncStatus("Gagal menyimpan", true);
    throw e;
  }finally{
    pendingWrites--;
  }
}
document.getElementById("editClose").addEventListener("click", closeEditModal);
document.getElementById("editCancel").addEventListener("click", closeEditModal);
document.getElementById("editForm").addEventListener("submit", (e)=>{
  e.preventDefault();
  if(!editFormData) return;
  const fd = new FormData(e.target);
  const updated = {...editFormData};
  for(const [k,v] of fd.entries()) updated[k]=v;
  if(!updated.noPengadaan.trim() || !updated.namaBarang.trim() || (updated.jenis !== "Perbaikan" && !updated.qty) || !updated.tglPengajuan) return;
  updated.qty = Number(updated.qty)||0;
  updated.estimasiHarga = Number(updated.estimasiHarga)||0;
  applyJenis(updated);
  const st = proofState;
  if(st) updated.bukti = st.existing.map(x=>({...x}));    // foto yang dihapus langsung hilang dari tampilan
  closeEditModal();
  saveEditOptimistic(updated, st).catch(err=>alert("Gagal menyimpan: "+err.message));
});

// ---------- Login / Logout ----------
const AKUN_KEY = "pengadaan_akun_v1";
const SES_KEY = "pengadaan_sesi_v1";
function pwHash(s){   // hash sederhana (client-side, untuk penggunaan pribadi)
  let h = 5381;
  for(let i=0;i<s.length;i++){ h = ((h<<5)+h) ^ s.charCodeAt(i); h = h >>> 0; }
  return "h"+h.toString(36);
}
function akunTersimpan(){ try{ const raw = localStorage.getItem(AKUN_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }
function sesiAktif(){ try{ return sessionStorage.getItem(SES_KEY) === "1"; }catch(e){ return false; } }
let pinMode = "login", pinSalah = 0;
function showLogin(mode){
  pinMode = mode;
  const layer = document.getElementById("loginLayer");
  if(!layer) return;
  layer.hidden = false; layer.style.display = "flex";
  const set = mode === "set";
  document.getElementById("loginTitle").textContent = set ? "Buat Akun Baru" : "Masuk Aplikasi";
  document.getElementById("loginSub").textContent = set ? "Buat username dan password — jangan lupa disimpan" : "Masukkan username dan password untuk melanjutkan";
  const row2 = document.getElementById("rowPass2");
  if(row2) row2.style.display = set ? "" : "none";
  const btn = document.getElementById("btnLogin");
  if(btn) btn.textContent = set ? "Simpan & Masuk" : "Masuk";
  const u = document.getElementById("loginUser");
  if(u) u.value = set ? "" : ((akunTersimpan()||{}).user || "");
  const p = document.getElementById("loginPass"); if(p) p.value = "";
  const p2 = document.getElementById("loginPass2"); if(p2) p2.value = "";
  const err = document.getElementById("loginErr"); if(err){ err.textContent = ""; err.style.color = ""; }
  const hint = document.getElementById("loginHint"); if(hint) hint.textContent = "";
  const lp = document.getElementById("btnLupaPin"); if(lp) lp.hidden = true;
}
function hideLogin(){ const l = document.getElementById("loginLayer"); if(l){ l.hidden = true; l.style.display = "none"; } }
function pinConfirm(){
  const err = document.getElementById("loginErr");
  const uEl = document.getElementById("loginUser"), pEl = document.getElementById("loginPass"), p2El = document.getElementById("loginPass2");
  const u = (uEl && uEl.value || "").trim();
  const p = (pEl && pEl.value) || "";
  const p2 = (p2El && p2El.value) || "";
  const fail = msg => { if(err){ err.style.color = ""; err.textContent = msg; } };
  if(!u || !p){ fail("Username dan password wajib diisi."); return; }
  if(pinMode === "set"){
    if(p.length < 4){ fail("Password minimal 4 karakter."); return; }
    if(p !== p2){ fail("Ulangi password tidak sama."); return; }
    try{ localStorage.setItem(AKUN_KEY, JSON.stringify({user:u, pw:pwHash(p)})); }catch(e){}
    sessionStorage.setItem(SES_KEY, "1");
    pinSalah = 0;
    if(err){ err.style.color = "#1FA36B"; err.textContent = "Akun berhasil dibuat ✓"; }
    setTimeout(()=>{ hideLogin(); if(err){ err.textContent = ""; err.style.color = ""; } }, 700);
    return;
  }
  const akun = akunTersimpan() || {user:"", pw:""};
  if(u === akun.user && pwHash(p) === akun.pw){
    sessionStorage.setItem(SES_KEY, "1");
    pinSalah = 0;
    if(err) err.textContent = "";
    const lp = document.getElementById("btnLupaPin"); if(lp) lp.hidden = true;
    hideLogin();
  }else{
    pinSalah++;
    fail("Username atau password salah.");
    if(pEl) pEl.value = "";
    if(pinSalah >= 3){
      const lp = document.getElementById("btnLupaPin");
      if(lp) lp.hidden = false;
      fail("Username/password salah " + pinSalah + "x. Gunakan tombol reset bila lupa.");
    }
  }
}
(function bindLogin(){
  const btn = document.getElementById("btnLogin");
  if(btn) btn.onclick = pinConfirm;
  ["loginPass","loginPass2"].forEach(id=>{ const el = document.getElementById(id); if(el) el.addEventListener("keydown", e=>{ if(e.key === "Enter") pinConfirm(); }); });
  const uEl = document.getElementById("loginUser");
  if(uEl) uEl.addEventListener("keydown", e=>{ if(e.key === "Enter"){ const pEl = document.getElementById("loginPass"); if(pEl && !pEl.value) pEl.focus(); else pinConfirm(); } });
  const lo = document.getElementById("btnLogout");
  if(lo) lo.onclick = ()=>{
    if(!confirm("Keluar dari aplikasi?")) return;
    try{ sessionStorage.removeItem(SES_KEY); }catch(e){}
    pinSalah = 0;
    showLogin("login");
  };
  const lp = document.getElementById("btnLupaPin");
  if(lp) lp.onclick = ()=>{
    if(!confirm("Reset username & password di perangkat ini?\nAnda akan diminta membuat akun baru.\nData pengajuan, pengeluaran, dan stock opname TIDAK terhapus.")) return;
    try{ localStorage.removeItem(AKUN_KEY); }catch(e){}
    pinSalah = 0;
    lp.hidden = true;
    showLogin("set");
  };
})();
