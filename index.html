<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manufacture - Pengadaan Barang</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#0E1B3D;
    --paper:#FFFFFF;
    --paper-deep:#EDF1FB;
    --panel:#FFFFFF;
    --line:#E1E7F4;
    --rail:#0A2463;
    --rail-grad:linear-gradient(180deg,#0A2463 0%,#1E48B5 38%,#A8285F 74%,#D7263D 100%);
    --rail-soft:#1A43A0;
    --grad:linear-gradient(120deg,#1F4FC2 0%,#7B3FB5 50%,#D7263D 100%);
    --blue:#1F4FC2;
    --accent:#D7263D;
    --accent-deep:#C21F36;
    --accent-fg:#FFFFFF;
    --rail-accent:#FFFFFF;
    --muted:#5B6C8F;
    --btn-bg:var(--grad);
    --btn-fg:#FFFFFF;
    --glow-blue:rgba(31,79,194,.10);
    --glow-red:rgba(215,38,61,.09);
    --focus:rgba(31,79,194,.22);
    --shadow:0 1px 2px rgba(11,42,111,.06),0 10px 30px rgba(31,79,194,.10);
    --row-hover:rgba(31,79,194,.05);
    --paper-blur:rgba(255,255,255,.88);
    --band:linear-gradient(90deg,#E4EDFF 0%,#EFE9FA 55%,#FBE6EA 100%);
    --band-shadow:0 10px 18px -12px rgba(11,42,111,.35);
  }
  html[data-theme="dark"]{
    --ink:#E8EEFB;
    --paper:#070C1C;
    --paper-deep:#0E1636;
    --panel:#0B1330;
    --line:#1C2B55;
    --rail:#050E2B;
    --rail-grad:linear-gradient(180deg,#050E2B 0%,#0E2A7A 38%,#6B1B4C 74%,#8A1428 100%);
    --rail-soft:#0C1838;
    --grad:linear-gradient(120deg,#2F5BD8 0%,#7B3FB5 50%,#E0364C 100%);
    --blue:#6EA0FF;
    --accent:#FF5468;
    --accent-deep:#FF8794;
    --accent-fg:#FFFFFF;
    --rail-accent:#FFFFFF;
    --muted:#8E9CC0;
    --btn-bg:var(--grad);
    --btn-fg:#FFFFFF;
    --glow-blue:rgba(47,91,216,.16);
    --glow-red:rgba(224,54,76,.12);
    --focus:rgba(110,160,255,.30);
    --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.42);
    --row-hover:rgba(110,160,255,.07);
    --paper-blur:rgba(7,12,28,.88);
    --band:linear-gradient(90deg,#0F1B45 0%,#1B1846 55%,#2B1531 100%);
    --band-shadow:0 10px 18px -12px rgba(0,0,0,.7);
  }
  html[data-theme="dark"] .stat-card .icon{background:var(--rail-soft);}
  *{box-sizing:border-box;}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--paper);color:var(--ink);}
  h1,h2{font-family:Georgia,serif;font-weight:normal;margin:0;}
  button{cursor:pointer;font-family:inherit;}
  input,select{font-family:inherit;font-size:14px;}

  .app{display:flex;min-height:100vh;}

  .sidebar{width:76px;flex-shrink:0;background:var(--rail-grad);display:flex;flex-direction:column;align-items:center;padding:24px 0;position:sticky;top:0;height:100vh;align-self:flex-start;z-index:20;}
  .brand{padding:0 4px;margin-bottom:28px;text-align:center;background:transparent;border:none;display:block;cursor:pointer;font-family:inherit;border-radius:8px;transition:transform .15s ease;}
  .brand:hover{transform:scale(1.06);}
  .brand:active{transform:scale(.96);}
  .brand:focus-visible{outline:2px solid var(--accent);outline-offset:4px;}
  .brand-mark{width:44px;height:44px;margin:0 auto 10px;}
  .brand-mark svg{width:100%;height:100%;display:block;}
  .brand .name{color:var(--rail-accent);font-size:10px;font-weight:700;letter-spacing:.06em;}

  .nav{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;}
  .nav button{position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;background:#FFFFFF;border:2px solid #FFFFFF;border-radius:10px;transition:transform .12s ease,box-shadow .15s ease;}
  .nav button img{width:30px;height:30px;display:block;pointer-events:none;}
  .nav button:hover,.nav button:focus-visible{transform:translateY(-1px);box-shadow:0 3px 12px rgba(255,255,255,.22);}
  .nav button.active{box-shadow:0 0 0 3px rgba(255,255,255,.55),0 0 20px rgba(255,255,255,.4);}
  .nav button::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:#FFFFFF;color:#0E1B3D;font-size:12px;line-height:1;padding:7px 10px;border-radius:4px;white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s ease;z-index:100;}
  #btnLogout{position:relative;}
  #btnLogout::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:#FFFFFF;color:#0E1B3D;font-size:12px;line-height:1;padding:7px 10px;border-radius:4px;white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s ease;}
  #btnLogout:hover::after,#btnLogout:focus-visible::after{opacity:1;visibility:visible;}
  .nav button:hover::after,.nav button:focus-visible::after{opacity:1;visibility:visible;}
  .add-btn{position:relative;margin:8px 0 0;width:44px;height:44px;padding:0;background:#F4F4F2;border:none;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 2px 10px rgba(255,255,255,.12);transition:transform .12s ease,box-shadow .15s ease;}
  .add-btn svg{width:22px;height:22px;display:block;pointer-events:none;}
  .add-btn:hover,.add-btn:focus-visible{transform:translateY(-1px);box-shadow:0 0 0 1px rgba(255,255,255,.15),0 4px 14px rgba(255,255,255,.2);}
  .add-btn:active{transform:translateY(0) scale(.97);}
  .add-btn::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:#FFFFFF;color:#0E1B3D;font-size:12px;line-height:1;padding:7px 10px;border-radius:4px;white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s ease;z-index:100;}
  .add-btn:hover::after,.add-btn:focus-visible::after{opacity:1;visibility:visible;}
  .sidebar-footer{margin-top:auto;padding:24px 6px 0;color:rgba(255,255,255,.72);font-size:10px;line-height:1.35;text-align:center;word-break:break-word;}
  .header-actions{display:flex;align-items:center;gap:14px;}
  .theme-toggle{padding:0;background:transparent;border:none;display:block;flex-shrink:0;}
  .switch{position:relative;display:block;width:52px;height:30px;border:2px solid var(--muted);border-radius:30px;background:transparent;transition:background .2s ease,border-color .2s ease;}
  .switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;transition:left .2s ease,background .2s ease;}
  .switch .knob svg{width:12px;height:12px;display:block;}
  .switch .knob svg path{fill:var(--paper);}
  html[data-theme="dark"] .switch{border-color:transparent;background:var(--grad);}
  html[data-theme="dark"] .switch .knob{left:25px;background:#14181D;}
  html[data-theme="dark"] .switch .knob svg path{fill:#F4E9D8;}
  .theme-toggle:focus-visible .switch{outline:2px solid var(--accent);outline-offset:3px;}

  .main{flex:1;min-width:0;padding:32px;}

  .page-header{display:flex;align-items:center;justify-content:between;justify-content:space-between;margin-bottom:24px;}
  .page-header h1{font-size:24px;}
  .page-header p{color:var(--muted);font-size:14px;margin-top:4px;}
  .btn-dark{background:var(--btn-bg);color:var(--btn-fg);border:none;padding:10px 16px;font-size:14px;display:flex;align-items:center;gap:8px;}
  .btn-accent{background:var(--grad);color:#fff;border:none;padding:10px 20px;font-size:14px;}
  .btn-plain{background:transparent;border:none;color:var(--muted);padding:10px 20px;font-size:14px;}
  .btn-outline{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:10px 16px;font-size:14px;display:flex;align-items:center;gap:8px;}

  .stat-row{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:24px;}
  .stat-card{flex:1;min-width:190px;background:var(--panel);border:1px solid var(--line);padding:20px;}
  .stat-card .icon{width:32px;height:32px;background:var(--paper-deep);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:15px;}
  .stat-card .label{color:var(--muted);font-size:13px;}
  .stat-card .value{font-family:Georgia,serif;font-size:24px;margin-top:12px;}

  .grid-2{display:grid;grid-template-columns:2fr 3fr;gap:16px;}
  @media (max-width:900px){.grid-2{grid-template-columns:1fr;}}
  .panel{background:var(--panel);border:1px solid var(--line);padding:20px;}
  .panel h2{color:var(--ink);font-family:system-ui,sans-serif;font-size:13px;margin-bottom:16px;color:var(--muted);}

  .status-row{display:flex;align-items:center;gap:12px;font-size:13px;margin-bottom:10px;}
  .status-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;font-size:12px;border:1px solid;white-space:nowrap;}
  .status-dot{width:6px;height:6px;border-radius:50%;}
  .bar-track{flex:1;height:8px;background:var(--paper-deep);}
  .bar-fill{height:100%;}
  .count-label{width:26px;text-align:right;color:var(--muted);}

  .filters{display:flex;flex-wrap:wrap;gap:12px;margin:0 -32px 16px;padding:12px 32px;position:sticky;top:0;z-index:15;background:var(--paper);}
  .search-box{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--paper);border:1px solid var(--line);min-width:220px;}
  .search-box input{border:none;background:transparent;padding:10px 0;width:100%;outline:none;color:var(--ink);}
  select.filter-select{padding:9px 10px;background:var(--paper);border:1px solid var(--line);color:var(--ink);}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  thead tr{border-bottom:1px solid var(--line);}
  th{text-align:left;padding:12px 16px;font-weight:normal;color:var(--muted);}
  td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top;}
  .table-wrap{background:var(--panel);border:1px solid var(--line);overflow-x:auto;}
  .empty-state{padding:48px 20px;text-align:center;color:var(--muted);font-size:14px;}
  .sub-text{color:var(--muted);font-size:12px;margin-top:2px;}
  .mono{font-family:ui-monospace,Consolas,monospace;}
  .row-actions{display:flex;align-items:center;gap:14px;}
  .row-actions button{background:none;border:none;color:var(--muted);font-size:13px;padding:0;}
  .status-select{border:1px solid currentColor;border-radius:8px;background-color:var(--panel);background-color:color-mix(in srgb,currentColor 9%,var(--panel));font-size:12.5px;font-weight:600;padding:7px 10px;min-width:118px;cursor:pointer;transition:box-shadow .15s ease,transform .1s ease;}
  td:nth-child(n+5):nth-child(-n+8){white-space:nowrap;}
  .status-select:hover{box-shadow:0 2px 8px color-mix(in srgb,currentColor 28%,transparent);}
  .status-select:focus{outline:none;box-shadow:0 0 0 3px var(--focus);}
  .status-select option{color:var(--ink);background:var(--panel);font-weight:500;}
  tr.row-flash td{animation:rowFlash 1.6s ease;}
  @keyframes rowFlash{from{background:rgba(217,138,43,.38);}to{background:transparent;}}
  .load-more{padding:18px;text-align:center;color:var(--muted);font-size:13px;}
  .combo-wrap{position:relative;}
  .combo-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:40;max-height:300px;overflow-y:auto;overscroll-behavior:contain;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.35);}
  .combo-item{padding:9px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--line);}
  .combo-item:last-child{border-bottom:0;}
  .combo-item:hover,.combo-item.act{background:var(--paper);}
  .combo-item small{display:block;margin-top:2px;font-size:11px;color:var(--muted);}
  .combo-empty{padding:12px;font-size:13px;color:var(--muted);}
  .btn-belum{position:relative;}
  .btn-bubble{position:absolute;top:-9px;right:-9px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#E5484D;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--paper,#0b1020);}
  .modal-belum{max-width:640px;max-height:85vh;overflow-y:auto;overscroll-behavior:contain;text-align:left;padding:22px;}
  .modal-belum .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
  .riw-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 10px;}
  .pager{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 2px;font-size:13px;color:var(--muted);}
  .pager .pg-nums{display:flex;gap:4px;flex-wrap:wrap;}
  .pg-btn{min-width:34px;height:34px;padding:0 10px;background:var(--panel);border:1px solid var(--line);color:var(--ink);cursor:pointer;border-radius:8px;font-size:13px;}
  .pg-btn:hover:not([disabled]){border-color:var(--blue);}
  .pg-btn[disabled]{opacity:.4;cursor:default;}
  .pg-btn.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700;}
  .pg-gap{align-self:center;padding:0 4px;}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:8px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .save-layer{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:1;transition:opacity .25s ease;}
  .save-layer[hidden]{display:none;}
  .save-layer.out{opacity:0;}
  .save-layer.toast{align-items:flex-end;padding-bottom:28px;}
  .save-layer.block{background:rgba(10,13,17,.5);pointer-events:auto;}
  .save-card{display:flex;align-items:center;gap:14px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:18px 26px;box-shadow:0 14px 40px rgba(0,0,0,.35);animation:savePop .22s ease;}
  .save-layer.center .save-card{flex-direction:column;gap:12px;padding:28px 40px;min-width:230px;}
  @keyframes savePop{from{opacity:0;transform:translateY(8px) scale(.94);}to{opacity:1;transform:none;}}
  .save-text{font-size:14px;font-weight:700;letter-spacing:.06em;}
  .save-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .save-spinner{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite;}
  .save-icon svg{width:40px;height:40px;display:block;}
  .sc-circle{stroke:#3F7D58;stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151;animation:scDraw .5s ease forwards;}
  .sc-tick{stroke:#3F7D58;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:scDraw .3s .38s ease forwards;}
  .sc-x{stroke:#C1443C;stroke-width:4;stroke-linecap:round;}
  .save-card[data-state="saved"] .save-text{color:#3F7D58;}
  .save-card[data-state="error"] .save-text{color:#C1443C;}
  @keyframes scDraw{to{stroke-dashoffset:0;}}
  .modal-overlay{position:fixed;inset:0;background:rgba(10,13,17,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;}
  .modal-overlay[hidden]{display:none;}
  .modal{width:100%;max-width:360px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:28px 24px 22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35);animation:modalIn .15s ease;}
  @keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.97);}to{opacity:1;transform:none;}}
  .modal-edit{max-width:680px;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;text-align:left;padding:22px;}
  .edit-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .edit-head h2{font-size:20px;}
  .edit-head button{background:none;border:none;font-size:24px;line-height:1;color:var(--muted);padding:2px 8px;}
  #editForm{max-width:none;}
  @media (max-width:600px){.field-grid{grid-template-columns:1fr;}}
  .modal-icon{width:44px;height:44px;margin:0 auto 14px;border-radius:50%;background:#C1443C;color:#fff;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .modal-confirm h3{margin:0 0 8px;font-size:17px;letter-spacing:.02em;}
  .modal-confirm p{margin:0 0 22px;color:var(--muted);font-size:13px;min-height:1em;word-break:break-word;}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions button{flex:1;padding:11px 12px;font-size:14px;border-radius:8px;border:1px solid var(--line);}
  .modal-no{background:var(--paper);color:var(--ink);}
  .modal-yes{background:#C1443C;color:#fff;border-color:#C1443C !important;}
  .modal-actions button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  form{display:flex;flex-direction:column;gap:20px;max-width:760px;}
  .form-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .form-header button{background:none;border:none;font-size:20px;color:var(--muted);}
  fieldset{border:none;padding:0;margin:0;}
  .section{background:var(--panel);border:1px solid var(--line);padding:20px;}
  .section h3{color:var(--muted);font-size:12px;margin:0 0 16px;font-weight:normal;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .field{display:flex;flex-direction:column;gap:6px;font-size:13px;}
  .field span{color:var(--muted);}
  .field span .req{color:var(--accent-deep);}
  .field input,.field select{padding:9px 10px;background:var(--paper);border:1px solid var(--line);color:var(--ink);}
  .field input[readonly]{opacity:.7;}
  .form-actions{display:flex;align-items:center;gap:12px;}

  .loading{color:var(--muted);font-size:14px;}

  /* ===== Login Screen ===== */
  .login-layer{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(760px 380px at 8% -60px,var(--glow-blue),transparent 70%),radial-gradient(760px 380px at 95% -60px,var(--glow-red),transparent 70%),var(--paper);
    background-attachment:fixed;animation:loginIn .35s ease;}
  .login-layer[hidden]{display:none !important;}
  @keyframes loginIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
  .login-card{position:relative;width:min(380px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:20px;
    box-shadow:var(--shadow);padding:36px 32px;text-align:center;}
  .login-card .login-hint{min-height:16px;}
  .login-mark{width:64px;height:64px;margin:0 auto 16px;border-radius:18px;background:var(--rail-grad);
    display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 8px 20px rgba(11,42,111,.25);}
  .login-card h1{font-size:22px;margin:0 0 4px;color:var(--ink);}
  .login-card p{margin:0 0 22px;font-size:13.5px;color:var(--muted);}
  .pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:22px;}
  .pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:transparent;transition:all .15s ease;}
  .pin-dot.on{background:var(--accent);border-color:var(--accent);transform:scale(1.15);}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:250px;margin:0 auto;}
  .pin-key{height:56px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    font-size:20px;font-weight:600;cursor:pointer;transition:all .12s ease;}
  .pin-key:hover{border-color:var(--accent);background:var(--row-hover);}
  .pin-key:active{transform:scale(.94);background:var(--accent);color:#fff;}
  .pin-key.util{font-size:15px;color:var(--muted);}
  .login-err{min-height:20px;font-size:13px;color:var(--danger,#D7263D);margin-top:14px;font-weight:600;}
  .login-hint{font-size:12px;color:var(--muted);margin-top:10px;}
  .login-fields{display:flex;flex-direction:column;gap:14px;text-align:left;margin-bottom:18px;}
  .login-field span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.3px;}
  .login-field input{width:100%;box-sizing:border-box;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper,#fff);color:var(--ink);padding:0 14px;font-size:15px;outline:none;transition:border-color .15s ease;}
  .login-field input:focus{border-color:var(--accent);}
  .login-go{width:100%;height:46px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s ease;}
  .login-go:hover{filter:brightness(1.08);}
  .login-go:active{transform:scale(.97);}

  /* ===== Tema: Biru–Merah Gradien Putih ===== */
  body{background:radial-gradient(760px 380px at 8% -60px,var(--glow-blue),transparent 70%),radial-gradient(760px 380px at 95% -60px,var(--glow-red),transparent 70%),var(--paper);background-attachment:fixed;}
  .sidebar{background:var(--rail-grad);box-shadow:2px 0 18px rgba(11,42,111,.18);}
  .page-header h1{font-size:26px;letter-spacing:.01em;}
  .page-header h1::after{content:"";display:block;width:44px;height:3px;border-radius:3px;background:var(--grad);margin-top:8px;}
  .stat-card,.panel,.table-wrap,.section{border-radius:12px;box-shadow:var(--shadow);}
  .modal .section{box-shadow:none;}
  .stat-card{position:relative;overflow:hidden;}
  .stat-card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--grad);}
  .stat-card .icon{border-radius:8px;}
  .btn-dark,.btn-accent,.btn-outline,.btn-plain{border-radius:8px;font-weight:600;}
  .btn-dark,.btn-accent{transition:transform .12s ease,filter .15s ease;}
  .btn-dark:hover,.btn-accent:hover{filter:brightness(1.1);transform:translateY(-1px);}
  .btn-accent{color:var(--accent-fg);background:var(--grad);}
  .btn-dark,.btn-accent{box-shadow:0 4px 14px rgba(31,79,194,.25);}
  .search-box,select.filter-select,.field input,.field select{border-radius:8px;transition:border-color .15s ease,box-shadow .15s ease;}
  .search-box:focus-within,select.filter-select:focus,.field input:focus,.field select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--focus);}
  .filters{background:var(--paper-blur);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;}
  tbody tr{transition:background .15s ease;}
  tbody tr:hover td{background:var(--row-hover);}
  .bar-track{border-radius:6px;overflow:hidden;}
  .status-badge{border-radius:6px;}

  /* ===== Pita judul + pencarian (Daftar Pengadaan): latar warna & garis pemisah dari paling atas ===== */
  .list-band{margin:-32px -32px 0;padding:28px 32px 8px;background:var(--band);}
  .filters{background:var(--band);-webkit-backdrop-filter:none;backdrop-filter:none;padding:12px 32px 18px;margin-bottom:18px;box-shadow:var(--band-shadow);}
  .filters::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--grad);}

  /* ===== Bukti / foto ===== */
  .proof-list{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
  .proof-item{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--paper-deep);}
  .proof-item a{display:block;width:100%;height:100%;}
  .proof-item img{width:100%;height:100%;object-fit:cover;display:block;}
  .proof-item.pending{border-color:var(--blue);}
  .proof-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(10,20,50,.78);color:#fff;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;}
  .proof-del:hover{background:#D7263D;}
  .proof-new{position:absolute;left:4px;bottom:4px;background:var(--grad);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;}
  .proof-empty{color:var(--muted);font-size:13px;padding:6px 0;}
  .proof-broken{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:6px;text-align:center;color:var(--muted);font-size:11px;}
  .proof-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .proof-actions .btn-outline:disabled{opacity:.5;cursor:not-allowed;}
  .proof-hint{color:var(--muted);font-size:12px;}
  .proof-btn{display:inline-flex !important;align-items:center;gap:2px;}
  .proof-btn span{font-size:11px;font-weight:700;color:var(--accent-deep);}
  .modal-proof{max-width:780px;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;text-align:left;padding:22px;}
  .proof-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
  .proof-card{display:block;border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;color:var(--ink);background:var(--paper-deep);}
  .proof-card img{width:100%;height:170px;object-fit:cover;display:block;}
  .proof-card .proof-broken{height:170px;}
  .proof-card span{display:block;padding:6px 8px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ===== Penerimaan: sesuai / kurang / lebih ===== */
  .tm-badge{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;}
  .tm-badge.kurang,#terimaHint.kurang,#tHint.kurang{color:#D7263D;background:rgba(215,38,61,.12);}
  .tm-badge.lebih,#terimaHint.lebih,#tHint.lebih{color:#B5760B;background:rgba(224,154,26,.16);}
  .tm-badge.sesuai,#terimaHint.sesuai,#tHint.sesuai{color:#1B8A5A;background:rgba(31,163,107,.14);}
  .terima-note{display:flex;align-items:center;gap:10px;min-height:22px;}
  #terimaHint,#tHint{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;}
  #terimaHint:empty,#tHint:empty{display:none;}
  .link-btn{background:none;border:none;padding:0;color:var(--blue);font-size:12px;text-decoration:underline;cursor:pointer;}
  .stat-link{cursor:pointer;transition:transform .12s ease,box-shadow .15s ease;}
  .stat-link:hover,.stat-link:focus-visible{transform:translateY(-2px);outline:none;box-shadow:0 0 0 3px var(--focus),var(--shadow);}

  /* ===== 4 menu: ikon svg, penerimaan ===== */
  .nav button svg{width:28px;height:28px;display:block;pointer-events:none;}
  .muted-dash{color:var(--muted);}
  .terima-msg{margin-top:12px;font-size:13px;color:var(--muted);min-height:1em;}
  .btn-accent:disabled{opacity:.45;cursor:not-allowed;filter:none;transform:none;}
  .field input:disabled{opacity:.55;cursor:not-allowed;}
  .link-btn:disabled{opacity:.4;cursor:not-allowed;text-decoration:none;}
  .sub-title{font-size:18px;margin:32px 0 12px;}
  #terimaForm .field-grid{grid-template-columns:1fr 1fr 1fr;}
  #terimaForm .section:nth-of-type(3) .field-grid{grid-template-columns:1fr 1fr;}
  @media (max-width:700px){#terimaForm .field-grid,#terimaForm .section:nth-of-type(3) .field-grid{grid-template-columns:1fr;}}

  /* Form halaman penuh: selebar area konten (sampai tepi kanan) */
  #pengadaanForm,#terimaForm{max-width:none;}

  /* ===== Analisa & pengingat ===== */
  .nav-badge{position:absolute;top:-7px;right:-7px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#FFD23F;color:#3A2A00;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(10,20,60,.55);}
  .nav-badge[hidden]{display:none;}
  .analisa-controls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px;}
  .rm-note{color:var(--muted);font-size:12.5px;margin-bottom:14px;line-height:1.5;}
  .rm-inline{color:var(--accent-deep);}
  .count-chip{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;background:var(--paper-deep);color:var(--muted);font-family:system-ui,sans-serif;font-size:12px;font-weight:600;vertical-align:middle;}
  .div-chip{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:6px;background:var(--paper-deep);color:var(--muted);font-size:11px;font-weight:700;}
  .avg-bar{height:5px;border-radius:4px;background:var(--paper-deep);margin-top:5px;width:110px;overflow:hidden;}
  .avg-bar i{display:block;height:100%;background:var(--grad);border-radius:4px;}
  .rm-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .rm-badge.terlambat{color:#D7263D;background:rgba(215,38,61,.12);}
  .rm-badge.segera{color:#B5760B;background:rgba(224,154,26,.18);}
  .rm-badge.aman{color:#1B8A5A;background:rgba(31,163,107,.14);}
  .rm-badge.data{color:var(--muted);background:var(--paper-deep);}
  .rm-btn{padding:6px 12px !important;font-size:12.5px !important;}
  .abaikan-btn{color:var(--muted) !important;}
  .rm-badge.diabaikan{color:var(--muted);background:var(--paper-deep);}
  .remind-panel{margin-top:16px;}
  .remind-panel h2{margin:0;}
  .remind-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;}
  .remind-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);}
  .rm-main{flex:1;min-width:0;}
  .rm-name{font-weight:600;font-size:14px;}
  .rm-sub{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.45;}
  .rm-more{color:var(--muted);font-size:12px;padding-top:10px;border-top:1px solid var(--line);}
  @media (max-width:700px){.remind-row{flex-wrap:wrap;}}

  /* ===== Stock opname ===== */
  .src-tag{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:6px;font-size:10.5px;font-weight:700;vertical-align:middle;}
  .src-tag.so{color:#6B2FA8;background:rgba(123,63,181,.14);}
  .src-tag.rq{color:#1F4FC2;background:rgba(31,79,194,.12);}
  .so-head{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:6px;}
  .so-head .field{min-width:200px;}
  .so-warn{color:#B5760B;}
  .so-ket{width:150px;padding:8px 10px;background:var(--paper);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:13px;}
  .so-ket:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--focus);}
  .so-input{width:110px;padding:8px 10px;background:var(--paper);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:14px;}
  .so-input:focus,.so-new-row input:focus,.so-new-row select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--focus);}
  .so-new{margin-top:16px;}
  .so-new-row{display:grid;grid-template-columns:1.6fr 100px 110px 120px 110px 220px 36px;gap:10px;margin-bottom:10px;align-items:start;}
  /* Tab Penerimaan / Pengeluaran */
  .tab-row{display:flex;gap:8px;margin-bottom:18px;border-bottom:1px solid var(--line);}
  .tab-btn{padding:10px 22px;font-size:14px;font-weight:600;background:transparent;border:none;border-bottom:3px solid transparent;color:var(--muted);border-radius:8px 8px 0 0;transition:color .15s ease,border-color .15s ease,background .15s ease;}
  .tab-btn:hover{color:var(--ink);background:var(--row-hover);}
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--accent);background:var(--panel);}
  .tab-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  /* Sugest / dropdown nama barang */
  .ac-box{position:relative;}
  .ac-box input{width:100%;}
  .ac-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:220px;overflow-y:auto;z-index:60;}
  .ac-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;font-size:13px;cursor:pointer;}
  .ac-item:hover,.ac-item:active{background:var(--row-hover);}
  .ac-item+.ac-item{border-top:1px solid var(--line);}
  .so-new-row input,.so-new-row select{padding:9px 10px;background:var(--paper);border:1px solid var(--line);border-radius:8px;color:var(--ink);}
  .so-hint{color:var(--muted);font-size:12.5px;}
  .so-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;margin-right:6px;}
  .stk-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);}
  .stk-div{width:84px;font-weight:700;font-size:13px;}
  .stk-info{flex:1;min-width:0;font-size:13px;}
  .stk-foot{padding-top:10px;border-top:1px solid var(--line);}
  @media (max-width:700px){.so-new-row{grid-template-columns:1fr 1fr;}}
  .only-baik{display:none;}
  form:has(select[name="jenis"] option[value="Perbaikan"]:checked) .only-beli{display:none !important;}
  form:has(select[name="jenis"] option[value="Perbaikan"]:checked) .only-baik{display:inline !important;}
  .jenis-chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;margin-left:6px;border-radius:999px;background:#8E5CD922;color:#8E5CD9;vertical-align:middle;}
  /* ===== Judul & sub-tab atas tetap terlihat saat halaman di-scroll ===== */
  .page-header{position:sticky;top:0;z-index:30;}
  .page-header:not(.list-band){margin:-32px -32px 18px;padding:24px 32px 12px;background:var(--paper);}
  .tab-row{position:sticky;top:var(--hdr-h,0px);z-index:25;background:var(--paper);margin:0 -32px 18px;padding:0 32px;}
  .filters{top:var(--hdr-h,0px);}
</style>

<script>
// ---------- Constants ----------
const STATUS_LIST = ["Pengajuan","Disetujui","Diterima","Dikerjakan","Selesai","Batal"];   // gabungan (filter & hitungan)
const STATUS_BELI = ["Pengajuan","Disetujui","Diterima","Selesai","Batal"];
const STATUS_BAIK = ["Pengajuan","Dikerjakan","Selesai","Batal"];
const statusListFor = (jenis)=> jenis === "Perbaikan" ? STATUS_BAIK : STATUS_BELI;
const JENIS_LIST = ["Pembelian","Perbaikan"];
const STATUS_COLORS = {
  "Pengajuan":"#7A8699","Disetujui":"#2F6FE4","Diterima":"#E09A1A","Dikerjakan":"#8E5CD9","Selesai":"#1FA36B","Batal":"#D7263D"
};
const DIVISI_LIST = ["GA"];
const SATUAN_LIST = ["Pcs","Unit","Box","Botol","Kg","Liter","Meter","Set","Dus"];
const DEPT_LIST = ["Produksi"];
const MONTHS = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const STORAGE_KEY = "pengadaan_barang_records_v1";
const THEME_KEY = "pengadaan_theme_v1";

// ================= ONLINE SYNC =================
// Paste your Google Apps Script Web App URL here after deployment.
// Example: https://script.google.com/macros/s/XXXXXXXX/exec
const API_URL = "https://script.google.com/macros/s/AKfycby8pg4rfD_9EjbmTv6-s2a1szocnB7VhQrB7VWJOqQ-M35Q3ZA-ph3lKU2beEx34miKwA/exec";
const SYNC_INTERVAL_MS = 30000;
let syncTimer = null;
let isSyncing = false;

function onlineMode(){
  return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL);
}

const sleep = ms => new Promise(r=>setTimeout(r, ms));
async function apiRequest(payload, attempt=0, timeoutMs=20000){
  if(!onlineMode()) throw new Error("API_URL belum diisi.");
  // Batas waktu 20 detik + coba ulang otomatis (jaringan baru bangun dari sleep, dsb.)
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), timeoutMs);
  try{
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(payload),
      signal: ctrl.signal
    });
    if(!response.ok) throw new Error("Server API gagal: HTTP " + response.status);
    const data = await response.json();
    if(!data.ok){ const err = new Error(data.error || "API mengembalikan error."); err.noRetry = true; throw err; }
    return data;
  }catch(e){
    if(!e.noRetry && attempt < 2){
      await sleep(1500 * (attempt + 1));
      return apiRequest(payload, attempt + 1, timeoutMs);
    }
    if(e.name === "AbortError") throw new Error("Koneksi timeout, coba lagi.");
    throw e;
  }finally{
    clearTimeout(timer);
  }
}

function showSyncStatus(message, isError=false){
  const el = document.getElementById("syncStatus");
  if(!el) return;
  el.textContent = message;
  el.style.color = isError ? "#FFE08A" : "inherit";   // latar sidebar gradien: pakai putih / kuning agar terbaca
}

async function loadRecordsOnline(silent=false){
  if(!onlineMode()){
    loadRecords();
    return;
  }
  if(isSyncing) return;
  if(silent && pendingWrites > 0) return;
  isSyncing = true;
  if(!silent) showSyncStatus("Sabar Lagi Mikir Bree...");
  try{
    const data = await apiRequest({action:"list"});
    if(silent && pendingWrites > 0) return;   // ada simpanan yang belum selesai: jangan timpa
    const before = JSON.stringify(records) + JSON.stringify(soRows);
    const abaikanChanged = await syncAbaikan();
    records = Array.isArray(data.records) ? data.records.map(normRecord) : [];
    if(Array.isArray(data.so)) soRows = data.so.map(normSo);
    const changed = abaikanChanged || before !== JSON.stringify(records) + JSON.stringify(soRows);
    showSyncStatus("✓ Tersinkron • " + new Date().toLocaleTimeString("id-ID"));
    // Jangan render ulang kalau data tidak berubah (sinkron otomatis) atau user sedang mengisi form.
    if(view !== "form" && view !== "terima" && view !== "opname"){ if(changed || !silent || !document.getElementById("mainContent").children.length) render(); }
    else document.getElementById("recordCountLabel").textContent = records.length;
  }catch(e){
    console.error(e);
    // Sinkron otomatis yang gagal tidak dianggap error: data di layar tetap aman, nanti dicoba lagi.
    if(silent) showSyncStatus("Sinkron tertunda, mencoba lagi...");
    else{
      showSyncStatus("Gagal sinkron: " + e.message, true);
      if(!document.getElementById("mainContent").children.length) render();   // jangan biarkan halaman blank
    }
  }finally{
    isSyncing = false;
  }
}
async function saveRecordOnline(record){
  if(!onlineMode()){
    const idx = records.findIndex(r=>r.id===record.id);
    if(idx>=0) records[idx]=record; else records.push(record);
    persist();
    return;
  }
  const rec = normRecord(record);
  pendingWrites++;
  showSyncStatus("sabar anjing...");
  try{
    await apiRequest({action:"save", record: rec});
    // Cukup perbarui data lokal; tidak perlu mengunduh ulang seluruh daftar (hemat satu permintaan ke server).
    const idx = records.findIndex(r=>r.id===rec.id);
    if(idx>=0) records[idx]=rec; else records.push(rec);
    showSyncStatus("✓ Wis Tek Simpen SUU • " + new Date().toLocaleTimeString("id-ID"));
  }finally{
    pendingWrites--;
  }
}

async function deleteRecordOnline(id){
  const idx = records.findIndex(r=>r.id===id);
  if(idx < 0) return;
  const removed = records[idx];
  // Hilang dari layar seketika; penghapusan di server berjalan di latar belakang.
  records.splice(idx, 1);
  saveStart(false, "SEDANG MENGHAPUS...");
  if(!onlineMode()){
    persist();
    saveDone("TERHAPUS BREE");
    return;
  }
  pendingWrites++;
  showSyncStatus("Menghapus...");
  try{
    await apiRequest({action:"delete", id});
    showSyncStatus("✓ Terhapus • " + new Date().toLocaleTimeString("id-ID"));
    saveDone("TERHAPUS BREE");
  }catch(e){
    saveFail("GAGAL MENGHAPUS");
    records.splice(idx, 0, removed);   // gagal: kembalikan datanya
    if(view !== "form") render();
    showSyncStatus("Gagal menghapus", true);
    throw e;
  }finally{
    pendingWrites--;
  }
}

let pendingWrites = 0;
async function updateStatusOnline(id, status){
  const rec = records.find(r=>r.id===id);
  if(!rec) return;
  const prev = rec.status;
  // Tampilan langsung berubah (optimistik), simpan ke server berjalan di latar belakang.
  rec.status = status;
  saveStart(false);
  if(!onlineMode()){
    persist();
    saveDone();
    return;
  }
  pendingWrites++;
  showSyncStatus("Menyimpan...");
  try{
    await apiRequest({action:"save", record: normRecord({...rec, status})});
    showSyncStatus("✓ Tersimpan • " + new Date().toLocaleTimeString("id-ID"));
    saveDone();
  }catch(e){
    saveFail();
    rec.status = prev;           // gagal: kembalikan status lama
    if(view !== "form") render();
    showSyncStatus("Gagal menyimpan status", true);
    throw e;
  }finally{
    pendingWrites--;
  }
}

function startAutoSync(){
  if(!onlineMode()) return;
  if(syncTimer) clearInterval(syncTimer);
  syncTimer = setInterval(()=>loadRecordsOnline(true), SYNC_INTERVAL_MS);

  // Sinkron langsung begitu tab/aplikasi difokuskan lagi (mis. balik dari app lain di HP)
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState === "visible") loadRecordsOnline(true);
  });
  window.addEventListener("focus", ()=> loadRecordsOnline(true));
  window.addEventListener("online", ()=> loadRecordsOnline(true));
}

// ---------- Helpers ----------
// Google Sheets mengubah "2026-09-25" jadi tanggal sungguhan, lalu dikirim balik sebagai
// "2026-09-24T17:00:00.000Z" (UTC). Kembalikan ke tanggal lokal polos YYYY-MM-DD.
const DATE_FIELDS = ["tglPengajuan","tglPO","tglDiterima"];
function normDate(v){
  if(typeof v !== "string") return v;
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  if(/^\d{4}-\d{2}-\d{2}T/.test(v)){
    const d = new Date(v);
    if(isNaN(d.getTime())) return v;
    const m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
    return d.getFullYear()+"-"+m+"-"+day;
  }
  return v;
}
function normRecord(r){
  const o = {...r};
  o.divisi = "GA";
  DATE_FIELDS.forEach(k=>{ if(o[k]) o[k] = normDate(o[k]); });
  o.noPengadaan = String(o.noPengadaan == null ? "" : o.noPengadaan).trim();   // nomor angka dari Sheets -> teks
  applyJenis(o);
  return o;
}
// Jenis permintaan: Pembelian (default, data lama) atau Perbaikan (tanpa qty/penerimaan, tidak masuk analisa stok)
function applyJenis(o){
  o.jenis = o.jenis === "Perbaikan" ? "Perbaikan" : "Pembelian";
  if(o.jenis === "Perbaikan"){
    o.qty = 1; o.satuan = "Unit"; o.qtyDiterima = ""; o.penerimaan = "";
    if(!STATUS_BAIK.includes(o.status)) o.status = o.status === "Disetujui" ? "Dikerjakan" : "Pengajuan";
  }else{
    if(o.status === "Dikerjakan") o.status = "Disetujui";
    normQtyTerima(o);
  }
}

function idFor(){ return Date.now()+"-"+Math.random().toString(36).slice(2,8); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nextNoPengadaan(){
  let max=0;
  records.forEach(r=>{
    const m=/PGD-(\d+)/.exec(r.noPengadaan||"");
    if(m) max=Math.max(max, parseInt(m[1],10));
  });
  return "PGD-"+String(max+1).padStart(3,"0");
}
function formatRupiah(n){ return "Rp " + (Number(n)||0).toLocaleString("id-ID"); }
function formatRupiahShort(n){
  n = Number(n)||0;
  const neg = n<0; n = Math.abs(n);
  let out;
  if(n>=1000000000) out = (n/1000000000).toFixed(1).replace(/\.0$/,"")+" M";
  else if(n>=1000000) out = (n/1000000).toFixed(1).replace(/\.0$/,"")+" jt";
  else if(n>=1000) out = (n/1000).toFixed(0)+" rb";
  else out = String(n);
  return "Rp " + (neg?"-":"") + out;
}
function formatTgl(iso){
  if(!iso) return "-";
  const d=new Date(iso);
  if(isNaN(d.getTime())) return iso;
  return d.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"});
}
function monthIndexFromISO(iso){
  if(!iso) return null;
  const d=new Date(iso);
  if(isNaN(d.getTime())) return null;
  return d.getMonth();
}
function emptyForm(){
  return {
    id:"", noPengadaan:"", tglPengajuan: todayISO(), divisi:"GA", departemen:"Produksi",
    jenis:"Pembelian", namaPemohon:"", keperluan:"", namaBarang:"", spesifikasi:"", qty:"", satuan:"Pcs", estimasiHarga:"",
    supplier:"", tglPO:"", tglDiterima:"", status:"Pengajuan", keterangan:"", qtyDiterima:""
  };
}
function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ---------- Pengadaan vs penerimaan ----------
// qtyDiterima kosong = belum dicatat. Selisih = diterima - dipesan (negatif = kurang).
function terimaInfo(r){
  if(r.qtyDiterima === "" || r.qtyDiterima == null) return {kind:"belum", diff:0};
  const diff = (Number(r.qtyDiterima)||0) - (Number(r.qty)||0);
  return {kind: diff < 0 ? "kurang" : diff > 0 ? "lebih" : "sesuai", diff};
}
const TERIMA_FILTERS = ["Semua","Kurang","Sesuai","Lebih","Belum dicatat"];
// Daftar penerimaan (bertahap): [{id, tgl, qty, w}]. Data lama yang hanya punya Qty Diterima dibaca sebagai 1 penerimaan ("p0").
function terimaLog(r){
  let a = r.penerimaan;
  if(typeof a === "string"){ try{ a = JSON.parse(a); }catch(e){ a = []; } }
  if(Array.isArray(a) && a.length) return a.map(p=>({id:String(p.id||""), tgl:String(p.tgl||"").slice(0,10), qty:Math.max(0, Number(p.qty)||0), w:p.w||""}));
  if(r.qtyDiterima !== "" && r.qtyDiterima != null) return [{id:"p0", tgl:String(r.tglDiterima||"").slice(0,10), qty:Math.max(0, Number(r.qtyDiterima)||0), w:""}];
  return [];
}
const terimaTotal = r => Math.round(terimaLog(r).reduce((t,p)=> t + p.qty, 0) * 100) / 100;
// Qty Diterima = jumlah semua penerimaan, Tanggal Diterima = penerimaan terakhir (dipakai Laporan, Analisa, Export)
function normQtyTerima(o){
  const log = terimaLog(o);
  o.penerimaan = log;
  if(log.length){
    o.qtyDiterima = terimaTotal(o);
    o.tglDiterima = log.map(p=>p.tgl).filter(Boolean).sort().pop() || "";
  }else{
    o.qtyDiterima = "";
  }
}
function terimaBadge(r){
  if(r.status === "Batal") return "";
  const t = terimaInfo(r);
  if(t.kind === "kurang") return `<div class="tm-badge kurang">Kurang ${-t.diff}</div>`;
  if(t.kind === "lebih")  return `<div class="tm-badge lebih">Lebih ${t.diff}</div>`;
  if(t.kind === "sesuai") return `<div class="tm-badge sesuai">Sesuai</div>`;
  return "";
}
function countKurang(){
  return records.filter(r=> r.status !== "Batal" && r.jenis !== "Perbaikan" && terimaInfo(r).kind === "kurang").length;
}

// ---------- Derived ----------
function computeStats(){
  const total = records.length;
  const ga = records.filter(r=>r.divisi==="GA").length;
  const totalNilai = records.filter(r=>r.status!=="Batal").reduce((s,r)=> s + (Number(r.qty)||0)*(Number(r.estimasiHarga)||0), 0);
  const statusCounts = {};
  STATUS_LIST.forEach(s=>statusCounts[s]=0);
  records.forEach(r=>{ if(statusCounts[r.status]!==undefined) statusCounts[r.status]++; });
  return {total,ga,totalNilai,statusCounts};
}
function computeTotalEstimasiForBulan(bulan){
  // Pengadaan berstatus "Batal" tidak dihitung ke total estimasi
  const aktif = records.filter(r=> r.status !== "Batal");
  const nilai = r => (Number(r.qty)||0)*(Number(r.estimasiHarga)||0);
  if(bulan==="Semua"){
    return aktif.reduce((s,r)=> s + nilai(r), 0);
  }
  const idx = MONTHS.indexOf(bulan);
  return aktif.reduce((s,r)=>{
    if(monthIndexFromISO(r.tglPengajuan)===idx) return s + nilai(r);
    return s;
  },0);
}
function computeFiltered(){
  // "records" disimpan menurut urutan input (sama seperti baris di Sheet); tampilkan yang terbaru di paling atas.
  return records.filter(r=>{
    if(filterDivisi!=="Semua" && r.divisi!==filterDivisi) return false;
    if(filterStatus!=="Semua" && r.status!==filterStatus) return false;
    if(filterJenis!=="Semua" && (r.jenis||"Pembelian")!==filterJenis) return false;
    if(filterTerima!=="Semua"){
      if(r.status === "Batal" || r.jenis === "Perbaikan") return false;      // pengadaan batal tidak dihitung dalam pengecekan penerimaan
      const k = terimaInfo(r).kind;
      const want = {"Kurang":"kurang","Sesuai":"sesuai","Lebih":"lebih","Belum dicatat":"belum"}[filterTerima];
      if(k !== want) return false;
    }
    if(filterBulan!=="Semua"){
      const idx = monthIndexFromISO(r.tglPengajuan);
      if(idx===null || MONTHS[idx]!==filterBulan) return false;
    }
    if(search.trim()){
      const q=search.toLowerCase();
      const hay = `${r.noPengadaan} ${r.namaBarang} ${r.supplier} ${r.departemen}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  }).reverse();
}

// ---------- Repeat order: harga otomatis dari pengadaan sebelumnya (barang yang sama) ----------
const normNama = x=> String(x||"").trim().toLowerCase().replace(/\s+/g," ");
function lastHarga(nama, satuan, excludeId){
  const n = normNama(nama); if(!n) return null;
  const c = records.map((r,i)=>({r,i})).filter(({r})=> r.id !== excludeId && r.jenis !== "Perbaikan" && r.status !== "Batal"
      && (Number(r.estimasiHarga)||0) > 0 && normNama(r.namaBarang) === n)
    .sort((a,b)=> String(b.r.tglPengajuan||"").localeCompare(String(a.r.tglPengajuan||"")) || b.i - a.i).map(x=>x.r);
  return c.find(r=> r.satuan === satuan) || c[0] || null;     // utamakan satuan yang sama, ambil yang terbaru
}
function bindHargaAuto(namaEl, satuanEl, hargaEl, hintEl, excludeId){
  const setHint = t=>{ if(hintEl) hintEl.textContent = t; };
  const apply = ()=>{
    if(hargaEl.value !== "" && hargaEl.dataset.auto !== "1") return;      // harga yang diketik manual tidak ditimpa
    const r = lastHarga(namaEl.value, satuanEl.value, excludeId);
    if(r){ hargaEl.value = r.estimasiHarga; hargaEl.dataset.auto = "1"; setHint(`Harga otomatis dari ${r.noPengadaan} (${formatTgl(r.tglPengajuan)}). Bisa diubah.`); }
    else if(hargaEl.dataset.auto === "1"){ hargaEl.value = ""; hargaEl.dataset.auto = ""; setHint(""); }
    hargaEl.dispatchEvent(new Event("input", {bubbles:true}));
  };
  hargaEl.addEventListener("input", e=>{ if(e.isTrusted){ hargaEl.dataset.auto = ""; setHint(""); } });
  namaEl.addEventListener("change", apply); namaEl.addEventListener("blur", apply); satuanEl.addEventListener("change", apply);
}

function printPermintaan(no){
  const same = r=> String(r.noPengadaan == null ? "" : r.noPengadaan).trim() === String(no == null ? "" : no).trim();
  let items = records.filter(r=> same(r) && r.status !== "Batal");
  if(!items.length) items = records.filter(same);          // semua item Batal: tetap bisa dicetak
  if(!items.length){ alert("Tidak ada item untuk dicetak."); return; }
  const h = items[0];
  const nama = (items.find(r=>r.namaPemohon)||{}).namaPemohon || "";
  const kep = (items.find(r=>r.keperluan)||{}).keperluan || "";
  const E = escapeHtml;
  let rows = items.map((r,i)=>{
    const baik = r.jenis === "Perbaikan";
    const ket = [r.spesifikasi, r.keterangan].filter(x=>x && String(x).trim()).join(" — ");
    return `<tr><td class="c">${i+1}</td><td>${E(r.namaBarang)}</td><td class="c">${baik?"":E(r.qty)}</td><td class="c">${baik?"":E(r.satuan)}</td><td>${E(ket)}</td></tr>`;
  }).join("");
  for(let i=items.length;i<24;i++) rows += '<tr class="blank"><td></td><td></td><td></td><td></td><td></td></tr>';
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>Form Permintaan Barang ${E(no)}</title><style>

  const el = document.getElementById("loadMore");
  if(!el || typeof IntersectionObserver === "undefined") return;
  loadObserver = new IntersectionObserver((entries)=>{
    if(entries.some(e=>e.isIntersecting)) loadMoreRows();
  }, {rootMargin:"0px 0px 60px 0px"});
  loadObserver.observe(el);
}
function loadMoreRows(){
  if(loadingMore || view !== "list") return;

}

// Petunjuk langsung di form: sesuai / kurang / lebih dibanding Qty pengadaan.
function bindTerimaHint(formEl){
  if(!formEl) return;
  const q = formEl.elements["qty"], t = formEl.elements["qtyDiterima"];
  const hint = document.getElementById("terimaHint"), fill = document.getElementById("fillTerima");
  if(!q || !t || !hint) return;
  const upd = ()=>{
    hint.className = "";
    if(t.value === ""){ hint.textContent = ""; return; }
    const diff = (Number(t.value)||0) - (Number(q.value)||0);
    if(diff < 0){ hint.textContent = "Kurang " + (-diff); hint.className = "kurang"; }
    else if(diff > 0){ hint.textContent = "Lebih " + diff; hint.className = "lebih"; }
    else { hint.textContent = "Sesuai"; hint.className = "sesuai"; }
  };
  q.addEventListener("input", upd); t.addEventListener("input", upd);
  if(fill) fill.onclick = ()=>{ t.value = q.value; upd(); t.focus({preventScroll:true}); };
  upd();
}

// ---------- Analisa kebutuhan, stock opname (SO) & pengingat ----------
// Sumber kebutuhan per bulan (dipilih otomatis):
//  1) SO       : rata-rata Pemakaian (Stok Awal + Barang Masuk - Hasil SO) per bulan yang tercatat di tab SO dalam periode analisa

// Stok sekarang (estimasi) = Hasil SO (stok fisik) terakhir + penerimaan sesudahnya - perkiraan pemakaian.
const DAY_MS = 86400000, MONTH_DAYS = 30.4375;
function parseYMD(v){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v||""));
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}
function toYMD(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
const monthsInclusive = (a,b)=> (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()) + 1;
const fmtNum = n => (Number(n)||0).toLocaleString("id-ID",{maximumFractionDigits:1});
const itemKey = (divisi,nama,satuan)=> [divisi, String(nama||"").trim().toLowerCase(), String(satuan||"").trim().toLowerCase()].join("|");

const MONTH_NAMES = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const fmtBulan = m => { const p = String(m||"").split("-"); return p.length === 2 ? (MONTH_NAMES[Number(p[1])-1] || p[1]) + " " + p[0] : String(m||""); };
const bulanKey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
const monthStart = m => { const [y,mo] = m.split("-").map(Number); return new Date(y, mo-1, 1); };
const monthEnd   = m => { const [y,mo] = m.split("-").map(Number); return new Date(y, mo, 0); };
const dayDiff = (a,b)=> Math.round((b-a)/DAY_MS);

function parseHist(h){
  if(Array.isArray(h)) return h;
  try{ const x = JSON.parse(h || "[]"); return Array.isArray(x) ? x : []; }catch(e){ return []; }
}
function normSo(o){
  return {id:String(o.id), bulan:String(o.bulan||"").slice(0,7), divisi:"GA", namaBarang:String(o.namaBarang||""), satuan:o.satuan||"",
          stokAwal:Number(o.stokAwal)||0, barangMasuk:Number(o.barangMasuk)||0, hasilSO:Number(o.hasilSO)||0,
          keterangan:o.keterangan||"", alasanNotBalance:o.alasanNotBalance||"", history:parseHist(o.history), updatedAt:o.updatedAt||""};
}
// Hasil SO = stok FISIK hasil hitung. Pemakaian bulan itu = Stok Awal + Barang Masuk - Hasil SO,
// dan Hasil SO menjadi Stok Awal bulan berikutnya.
const soPakai = r => (Number(r.stokAwal)||0) + (Number(r.barangMasuk)||0) - (Number(r.hasilSO)||0);
// ---------- Fitur Abaikan (Analisa Kebutuhan) ----------
const ABAIKAN_KEY = "pengadaan_abaikan_v2";
const ABAIKAN_OLD_KEY = "pengadaan_abaikan_v1";
let abaikanSet = new Set();
let abaikanMonth = "";
const currentMonthKey = ()=>{ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); };
// Abaikan hanya berlaku di bulan saat item diabaikan. Ganti bulan -> daftar di-reset, notif pengajuan muncul lagi.
function loadAbaikan(){
  const now = currentMonthKey();
  abaikanSet = new Set(); abaikanMonth = now;
  try{
    const raw = localStorage.getItem(ABAIKAN_KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(o && o.month === now && Array.isArray(o.keys)) abaikanSet = new Set(o.keys);
    }else{
      // migrasi dari versi lama (tanpa bulan): dianggap diabaikan di bulan ini
      const old = JSON.parse(localStorage.getItem(ABAIKAN_OLD_KEY) || "[]");
      if(Array.isArray(old) && old.length) abaikanSet = new Set(old);
      localStorage.removeItem(ABAIKAN_OLD_KEY);
    }
  }catch(e){ abaikanSet = new Set(); }
  persistAbaikan();
}
// dipanggil tiap analisa: kalau bulan sudah berganti (aplikasi dibiarkan terbuka), daftar otomatis di-reset
function checkAbaikanMonth(){
  if(abaikanMonth !== currentMonthKey()) loadAbaikan();
}
// ---- Sinkron antar perangkat via Apps Script (aksi: abaikanList / abaikanAdd / abaikanRemove) ----
// Lokal dulu (cepat), lalu dikirim ke server. Kalau server belum diperbarui / offline, tetap jalan lokal.
let pendingAbaikan = 0;
const ABAIKAN_PUSHED_KEY = "pengadaan_abaikan_pushed_v1";
async function abaikanPush(op, key){
  if(!onlineMode()) return;
  pendingAbaikan++;
  try{ await apiRequest({action:"abaikan" + op, month:abaikanMonth || currentMonthKey(), key}); }
  catch(e){ console.warn("Sinkron abaikan gagal (aksi Apps Script belum dipasang / offline):", e.message); }
  finally{ pendingAbaikan--; }
}
// Ambil daftar dari server -> jadi acuan. Return true kalau daftar berubah.
async function syncAbaikan(){
  if(!onlineMode() || pendingAbaikan > 0) return false;
  checkAbaikanMonth();
  try{
    const data = await apiRequest({action:"abaikanList", month:abaikanMonth});
    if(pendingAbaikan > 0 || !Array.isArray(data.keys)) return false;
    const server = new Set(data.keys);
    // sekali saja: kirim abaikan lama yang hanya ada di perangkat ini
    let pushedFlag = "1";
    try{ pushedFlag = localStorage.getItem(ABAIKAN_PUSHED_KEY); }catch(e){}
    if(!pushedFlag){
      const onlyLocal = [...abaikanSet].filter(k=> !server.has(k));
      for(const k of onlyLocal){ await abaikanPush("Add", k); server.add(k); }
      try{ localStorage.setItem(ABAIKAN_PUSHED_KEY, "1"); }catch(e){}
    }
    const before = [...abaikanSet].sort().join("\n");
    abaikanSet = server;
    persistAbaikan();
    return before !== [...abaikanSet].sort().join("\n");
  }catch(e){
    console.warn("Gagal ambil daftar abaikan:", e.message);
    return false;
  }
}
function persistAbaikan(){
  try{ localStorage.setItem(ABAIKAN_KEY, JSON.stringify({month:abaikanMonth || currentMonthKey(), keys:[...abaikanSet]})); }
  catch(e){}
}

// ---------- Pengeluaran harian item (tab Pengeluaran di menu Tambah Penerimaan) ----------
// Disimpan lokal di browser (data harian ringan, tidak perlu ke Sheet).
const OUT_KEY = "pengadaan_keluar_v1";
let outRows = [];   // {id, tanggal, divisi, namaBarang, satuan, qty, keterangan}
function persistOut(){ try{ localStorage.setItem(OUT_KEY, JSON.stringify(outRows)); }catch(e){} }
function loadOut(){

    id:String(o.id||idFor()), tanggal:String(o.tanggal||"").slice(0,10), divisi:"GA",
    namaBarang:String(o.namaBarang||""), satuan:o.satuan||"", qty:Number(o.qty)||0, keterangan:o.keterangan||""
  })); }catch(e){ outRows = []; }
}
// Total pengeluaran 1 item pada 1 bulan (YYYY-MM); nama dibandingkan tanpa peduli besar-kecil huruf
function keluarBulanDari(divisi, nama, dariBulan){
  // total pengeluaran tercatat dari bulan SO terakhir sampai sekarang
  const n = String(nama||"").trim().toLowerCase();
  const d = String(divisi||"").trim().toLowerCase();
  return outRows.reduce((t,o)=>{
    const od = String(o.divisi||"").trim().toLowerCase();
    const cocokDivisi = od === d || od === "" || d === "";
    const bln = String(o.tanggal).slice(0,7);
    return cocokDivisi && String(o.namaBarang).trim().toLowerCase() === n && bln >= dariBulan
      ? t + (Number(o.qty)||0) : t;
  }, 0);
}
// Pengeluaran tercatat SETELAH tanggal tertentu (tanggal > dari): {qty, n}
function keluarSetelah(divisi, nama, dari){
  const nm = String(nama||"").trim().toLowerCase();
  const d = String(divisi||"").trim().toLowerCase();
  let qty = 0, n = 0;
  const nowD = new Date(), hariIni = new Date(nowD.getFullYear(), nowD.getMonth(), nowD.getDate());
  outRows.forEach(o=>{
    const od = String(o.divisi||"").trim().toLowerCase();
    if(!(od === d || od === "" || d === "")) return;
    if(String(o.namaBarang).trim().toLowerCase() !== nm) return;
    const t = parseYMD(o.tanggal);
    if(t && t > dari && t <= hariIni){ qty += Number(o.qty)||0; n++; }   // tanggal lewat hari ini diabaikan
  });
  return {qty, n};
}
function keluarBulan(divisi, nama, bulan){
  const n = String(nama||"").trim().toLowerCase();
  const d = String(divisi||"").trim().toLowerCase();
  return outRows.reduce((t,o)=>{
    const od = String(o.divisi||"").trim().toLowerCase();
    // divisi dicocokkan tanpa peduli besar-kecil huruf; kalau salah satu kosong tetap dicocokkan (berdasarkan nama)
    const cocokDivisi = od === d || od === "" || d === "";
    return cocokDivisi && String(o.namaBarang).trim().toLowerCase() === n && String(o.tanggal).slice(0,7) === bulan
      ? t + (Number(o.qty)||0) : t;
  }, 0);
}

// barang diterima pada (from, to]  /  di dalam satu bulan
const recvIn = (list, from, to)=> list.reduce((t,x)=> (x.date > from && x.date <= to) ? t + x.qty : t, 0);
const recvInMonth = (list, m)=> list.reduce((t,x)=> (x.date >= monthStart(m) && x.date <= monthEnd(m)) ? t + x.qty : t, 0);

function analyzeItems(){
  checkAbaikanMonth();
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const winStart = analysisPeriod > 0 ? new Date(now.getFullYear(), now.getMonth() - (analysisPeriod - 1), 1) : null;
  const winMonth = winStart ? bulanKey(winStart) : null;
  const groups = new Map();
  const getG = (divisi, nama, satuan)=>{
    const key = itemKey(divisi, nama, satuan);
    let g = groups.get(key);
    if(!g){ g = {key, divisi, nama:String(nama).trim(), satuan:satuan||"", rows:[], so:[]}; groups.set(key, g); }
    return g;
  };
  records.forEach(r=>{
    if(r.status === "Batal" || r.jenis === "Perbaikan") return;   // perbaikan tidak masuk analisa kebutuhan
    const d = parseYMD(r.tglPengajuan), nama = String(r.namaBarang||"").trim();
    if(!d || !nama) return;
    const kind = terimaInfo(r).kind;
    getG(r.divisi, nama, r.satuan).rows.push({
      d, qty:Number(r.qty)||0, status:r.status,
      recv: kind==="belum" ? null : (Number(r.qtyDiterima)||0), recvDate: parseYMD(r.tglDiterima),
      recvs: terimaLog(r).map(p=>({date:parseYMD(p.tgl), qty:p.qty})).filter(p=>p.date),
      harga:Number(r.estimasiHarga)||0, spec:r.spesifikasi||"", supplier:r.supplier||""
    });
  });
  soRows.forEach(o=>{
    if(!/^\d{4}-\d{2}$/.test(o.bulan) || !String(o.namaBarang||"").trim()) return;
    getG(o.divisi, o.namaBarang, o.satuan).so.push({m:o.bulan, id:o.id, awal:o.stokAwal, masuk:o.barangMasuk, fisik:o.hasilSO, pakai:soPakai(o), ket:o.keterangan, alasan:o.alasanNotBalance||""});
  });

  const out = [];
  groups.forEach(g=>{
    g.rows.sort((a,b)=> a.d - b.d);
    g.so.sort((a,b)=> a.m.localeCompare(b.m));
    const recvList = g.rows.flatMap(x=> x.recvs || []);   // tiap penerimaan (termasuk parsial) dihitung sesuai tanggalnya
    // --- kebutuhan dari pengajuan ---
    const inWin = winStart ? g.rows.filter(x=>x.d >= winStart) : g.rows;
    const count = inWin.length;
    const total = inWin.reduce((t,x)=> t + x.qty, 0);
    let reqAvg = 0;
    if(g.rows.length){
      const span = Math.max(1, monthsInclusive(g.rows[0].d, now));
      const months = analysisPeriod > 0 ? Math.max(1, Math.min(analysisPeriod, span)) : span;
      reqAvg = total / months;
    }
    const last = g.rows.length ? g.rows[g.rows.length-1] : null;
    const lastQty = last ? (last.recv != null ? last.recv : last.qty) : 0;
    // --- kebutuhan dari SO: rata-rata Pemakaian (Stok Awal + Barang Masuk - Hasil SO) per bulan yang tercatat dalam periode ---
    const soWin = winMonth ? g.so.filter(x=>x.m >= winMonth) : g.so;
    const anomaly = g.so.some(x=>x.pakai < 0);
    const soMonthly = soWin.length ? soWin.reduce((t,x)=> t + Math.max(0, x.pakai), 0) / soWin.length : null;
    let need = null, source = null;
    if(soMonthly != null){ need = soMonthly; source = "so"; }
    else if(count >= 2 && reqAvg > 0){ need = reqAvg; source = "pengajuan"; }
    // --- stok sekarang (satu rumus untuk semua menu) ---
    // Stok = Hasil SO terakhir + barang diterima sesudah SO - pemakaian sesudah SO.
    // Pemakaian = pengeluaran yang TERCATAT; kalau belum ada yang tercatat, dipakai PERKIRAAN dari rata-rata.
    const lastSO = g.so.length ? g.so[g.so.length-1] : null;
    let stock = null, asOf = null, stokDetail = null;
    if(lastSO){
      asOf = new Date(Math.min(monthEnd(lastSO.m).getTime(), today.getTime()));
      const daysSince = Math.max(0, dayDiff(asOf, today));
      const masukSesudah = recvIn(recvList, asOf, today);
      const kel = keluarSetelah(g.divisi, g.nama, asOf);
      const estimasi = kel.n === 0;
      let pakai;
      if(estimasi){
        // Perkiraan dihitung berurutan per penerimaan: stok tidak bisa terpakai sebelum barangnya datang,
        // jadi selama stok 0 tidak ada pemakaian yang dikurangkan.
        const rate = need ? need / MONTH_DAYS : 0;
        let level = lastSO.fisik, t = asOf;
        recvList.filter(x=> x.date > asOf && x.date <= today).sort((a,b)=> a.date - b.date).forEach(x=>{
          level = Math.max(0, level - rate * Math.max(0, dayDiff(t, x.date)));
          level += x.qty; t = x.date;
        });
        level = Math.max(0, level - rate * Math.max(0, dayDiff(t, today)));
        stock = Math.round(level);
        pakai = Math.max(0, Math.round((lastSO.fisik + masukSesudah - stock) * 100) / 100);
      }else{
        pakai = kel.qty;
        stock = Math.max(0, Math.round((lastSO.fisik + masukSesudah - pakai) * 100) / 100);
      }
      stokDetail = {dasar:lastSO.fisik, masuk:masukSesudah, keluar:pakai, estimasi};
    }
    // pengajuan yang masih diproses (belum diterima/selesai), dari mana pun dibuatnya (menu Permintaan maupun tombol Ajukan di Analisa)
    // (penerimaan parsial: pengajuan tetap berjalan untuk SISA yang belum diterima)
    const pending = g.rows.filter(x=> (x.recv == null || x.recv < x.qty) && (x.status==="Pengajuan" || x.status==="Disetujui" || x.status==="Diterima")
                                       && (today - x.d)/DAY_MS <= 60);
    const onOrder = pending.reduce((t,x)=> t + (x.recv == null ? x.qty : x.qty - x.recv), 0);
    // --- status ---
    let basis = null, runout = null, daysLeft = null, status = "data";
    if(stock != null && need != null){
      basis = "stok";
      const projected = stock + onOrder;
      if(need > 0){
        daysLeft = Math.floor(projected / (need / MONTH_DAYS));
        runout = new Date(today.getTime() + Math.max(0, daysLeft) * DAY_MS);
        status = projected <= 0 ? "terlambat" : daysLeft <= remindLead ? "segera" : "aman";
      }else status = "aman";
    }else if(stock == null && count >= 2 && reqAvg > 0 && last){
      basis = "pengajuan";
      runout = new Date(last.d.getTime() + (lastQty / reqAvg) * MONTH_DAYS * DAY_MS);
      daysLeft = Math.round((runout - today) / DAY_MS);
      status = daysLeft < 0 ? "terlambat" : daysLeft <= remindLead ? "segera" : "aman";
    }
    // sudah ada pengajuan yang berjalan -> pengingat hilang (di Analisa, Dashboard, dan badge menu)
    if(pending.length && (status === "terlambat" || status === "segera")) status = "diajukan";
    const avg = need != null ? need : reqAvg;
    const projectedNow = (stock || 0) + onOrder;
    const suggest = need ? Math.max(1, Math.ceil(need / 2), Math.ceil(need - projectedNow)) : Math.max(1, Math.ceil(reqAvg || 1));
    out.push({key:g.key, divisi:g.divisi, nama:g.nama, satuan:g.satuan, count, total, avg, reqAvg, source, anomaly,
              last, lastQty, lastSO, soEntries:g.so, stock, stokDetail, onOrder, runout, daysLeft, status, basis, suggest, recvList,
              spec: last ? last.spec : "", harga: last ? last.harga : 0, supplier: last ? last.supplier : ""});
  });
  return out;
}

            return ""; })()}</td>

      </tbody></table>`;
    const more = list.length > shown ? `<div class="load-more" data-aload="${escapeHtml(div)}">Gulir ke bawah untuk memuat item berikutnya</div>` : "";
    return `<h2 class="sub-title">${escapeHtml(div)} <span class="count-chip">${all.length} item</span></h2><div class="table-wrap">${body}</div>${more}`;
  };
  analisaSectionFn = section;

  return `

let analisaShow = {};        // divisi -> jumlah item yang sudah ditampilkan (awal 10, +10 tiap scroll)
let analisaSectionFn = null;
let analisaObserver = null, analisaLoading = false;
function setupAnalisaMore(){
  if(analisaObserver){ analisaObserver.disconnect(); analisaObserver = null; }
  const els = document.querySelectorAll("[data-aload]");
  if(!els.length || typeof IntersectionObserver === "undefined") return;
  analisaObserver = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting) loadMoreAnalisa(e.target.dataset.aload); });
  }, {rootMargin:"0px 0px 60px 0px"});
  els.forEach(el=> analisaObserver.observe(el));
}
function loadMoreAnalisa(div){
  if(analisaLoading || view !== "analisa" || !analisaSectionFn) return;
  analisaLoading = true;
  const el = document.querySelector(`[data-aload="${CSS.escape(div)}"]`);
  if(el) el.innerHTML = '<span class="spinner"></span>Memuat data...';
  setTimeout(()=>{
    analisaLoading = false;
    if(view !== "analisa" || !analisaSectionFn) return;
    analisaShow[div] = (analisaShow[div] || PAGE_SIZE) + PAGE_SIZE;
    const wrap = document.querySelector(`[data-asec="${CSS.escape(div)}"]`);
    if(!wrap) return;
    wrap.innerHTML = analisaSectionFn(div);      // hanya bagian divisi itu yang diperbarui
    bindAjukan();
    setupAnalisaMore();
  }, 500);
}

function bindAnalisa(){
  const per = document.getElementById("analisaPeriod"), lead = document.getElementById("analisaLead");
  if(per) per.onchange = (e)=>{ analysisPeriod = Number(e.target.value); analisaShow = {}; render(); };
  if(lead) lead.onchange = (e)=>{ remindLead = Number(e.target.value); analisaShow = {}; render(); };
  const sb = document.getElementById("analisaSearch");
  if(sb) sb.oninput = (e)=>{
    analisaSearch = e.target.value;
    analisaShow = {};
    const pos = e.target.selectionStart;
    render();
    const el = document.getElementById("analisaSearch");
    if(el){ el.focus({preventScroll:true}); el.selectionStart = el.selectionEnd = pos; }
  };
  const ex = document.getElementById("btnExportAnalisa");
  if(ex) ex.onclick = exportAnalisa;
  bindAjukan();
  setupAnalisaMore();
}

function exportAnalisa(){
  if(typeof XLSX === "undefined"){ alert("Library Excel belum siap, coba lagi sebentar."); return; }
  const items = analyzeItems();
  const wb = XLSX.utils.book_new();
  let any = false;
  DIVISI_LIST.forEach(div=>{
    const rows = items.filter(i=>i.divisi === div).sort((a,b)=> b.avg - a.avg).map(i=>({
      "Nama Barang": i.nama, "Satuan": i.satuan, "Jumlah Pengajuan": i.count, "Total Diminta": i.total,
      "Kebutuhan per Bulan": Math.round(i.avg*100)/100, "Sumber Kebutuhan": i.source || "",
      "Stok Sekarang": i.stock == null ? "" : i.stock,
      "SO Terakhir": i.lastSO ? fmtBulan(i.lastSO.m) : "",
      "Pengajuan Terakhir": i.last ? formatTgl(toYMD(i.last.d)) : "", "Qty Terakhir": i.last ? i.lastQty : "",
      "Perkiraan Habis": i.runout ? formatTgl(toYMD(i.runout)) : "",
      "Status": abaikanSet.has(i.key) ? "Diabaikan" : i.status==="terlambat" ? (i.basis==="stok" ? "Stok habis" : "Terlambat "+(-i.daysLeft)+" hari") : i.status==="segera" ? i.daysLeft+" hari lagi (segera ajukan)" : i.status==="diajukan" ? "Sudah diajukan" : i.status==="aman" ? "Aman" : "Data kurang"
    }));
    if(rows.length){
      any = true;
      const ws = XLSX.utils.json_to_sheet(rows);
      ws["!cols"] = [{wch:28},{wch:10},{wch:16},{wch:14},{wch:18},{wch:16},{wch:22},{wch:16},{wch:18},{wch:12},{wch:16},{wch:24}];
      XLSX.utils.book_append_sheet(wb, ws, div);
    }
  });
  if(!any){ alert("Belum ada data untuk dianalisa."); return; }
  XLSX.writeFile(wb, `analisa-kebutuhan-${todayISO()}.xlsx`);
}

// ---------- Menu Stock Opname (tab SO: 1 baris = 1 barang x 1 bulan) ----------
// Hasil SO = stok fisik hasil hitung. Pemakaian = Stok Awal + Barang Masuk - Hasil SO.
// Stok Awal otomatis = Hasil SO bulan sebelumnya; Barang Masuk otomatis dari penerimaan bulan itu (bisa diubah).
let soDivisi = "GA", soBulan = "", soDraft = {}, soNewRows = [];

function soDefaults(item, bulan){
  const saved = item.soEntries.find(x=>x.m === bulan) || null;
  const prev = item.soEntries.filter(x=>x.m < bulan).pop() || null;
  const autoMasuk = recvInMonth(item.recvList, bulan);
  return {
    saved, prev, autoMasuk,
    awal:  saved ? String(saved.awal)  : (prev ? String(prev.fisik) : ""),
    masuk: saved ? String(saved.masuk) : String(autoMasuk || 0),
    hasil: saved ? String(saved.fisik) : "",
    ket:   saved ? (saved.ket || "") : "",
    alasan: saved ? (saved.alasan || "") : ""
  };
}
function soEff(item, bulan){
  const d = soDefaults(item, bulan), dr = soDraft[item.key] || {};
  return {...d, awal: dr.awal ?? d.awal, masuk: dr.masuk ?? d.masuk, hasil: dr.hasil ?? d.hasil, ket: dr.ket ?? d.ket, alasan: dr.alasan ?? d.alasan};
}
// Cek balance: Sisa Item = Stok Awal - total Pengeluaran harian bulan itu. Dibandingkan dengan Hasil SO (fisik).
function soBalance(e, divisi, nama, bulan){
  if(e.hasil === "" || e.awal === "") return null;
  const keluar = keluarBulan(divisi, nama, bulan);
  // Sisa Item = Stok Awal + Barang Masuk − Hasil SO (selisih pemakaian aktual)
  const sisa = (Number(e.awal)||0) + (Number(e.masuk)||0) - (Number(e.hasil)||0);
  return {keluar, sisa, fisik: Number(e.hasil)||0, ok: sisa === keluar};
}
function soBalanceText(b, k, alasan){
  if(!b) return '<span class="muted-dash">–</span>';
  return b.ok
    ? '<span class="rm-badge aman" title="Sisa Item (Awal + Masuk − Hasil SO) sama dengan Pengeluaran yang tercatat">BALANCE / OK / MANTAP</span>'
    : `<div><span class="rm-badge terlambat" title="Sisa Item (${fmtNum(b.sisa)}) ≠ Pengeluaran (${fmtNum(b.keluar)})">STOK NOT BALANCE</span></div>
       <input type="text" class="so-ket" data-so="${escapeHtml(k)}" data-f="alasan" value="${escapeHtml(alasan||"")}" style="margin-top:6px;width:190px;" placeholder="Isi alasan stok not balance...">`;
}
function soPakaiText(e){
  if(e.hasil === "" || e.awal === "") return '<span class="muted-dash">–</span>';
  const p = (Number(e.awal)||0) + (Number(e.masuk)||0) - (Number(e.hasil)||0);
  return p < 0
    ? `<span class="rm-badge terlambat" title="Hasil SO (fisik) lebih besar dari Stok Awal + Barang Masuk. Ada barang masuk yang belum tercatat, atau hitungan salah.">${fmtNum(p)} · cek</span>`
    : `<b>${fmtNum(p)}</b>`;
}

function buildSoRecord(divisi, nama, satuan, bulan, e, existingId){
  const old = existingId ? soRows.find(r=>r.id === existingId) : null;
  const entry = {w:new Date().toISOString(), a:Number(e.awal)||0, m:Number(e.masuk)||0, h:Number(e.hasil)||0, k:e.ket||"", n:e.alasan||""};
  const history = ((old && old.history) || []).concat([entry]).slice(-20);
  return {id: existingId || idFor(), bulan, divisi, namaBarang:nama, satuan, stokAwal:entry.a, barangMasuk:entry.m,
          hasilSO:entry.h, keterangan:e.ket||"", alasanNotBalance:e.alasan||"", history};
}

// ---------- Ganti satuan 1 item (gabungkan item dobel Box/Pcs dst.) ----------
// Satuan diganti serentak di pengajuan, SO, dan pengeluaran, sehingga semua rumus
// (Analisa, Stok Saat Ini, SO, Laporan) tetap membaca data yang sama.
function satuanImpact(it, baru){
  const keyLama = itemKey(it.divisi, it.nama, it.satuan), keyBaru = itemKey(it.divisi, it.nama, baru);
  const same = (d,n,s2)=> itemKey(d,n,s2) === keyLama;
  const recs = records.filter(r=> same(r.divisi, r.namaBarang, r.satuan));
  const sos  = soRows.filter(o=> same(o.divisi, o.namaBarang, o.satuan));
  const outs = outRows.filter(o=> same(o.divisi, o.namaBarang, o.satuan));
  const konflik = sos.filter(o=> soRows.some(x=> x.bulan === o.bulan && itemKey(x.divisi, x.namaBarang, x.satuan) === keyBaru)).map(o=>o.bulan);
  return {keyLama, keyBaru, recs, sos, outs, konflik};
}
function openGantiSatuan(it){
  let ov = document.getElementById("satModal");
  if(!ov){
    ov = document.createElement("div");
    ov.className = "modal-overlay"; ov.id = "satModal"; ov.hidden = true;
    ov.innerHTML = `<div class="modal modal-confirm" role="dialog" aria-modal="true">
      <h3 id="satTitle">GANTI SATUAN</h3>
      <p id="satDesc"></p>
      <label class="field" style="text-align:left;margin:10px 0"><span>Satuan baru</span><select id="satSel"></select></label>
      <p id="satInfo" style="font-size:13px"></p>
      <div class="modal-actions">
        <button type="button" class="modal-no" id="satNo">Batal</button>
        <button type="button" class="modal-yes" id="satYes">Ganti</button>
      </div></div>`;
    document.body.appendChild(ov);
  }
  const sel = document.getElementById("satSel"), info = document.getElementById("satInfo"), yes = document.getElementById("satYes");
  document.getElementById("satDesc").textContent = it.nama + " — satuan sekarang: " + it.satuan;
  sel.innerHTML = SATUAN_LIST.filter(x=> x.toLowerCase() !== String(it.satuan).toLowerCase()).map(x=>`<option>${escapeHtml(x)}</option>`).join("");
  const refresh = ()=>{
    const im = satuanImpact(it, sel.value);
    let t = `Ikut berubah: ${im.recs.length} pengajuan, ${im.sos.length} data SO, ${im.outs.length} pengeluaran.`;
    if(im.konflik.length){
      t += ` TIDAK BISA: SO bulan ${im.konflik.map(fmtBulan).join(", ")} sudah ada juga di satuan ${sel.value}. Hapus salah satunya dulu (🗑 di Riwayat SO).`;
      info.style.color = "var(--danger, #e5484d)";
    }else info.style.color = "";
    info.textContent = t;
    yes.disabled = im.konflik.length > 0;
  };
  sel.onchange = refresh; refresh();
  const close = ()=>{ ov.hidden = true; };
  document.getElementById("satNo").onclick = close;
  yes.onclick = ()=>{
    const baru = sel.value;
    close();
    gantiSatuanItem(it, baru).catch(err=>alert(err.message));
  };
  ov.hidden = false;
}
async function gantiSatuanItem(it, baru){
  const im = satuanImpact(it, baru);
  if(im.keyLama === im.keyBaru || im.konflik.length) return;
  const nowIso = new Date().toISOString();
  const recIds = new Set(im.recs.map(r=>r.id)), soIds = new Set(im.sos.map(o=>o.id)), outIds = new Set(im.outs.map(o=>o.id));
  const beforeRec = new Map(im.recs.map(r=>[r.id, {...r}])), beforeSo = new Map(im.sos.map(o=>[o.id, {...o}]));
  const list = [];   // {kind, obj}
  records.forEach((r,i)=>{ if(recIds.has(r.id)){ records[i] = normRecord({...r, satuan:baru}); list.push({kind:"rec", obj:records[i]}); } });
  soRows.forEach((o,i)=>{ if(soIds.has(o.id)){
    const h = (o.history||[]).concat([{w:nowIso, a:o.stokAwal, m:o.barangMasuk, h:o.hasilSO, k:"Satuan diganti: "+it.satuan+" → "+baru, n:o.alasanNotBalance||""}]).slice(-20);
    soRows[i] = normSo({...o, satuan:baru, history:h}); list.push({kind:"so", obj:soRows[i]});
  }});
  outRows.forEach(o=>{ if(outIds.has(o.id)) o.satuan = baru; });
  persistOut();
  if(view !== "form") render();
  saveStart(false);
  if(!onlineMode()){ persist(); persistSo(); saveDone(); return; }
  pendingWrites++;
  const failed = [];
  let next = 0;
  const worker = async ()=>{
    while(next < list.length){
      const x = list[next++];
      try{
        if(x.kind === "rec") await apiRequest({action:"save", record:x.obj});
        else await apiRequest({action:"saveSO", record:{...x.obj, history: JSON.stringify(x.obj.history)}});
      }catch(e){ failed.push({x, e}); }
    }
  };
  try{ await Promise.all([worker(), worker(), worker()]); }
  finally{ pendingWrites--; }
  if(failed.length){
    failed.forEach(({x})=>{                      // kembalikan hanya yang gagal agar tetap sama dengan server
      if(x.kind === "rec"){ const i = records.findIndex(r=>r.id===x.obj.id); if(i>=0) records[i] = beforeRec.get(x.obj.id); }
      else { const i = soRows.findIndex(r=>r.id===x.obj.id); if(i>=0) soRows[i] = beforeSo.get(x.obj.id); }
    });
    if(view !== "form") render();
    saveFail(failed.length + " DATA GAGAL");
    throw new Error("Gagal mengganti satuan pada " + failed.length + " dari " + list.length + " data: " + failed[0].e.message + "\nCoba ganti satuan sekali lagi.");
  }
  showSyncStatus("✓ Satuan diganti • " + new Date().toLocaleTimeString("id-ID"));
  saveDone();
}

      cBal.innerHTML = soBalanceText(b, escapeHtml(k), e.alasan);
      // pasang ulang listener pada input alasan yang baru dibuat via innerHTML,

      const alIn = cBal.querySelector('[data-f="alasan"]');

  });
