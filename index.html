<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manufacture - Pengadaan Barang</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#20262E;
    --paper:#EDEFE9;
    --paper-deep:#E2E5DD;
    --panel:#FFFFFF;
    --line:#D8DCD2;
    --rail:#20262E;
    --rail-soft:#2C333D;
    --accent:#D98A2B;
    --accent-deep:#B76F1B;
    --muted:#6B7280;
  }
  html[data-theme="dark"]{
    --ink:#E7E9EC;
    --paper:#14181D;
    --paper-deep:#1B2027;
    --panel:#1E242B;
    --line:#2C333C;
    --rail:#0E1116;
    --rail-soft:#191F26;
    --accent:#E3A24C;
    --accent-deep:#F0B76B;
    --muted:#98A1AC;
  }
  html[data-theme="dark"] .stat-card .icon{background:var(--rail-soft);}
  *{box-sizing:border-box;}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--paper);color:var(--ink);}
  h1,h2{font-family:Georgia,serif;font-weight:normal;margin:0;}
  button{cursor:pointer;font-family:inherit;}
  input,select{font-family:inherit;font-size:14px;}

  .app{display:flex;min-height:100vh;}

  .sidebar{width:76px;flex-shrink:0;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:24px 0;}
  .brand{padding:0 4px;margin-bottom:28px;text-align:center;}
  .brand-mark{width:44px;height:44px;margin:0 auto 10px;}
  .brand-mark svg{width:100%;height:100%;display:block;}
  .brand .name{color:var(--accent);font-size:10px;font-weight:700;letter-spacing:.06em;}

  .nav{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;}
  .nav button{position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;background:#FFFFFF;border:2px solid #FFFFFF;border-radius:10px;transition:transform .12s ease,box-shadow .15s ease;}
  .nav button img{width:30px;height:30px;display:block;pointer-events:none;}
  .nav button:hover,.nav button:focus-visible{transform:translateY(-1px);box-shadow:0 3px 12px rgba(255,255,255,.22);}
  .nav button.active{box-shadow:0 0 0 2px var(--rail),0 0 0 4px var(--accent);}
  .nav button::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:#F4E9D8;color:#20140A;font-size:12px;line-height:1;padding:7px 10px;border-radius:4px;white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s ease;z-index:100;}
  .nav button:hover::after,.nav button:focus-visible::after{opacity:1;visibility:visible;}
  .add-btn{position:relative;margin:8px 0 0;width:44px;height:44px;padding:0;background:#F4F4F2;border:none;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 2px 10px rgba(255,255,255,.12);transition:transform .12s ease,box-shadow .15s ease;}
  .add-btn svg{width:22px;height:22px;display:block;pointer-events:none;}
  .add-btn:hover,.add-btn:focus-visible{transform:translateY(-1px);box-shadow:0 0 0 1px rgba(255,255,255,.15),0 4px 14px rgba(255,255,255,.2);}
  .add-btn:active{transform:translateY(0) scale(.97);}
  .add-btn::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:#F4E9D8;color:#20140A;font-size:12px;line-height:1;padding:7px 10px;border-radius:4px;white-space:nowrap;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s ease;z-index:100;}
  .add-btn:hover::after,.add-btn:focus-visible::after{opacity:1;visibility:visible;}
  .sidebar-footer{margin-top:auto;padding:24px 6px 0;color:#5E6773;font-size:10px;line-height:1.35;text-align:center;word-break:break-word;}
  .header-actions{display:flex;align-items:center;gap:14px;}
  .theme-toggle{padding:0;background:transparent;border:none;display:block;flex-shrink:0;}
  .switch{position:relative;display:block;width:52px;height:30px;border:2px solid var(--muted);border-radius:30px;background:transparent;transition:background .2s ease,border-color .2s ease;}
  .switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;transition:left .2s ease,background .2s ease;}
  .switch .knob svg{width:12px;height:12px;display:block;}
  .switch .knob svg path{fill:var(--paper);}
  html[data-theme="dark"] .switch{border-color:var(--accent);background:var(--accent);}
  html[data-theme="dark"] .switch .knob{left:25px;background:#14181D;}
  html[data-theme="dark"] .switch .knob svg path{fill:#F4E9D8;}
  .theme-toggle:focus-visible .switch{outline:2px solid var(--accent);outline-offset:3px;}

  .main{flex:1;padding:32px;overflow-y:auto;}

  .page-header{display:flex;align-items:center;justify-content:between;justify-content:space-between;margin-bottom:24px;}
  .page-header h1{font-size:24px;}
  .page-header p{color:var(--muted);font-size:14px;margin-top:4px;}
  .btn-dark{background:var(--ink);color:#fff;border:none;padding:10px 16px;font-size:14px;display:flex;align-items:center;gap:8px;}
  .btn-accent{background:var(--accent);color:#20140A;border:none;padding:10px 20px;font-size:14px;}
  .btn-plain{background:transparent;border:none;color:var(--muted);padding:10px 20px;font-size:14px;}
  .btn-outline{background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:10px 16px;font-size:14px;display:flex;align-items:center;gap:8px;}

  .stat-row{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:24px;}
  .stat-card{flex:1;min-width:190px;background:var(--panel);border:1px solid var(--line);padding:20px;}
  .stat-card .icon{width:32px;height:32px;background:var(--paper-deep);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:15px;}
  .stat-card .label{color:var(--muted);font-size:13px;}
  .stat-card .value{font-family:Georgia,serif;font-size:24px;margin-top:12px;}

  .grid-2{display:grid;grid-template-columns:2fr 3fr;gap:16px;}
  @media (max-width:900px){.grid-2{grid-template-columns:1fr;}}
  .panel{background:var(--panel);border:1px solid var(--line);padding:20px;}
  .panel h2{color:var(--ink);font-family:system-ui,sans-serif;font-size:13px;margin-bottom:16px;color:var(--muted);}

  .status-row{display:flex;align-items:center;gap:12px;font-size:13px;margin-bottom:10px;}
  .status-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;font-size:12px;border:1px solid;white-space:nowrap;}
  .status-dot{width:6px;height:6px;border-radius:50%;}
  .bar-track{flex:1;height:8px;background:var(--paper-deep);}
  .bar-fill{height:100%;}
  .count-label{width:26px;text-align:right;color:var(--muted);}

  .filters{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px;}
  .search-box{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--paper);border:1px solid var(--line);min-width:220px;}
  .search-box input{border:none;background:transparent;padding:10px 0;width:100%;outline:none;color:var(--ink);}
  select.filter-select{padding:9px 10px;background:var(--paper);border:1px solid var(--line);color:var(--ink);}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  thead tr{border-bottom:1px solid var(--line);}
  th{text-align:left;padding:12px 16px;font-weight:normal;color:var(--muted);}
  td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top;}
  .table-wrap{background:var(--panel);border:1px solid var(--line);overflow-x:auto;}
  .empty-state{padding:48px 20px;text-align:center;color:var(--muted);font-size:14px;}
  .sub-text{color:var(--muted);font-size:12px;margin-top:2px;}
  .mono{font-family:ui-monospace,Consolas,monospace;}
  .row-actions{display:flex;align-items:center;gap:14px;}
  .row-actions button{background:none;border:none;color:var(--muted);font-size:13px;padding:0;}
  .status-select{border:none;background:transparent;font-size:12px;}
  .confirm-del{display:flex;align-items:center;gap:8px;font-size:12px;white-space:nowrap;}
  .confirm-del button{border:none;background:none;padding:0;}

  form{display:flex;flex-direction:column;gap:20px;max-width:760px;}
  .form-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .form-header button{background:none;border:none;font-size:20px;color:var(--muted);}
  fieldset{border:none;padding:0;margin:0;}
  .section{background:var(--panel);border:1px solid var(--line);padding:20px;}
  .section h3{color:var(--muted);font-size:12px;margin:0 0 16px;font-weight:normal;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .field{display:flex;flex-direction:column;gap:6px;font-size:13px;}
  .field span{color:var(--muted);}
  .field span .req{color:var(--accent-deep);}
  .field input,.field select{padding:9px 10px;background:var(--paper);border:1px solid var(--line);color:var(--ink);}
  .field input[readonly]{opacity:.7;}
  .form-actions{display:flex;align-items:center;gap:12px;}

  .loading{color:var(--muted);font-size:14px;}
</style>
</head>

// ================= ONLINE SYNC =================
// Paste your Google Apps Script Web App URL here after deployment.
// Example: https://script.google.com/macros/s/XXXXXXXX/exec
const API_URL = "https://script.google.com/macros/s/AKfycby8pg4rfD_9EjbmTv6-s2a1szocnB7VhQrB7VWJOqQ-M35Q3ZA-ph3lKU2beEx34miKwA/exec";
const SYNC_INTERVAL_MS = 30000;
let syncTimer = null;
let isSyncing = false;

function onlineMode(){
  return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL);
}

const sleep = ms => new Promise(r=>setTimeout(r, ms));
async function apiRequest(payload, attempt=0){
  if(!onlineMode()) throw new Error("API_URL belum diisi.");
  // Batas waktu 20 detik + coba ulang otomatis (jaringan baru bangun dari sleep, dsb.)
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 20000);
  try{
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(payload),
      signal: ctrl.signal
    });
    if(!response.ok) throw new Error("Server API gagal: HTTP " + response.status);
    const data = await response.json();
    if(!data.ok){ const err = new Error(data.error || "API mengembalikan error."); err.noRetry = true; throw err; }
    return data;
  }catch(e){
    if(!e.noRetry && attempt < 2){
      await sleep(1500 * (attempt + 1));
      return apiRequest(payload, attempt + 1);
    }
    if(e.name === "AbortError") throw new Error("Koneksi timeout, coba lagi.");
    throw e;
  }finally{
    clearTimeout(timer);
  }
}

function showSyncStatus(message, isError=false){
  const el = document.getElementById("syncStatus");
  if(!el) return;
  el.textContent = message;
  el.style.color = isError ? "#C1443C" : "var(--muted)";
}

    loadRecords();
    return;
  }
  if(isSyncing) return;
  if(silent && pendingWrites > 0) return;
  isSyncing = true;
  if(!silent) showSyncStatus("Sabar Lagi Mikir Bree...");
  try{
    const data = await apiRequest({action:"list"});
    if(silent && pendingWrites > 0) return;   // ada simpanan yang belum selesai: jangan timpa
    const before = JSON.stringify(records);
    records = Array.isArray(data.records) ? data.records.map(normRecord) : [];
    records.sort((a,b)=> new Date(b.tglPengajuan) - new Date(a.tglPengajuan));
    const changed = before !== JSON.stringify(records);
    showSyncStatus("✓ Tersinkron • " + new Date().toLocaleTimeString("id-ID"));
    // Jangan render ulang kalau data tidak berubah (sinkron otomatis) atau user sedang mengisi form.
    if(view !== "form"){ if(changed || !silent || !document.getElementById("mainContent").children.length) render(); }
    else document.getElementById("recordCountLabel").textContent = records.length;
  }catch(e){
    console.error(e);
    // Sinkron otomatis yang gagal tidak dianggap error: data di layar tetap aman, nanti dicoba lagi.
    if(silent) showSyncStatus("Sinkron tertunda, mencoba lagi...");
    else showSyncStatus("Gagal sinkron: " + e.message, true);
  }finally{
    isSyncing = false;
  }
}
async function saveRecordOnline(record){
  if(!onlineMode()){
    const idx = records.findIndex(r=>r.id===record.id);
    if(idx>=0) records[idx]=record; else records.unshift(record);
    records.sort((a,b)=> new Date(b.tglPengajuan) - new Date(a.tglPengajuan));
    persist();
    return;
  }
  showSyncStatus("sabar anjing...");
  await apiRequest({action:"save", record: normRecord(record)});
  await loadRecordsOnline(true);
  showSyncStatus("✓ Wis Tek Simpen SUU • " + new Date().toLocaleTimeString("id-ID"));
}

async function deleteRecordOnline(id){
  if(!onlineMode()){
    records = records.filter(r=>r.id!==id);
    persist();
    return;
  }
  showSyncStatus("Menghapus...");
  await apiRequest({action:"delete", id});
  await loadRecordsOnline(true);
  showSyncStatus("✓ Makane Mikir • " + new Date().toLocaleTimeString("id-ID"));
}

let pendingWrites = 0;
async function updateStatusOnline(id, status){
  const rec = records.find(r=>r.id===id);
  if(!rec) return;
  const prev = rec.status;
  // Tampilan langsung berubah (optimistik), simpan ke server berjalan di latar belakang.
  rec.status = status;
  if(!onlineMode()){
    persist();
    return;
  }
  pendingWrites++;
  showSyncStatus("Menyimpan...");
  try{
    await apiRequest({action:"save", record: normRecord({...rec, status})});
    showSyncStatus("✓ Tersimpan • " + new Date().toLocaleTimeString("id-ID"));
  }catch(e){
    rec.status = prev;           // gagal: kembalikan status lama
    if(view !== "form") render();
    showSyncStatus("Gagal menyimpan status", true);
    throw e;
  }finally{
    pendingWrites--;
  }
}

function startAutoSync(){
  if(!onlineMode()) return;
  if(syncTimer) clearInterval(syncTimer);
  syncTimer = setInterval(()=>loadRecordsOnline(true), SYNC_INTERVAL_MS);

  // Sinkron langsung begitu tab/aplikasi difokuskan lagi (mis. balik dari app lain di HP)
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState === "visible") loadRecordsOnline(true);
  });
  window.addEventListener("focus", ()=> loadRecordsOnline(true));
  window.addEventListener("online", ()=> loadRecordsOnline(true));
}

// ---------- Helpers ----------
// Google Sheets mengubah "2026-09-25" jadi tanggal sungguhan, lalu dikirim balik sebagai
// "2026-09-24T17:00:00.000Z" (UTC). Kembalikan ke tanggal lokal polos YYYY-MM-DD.
const DATE_FIELDS = ["tglPengajuan","tglPO","tglDiterima"];
function normDate(v){
  if(typeof v !== "string") return v;
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  if(/^\d{4}-\d{2}-\d{2}T/.test(v)){
    const d = new Date(v);
    if(isNaN(d.getTime())) return v;
    const m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
    return d.getFullYear()+"-"+m+"-"+day;
  }
  return v;
}
function normRecord(r){
  const o = {...r};
  DATE_FIELDS.forEach(k=>{ if(o[k]) o[k] = normDate(o[k]); });
  return o;
}

function idFor(){ return Date.now()+"-"+Math.random().toString(36).slice(2,8); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nextNoPengadaan(){
  let max=0;
  records.forEach(r=>{
    const m=/PGD-(\d+)/.exec(r.noPengadaan||"");
    if(m) max=Math.max(max, parseInt(m[1],10));
  });
  return "PGD-"+String(max+1).padStart(3,"0");
}
function formatRupiah(n){ return "Rp " + (Number(n)||0).toLocaleString("id-ID"); }
function formatRupiahShort(n){
  n = Number(n)||0;
  const neg = n<0; n = Math.abs(n);
  let out;
  if(n>=1000000000) out = (n/1000000000).toFixed(1).replace(/\.0$/,"")+" M";
  else if(n>=1000000) out = (n/1000000).toFixed(1).replace(/\.0$/,"")+" jt";
  else if(n>=1000) out = (n/1000).toFixed(0)+" rb";
  else out = String(n);
  return "Rp " + (neg?"-":"") + out;
}
function formatTgl(iso){
  if(!iso) return "-";
  const d=new Date(iso);
  if(isNaN(d.getTime())) return iso;
  return d.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"});
}
function monthIndexFromISO(iso){
  if(!iso) return null;
  const d=new Date(iso);
  if(isNaN(d.getTime())) return null;
  return d.getMonth();
}
function emptyForm(){
  return {
    id:"", noPengadaan:"", tglPengajuan: todayISO(), divisi:"GA", departemen:"Produksi",
    keperluan:"", namaBarang:"", spesifikasi:"", qty:"", satuan:"Pcs", estimasiHarga:"",
    supplier:"", tglPO:"", tglDiterima:"", status:"Pengajuan", keterangan:""
  };
}
function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ---------- Derived ----------
function computeStats(){
  const total = records.length;
  const ga = records.filter(r=>r.divisi==="GA").length;
  const purchasing = records.filter(r=>r.divisi==="Purchasing").length;
  const totalNilai = records.filter(r=>r.status!=="Batal").reduce((s,r)=> s + (Number(r.qty)||0)*(Number(r.estimasiHarga)||0), 0);
  const statusCounts = {};
  STATUS_LIST.forEach(s=>statusCounts[s]=0);
  records.forEach(r=>{ if(statusCounts[r.status]!==undefined) statusCounts[r.status]++; });
  return {total,ga,purchasing,totalNilai,statusCounts};
}
function computeMonthly(){
  const counts = MONTHS.map(m=>({bulan:m.slice(0,3), total:0, nilai:0}));
  records.forEach(r=>{
    const idx = monthIndexFromISO(r.tglPengajuan);
    if(idx!==null){
      counts[idx].total++;
      counts[idx].nilai += (Number(r.qty)||0)*(Number(r.estimasiHarga)||0);
    }
  });
  return counts;
}
function computeTotalEstimasiForBulan(bulan){
  // Pengadaan berstatus "Batal" tidak dihitung ke total estimasi
  const aktif = records.filter(r=> r.status !== "Batal");
  const nilai = r => (Number(r.qty)||0)*(Number(r.estimasiHarga)||0);
  if(bulan==="Semua"){
    return aktif.reduce((s,r)=> s + nilai(r), 0);
  }
  const idx = MONTHS.indexOf(bulan);
  return aktif.reduce((s,r)=>{
    if(monthIndexFromISO(r.tglPengajuan)===idx) return s + nilai(r);
    return s;
  },0);
}
function computeFiltered(){
  return records.filter(r=>{
    if(filterDivisi!=="Semua" && r.divisi!==filterDivisi) return false;
    if(filterStatus!=="Semua" && r.status!==filterStatus) return false;
    if(filterBulan!=="Semua"){
      const idx = monthIndexFromISO(r.tglPengajuan);
      if(idx===null || MONTHS[idx]!==filterBulan) return false;
    }
    if(search.trim()){
      const q=search.toLowerCase();
      const hay = `${r.noPengadaan} ${r.namaBarang} ${r.supplier} ${r.departemen}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function drawChart(){
  const canvas = document.getElementById("monthlyChart");
  if(!canvas || typeof Chart === "undefined") return;
  const data = computeMonthly();
  if(chartInstance){ chartInstance.destroy(); }
  chartInstance = new Chart(canvas, {
    data: {
      labels: data.map(d=>d.bulan),
      datasets: [
        {
          type: "bar",
          label: "Jumlah Pengajuan",
          data: data.map(d=>d.total),
          backgroundColor: "#D98A2B",
          borderRadius: 2,
          maxBarThickness: 28,
          yAxisID: "y",
          order: 2
        },
        {
          type: "line",
          label: "Nilai Pengajuan (Rp)",
          data: data.map(d=>d.nilai),
          borderColor: "#3B6FA0",
          backgroundColor: "#3B6FA0",
          pointBackgroundColor: "#3B6FA0",
          pointRadius: 3,
          tension: 0.3,
          yAxisID: "y1",
          order: 1
        }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{ display:true, labels:{ color:"#6B7280", font:{size:11}, boxWidth:12 } },
        tooltip:{
          backgroundColor:"#fff", titleColor:"#20262E", bodyColor:"#20262E", borderColor:"#D8DCD2", borderWidth:1,
          callbacks:{
            label: function(ctx){
              if(ctx.dataset.yAxisID === "y1"){
                return "Nilai: " + formatRupiah(ctx.parsed.y);
              }
              return "Jumlah: " + ctx.parsed.y + " pengajuan";
            }
          }
        }
      },
      scales:{
        x:{ grid:{display:false}, ticks:{ color:"#6B7280", font:{size:11} } },
        y:{
          beginAtZero:true, position:"left",
          ticks:{ precision:0, color:"#6B7280", font:{size:11} },
          grid:{ color:"#D8DCD2" },
          title:{ display:true, text:"Jumlah", color:"#6B7280", font:{size:10} }
        },
        y1:{
          beginAtZero:true, position:"right",
          ticks:{ color:"#B76F1B", font:{size:10}, callback: v => formatRupiahShort(v) },
          grid:{ display:false },
          title:{ display:true, text:"Nilai (Rp)", color:"#B76F1B", font:{size:10} }
        }
      }
    }
  });
}

function exportToExcel(){
  if(typeof XLSX === "undefined"){
    alert("Library Excel belum siap, coba lagi sebentar.");
    return;
  }
  const data = computeFiltered();
  if(data.length === 0){
    alert("Tidak ada data untuk diekspor.");
    return;
  }
  const rows = data.map(r=>({
    "No. Pengadaan": r.noPengadaan,
    "Tanggal Pengajuan": formatTgl(r.tglPengajuan),
    "Divisi": r.divisi,
    "Departemen": r.departemen,
    "Keperluan": r.keperluan,
    "Nama Barang": r.namaBarang,
    "Spesifikasi": r.spesifikasi,
    "Qty": Number(r.qty)||0,
    "Satuan": r.satuan,
    "Estimasi Harga Satuan": Number(r.estimasiHarga)||0,
    "Estimasi Total": (Number(r.qty)||0)*(Number(r.estimasiHarga)||0),
    "Supplier": r.supplier,
    "Status": r.status,
    "Tanggal PO": formatTgl(r.tglPO),
    "Tanggal Diterima": formatTgl(r.tglDiterima),
    "Keterangan": r.keterangan
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws["!cols"] = [
    {wch:14},{wch:14},{wch:12},{wch:14},{wch:20},{wch:22},{wch:22},
    {wch:6},{wch:8},{wch:18},{wch:16},{wch:18},{wch:16},{wch:14},{wch:14},{wch:24}
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Pengadaan");
  const tanggal = todayISO();
  XLSX.writeFile(wb, `pengadaan-barang-${tanggal}.xlsx`);
}

// ---------- Event handlers ----------
function attachHandlers(){
  document.querySelectorAll(".theme-toggle").forEach(b=> b.onclick = toggleTheme);
  const btnAddDash = document.getElementById("btnAddDash");
  if(btnAddDash) btnAddDash.onclick = openNewForm;
  const btnAddList = document.getElementById("btnAddList");
  if(btnAddList) btnAddList.onclick = openNewForm;

  if(view==="dashboard"){
    const statBulanSelect = document.getElementById("statBulanSelect");
    if(statBulanSelect) statBulanSelect.onchange = (e)=>{ statBulan = e.target.value; render(); };
  }

  if(view==="list"){
    const searchInput = document.getElementById("searchInput");
    if(searchInput){
      searchInput.oninput = (e)=>{ search = e.target.value; renderListOnly(); };
      // keep focus after re-render
      searchInput.focus();
      searchInput.selectionStart = searchInput.selectionEnd = searchInput.value.length;
    }
    const fd = document.getElementById("filterDivisi");
    if(fd) fd.onchange = (e)=>{ filterDivisi = e.target.value; render(); };
    const fs = document.getElementById("filterStatus");
    if(fs) fs.onchange = (e)=>{ filterStatus = e.target.value; render(); };
    const fb = document.getElementById("filterBulan");
    if(fb) fb.onchange = (e)=>{ filterBulan = e.target.value; render(); };
    const btnExport = document.getElementById("btnExportExcel");
    if(btnExport) btnExport.onclick = exportToExcel;

    document.querySelectorAll("[data-edit]").forEach(b=> b.onclick = ()=> openEditForm(b.dataset.edit));
    document.querySelectorAll("[data-del]").forEach(b=> b.onclick = ()=> { confirmDeleteId = b.dataset.del; render(); });
    document.querySelectorAll("[data-confirm-del]").forEach(b=> b.onclick = ()=>{
      const id = b.dataset.confirmDel;
      deleteRecordOnline(id).catch(e=>alert("Gagal menghapus: "+e.message));
      confirmDeleteId = null;
      render();
    });
    document.querySelectorAll("[data-cancel-del]").forEach(b=> b.onclick = ()=>{ confirmDeleteId=null; render(); });
    document.querySelectorAll("[data-status-change]").forEach(sel=>{
      sel.onchange = (e)=>{
        const rec = records.find(r=>r.id===sel.dataset.statusChange);
        if(rec){
          updateStatusOnline(sel.dataset.statusChange, e.target.value)
            .catch(e=>alert("Gagal memperbarui status: "+e.message));
          render();
        }
      };
    });
  }

  if(view==="form"){
    const f = document.getElementById("pengadaanForm");
    const closeBtn = document.getElementById("btnCloseForm");
    const cancelBtn = document.getElementById("btnCancelForm");
    if(closeBtn) closeBtn.onclick = ()=> setView("list");
    if(cancelBtn) cancelBtn.onclick = ()=> setView("list");

    function syncFormFromDOM(){
      const fd = new FormData(f);
      for(const [k,v] of fd.entries()) form[k]=v;
    }
    function updateTotalDisplay(){
      const total = (Number(f.elements["qty"].value)||0) * (Number(f.elements["estimasiHarga"].value)||0);
      const totalEl = document.getElementById("estimasiTotalDisplay");
      if(totalEl) totalEl.value = formatRupiah(total);
    }
    if(f.elements["qty"]) f.elements["qty"].oninput = ()=>{ syncFormFromDOM(); updateTotalDisplay(); };
    if(f.elements["estimasiHarga"]) f.elements["estimasiHarga"].oninput = ()=>{ syncFormFromDOM(); updateTotalDisplay(); };

    f.onsubmit = (e)=>{
      e.preventDefault();
      const fd = new FormData(f);
      const updated = {...form};
      for(const [k,v] of fd.entries()) updated[k]=v;
      if(!updated.noPengadaan.trim() || !updated.namaBarang.trim() || !updated.qty || !updated.tglPengajuan) return;
      updated.qty = Number(updated.qty)||0;
      updated.estimasiHarga = Number(updated.estimasiHarga)||0;

      saveRecordOnline(updated)
        .then(()=>setView("list"))
        .catch(e=>alert("Gagal menyimpan: "+e.message));
    };
  }
}

function renderListOnly(){
  // re-render just the list without losing search focus is tricky with full re-render,
  // so we do a full render but restore focus/cursor for search.
  const active = document.activeElement;
  const wasSearch = active && active.id === "searchInput";
  const cursorPos = wasSearch ? active.selectionStart : null;
  render();
  if(wasSearch){
    const el = document.getElementById("searchInput");
    if(el){ el.focus(); el.selectionStart = el.selectionEnd = cursorPos; }
  }
}

// ---------- Nav wiring ----------
document.querySelectorAll(".nav button").forEach(b=>{
  b.addEventListener("click", ()=> setView(b.dataset.view));
});
document.getElementById("btnAddSidebar").addEventListener("click", openNewForm);

// ---------- Init ----------
initTheme();
if(onlineMode()){
  showSyncStatus("Menghubungkan...");
  loadRecordsOnline().then(startAutoSync);
}else{
  loadRecords();
  render();
  showSyncStatus("Mode lokal — isi API_URL untuk sinkron HP ↔ PC");
}
</script>
